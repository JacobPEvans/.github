# dryvist org-wide pre-commit base template (non-Nix consumers).
#
# Nix-flake consumers should NOT use this file. They get the same hooks
# via `imports = [ inputs.nix-devenv.flakeModules.base ];` with version
# pinning handled by flake.lock.
#
# Non-Nix consumers fetch this file at scaffold time and let Renovate
# keep `rev:` pins fresh:
#
#   gh api repos/JacobPEvans/.github/contents/precommit/templates/base.yaml \
#     -H "Accept: application/vnd.github.raw" > .pre-commit-config.yaml
#
# Hook set mirrors lib/pre-commit-hooks.nix in dryvist/nix-devenv so that
# Nix and non-Nix consumers run an identical baseline.
---
repos:
  - repo: local
    hooks:
      - id: private-identifier-staged-additions
        name: private identifier staged additions
        entry: bash
        args:
          - -c
          - |
            list_file="$HOME/.config/gh-guard/identifiers.txt"
            if [ ! -f "$list_file" ]; then
              printf '%s\n' "warning: private identifier list is absent; skipping local scan" >&2
              exit 0
            fi
            if [ ! -r "$list_file" ]; then
              printf '%s\n' "error: private identifier list is unreadable" >&2
              exit 1
            fi
            set -o pipefail
            git diff --cached --unified=0 --no-ext-diff --no-color -- |
              awk -v list_file="$list_file" '
                BEGIN {
                  while ((getline term < list_file) > 0) {
                    sub(/\r$/, "", term)
                    sub(/^[[:space:]]+/, "", term)
                    sub(/[[:space:]]+$/, "", term)
                    if (term == "" || term ~ /^#/) continue
                    terms[++term_count] = tolower(term)
                  }
                  close(list_file)
                }
                /^diff --git / { path = ""; next }
                /^\+\+\+ / {
                  path = substr($0, 5)
                  sub(/^b\//, "", path)
                  next
                }
                /^@@ / {
                  line = $0
                  sub(/^.*\+/, "", line)
                  sub(/,.*/, "", line)
                  sub(/ .*/, "", line)
                  line_number = line + 0
                  next
                }
                /^\+/ {
                  added = tolower(substr($0, 2))
                  for (i = 1; i <= term_count; i++) {
                    if (index(added, terms[i]) > 0) {
                      printf "%s:%d: private identifier\n", path, line_number
                      failed = 1
                      break
                    }
                  }
                  line_number++
                  next
                }
                /^ / { line_number++; next }
                END { exit failed }
              '
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      # Hook id is `trailing-whitespace`. (`trim-trailing-whitespace` is the Nix
      # git-hooks.nix ATTR name and is NOT a valid pre-commit-hooks id — it errors.)
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        # Picks up .markdownlint-cli2.yaml from the repo root (the
        # canonical version copied from JacobPEvans/.github).
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor
        files: ^\.github/workflows/.*\.ya?ml$
        args:
          - --persona=regular
          - --min-severity=medium
          - --min-confidence=medium
          - --config
          # The org-wide zizmor policy lives next to this file in the
          # JacobPEvans/.github root. Repos must materialize it at the
          # same path or override with --config <local-path>.
          - zizmor.yml
