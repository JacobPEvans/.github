# dryvist ansible pre-commit template (non-Nix consumers).
#
# Includes the base hook set plus ansible-lint + yamllint. Both consume
# canonical configs from JacobPEvans/.github at precommit/configs/, which
# the consumer materializes alongside .pre-commit-config.yaml:
#
#   gh api repos/JacobPEvans/.github/contents/precommit/configs/ansible-lint.yml \
#     -H "Accept: application/vnd.github.raw" > .ansible-lint
#   gh api repos/JacobPEvans/.github/contents/precommit/configs/yamllint.yml \
#     -H "Accept: application/vnd.github.raw" > .yamllint.yml
#
# Nix-flake consumers should NOT use this file. They get equivalent
# coverage via `imports = [ inputs.nix-devenv.flakeModules.ansible ];`.
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      # Hook id is `trailing-whitespace` (not the Nix attr `trim-trailing-whitespace`).
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor
        files: ^\.github/workflows/.*\.ya?ml$
        args:
          - --persona=regular
          - --min-severity=medium
          - --min-confidence=medium
          - --config
          - zizmor.yml

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        # Lints only the staged files, one run at a time per machine; CI runs the full-repo lint.
        entry: |-
          sh -c '
          mkdir -p "$HOME/.cache" && exec 9>"$HOME/.cache/pre-commit-ansible-lint.lock" || exit 1
          msg="another ansible-lint is running on this machine; retry later"
          if [ -x /usr/bin/lockf ]; then
            /usr/bin/lockf -s -t 900 9 || { echo "$msg"; exit 1; }
          elif command -v flock >/dev/null 2>&1; then
            flock -w 900 9 || { echo "$msg"; exit 1; }
          else
            echo "ansible-lint: no lockf/flock found; running without the machine-wide lock" >&2
          fi
          exec env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE ansible-lint "$@"
          ' ansible-lint
        files: \.(yaml|yml)$
        pass_filenames: true
        always_run: false

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
