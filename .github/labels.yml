# =============================================================================
# dryvist Standard Labels
# =============================================================================
# Canonical label set for all repositories.
# Applied to every unarchived org repository by dryvist/tofu-github.
#
# Categories:
#   type:*     - What kind of change (aligns with semantic versioning)
#   priority:* - Urgency level
#   size:*     - Effort estimation
#   ai:*       - AI workflow state
#   (ungrouped) - Triage/admin labels
#
# Requirements (enforced via issue templates):
#   - At least one type:* label
#   - Exactly one priority:* label
#   - Exactly one size:* label
#
# Color Standard:
#   All colors MUST use Tailwind CSS palette hex values (without #).
#   Reference: https://tailwindcss.com/docs/customizing-colors
# =============================================================================

# =============================================================================
# TYPE LABELS - What kind of change is this? (Categorical, distinct colors)
# Each type has a unique color for easy visual identification. No overlap with priority/size.
# =============================================================================
- name: "type:bug"
  color: "DC2626"
  description: "Bug - Something isn't working (semver: PATCH)"

- name: "type:feature"
  color: "3B82F6"
  description: "Feature - New feature or request (semver: MINOR)"

- name: "type:breaking"
  color: "7C2D12"
  description: "Breaking - Breaking changes (semver: MAJOR)"

- name: "type:docs"
  color: "8B5CF6"
  description: "Docs - Documentation only changes"

- name: "type:chore"
  color: "64748B"
  description: "Chore - Maintenance tasks, dependencies, tooling"

- name: "type:ci"
  color: "0EA5E9"
  description: "CI - CI/CD pipeline changes"

- name: "type:test"
  color: "22C55E"
  description: "Test - Adding or correcting tests"

- name: "type:refactor"
  color: "EAB308"
  description: "Refactor - Code change with no functional change"

- name: "type:perf"
  color: "F97316"
  description: "Perf - Performance improvements"

- name: "type:security"
  color: "991B1B"
  description: "Security - Security vulnerability or hardening (semver: PATCH)"

# =============================================================================
# PRIORITY LABELS - How urgent is this? (Heat map: Red → Orange → Yellow → Green)
# Critical = hot red, Low = cool green (intuitive urgency indicator)
# =============================================================================
- name: "priority:critical"
  color: "B91C1C"
  description: "Critical - Requires immediate attention (semver: emergency)"

- name: "priority:high"
  color: "EA580C"
  description: "High - Should be addressed soon (semver: priority)"

- name: "priority:medium"
  color: "F59E0B"
  description: "Medium - Normal workflow (semver: standard)"

- name: "priority:low"
  color: "059669"
  description: "Low - Address when time permits (semver: backlog)"

# =============================================================================
# SIZE LABELS - How much effort is this? (Green intensity: Light → Dark)
# XS = very light, XL = dark (effort intensity gradient)
# =============================================================================
- name: "size:xs"
  color: "D1FAE5"
  description: "XS - Trivial change, <1 hour"

- name: "size:s"
  color: "A7F3D0"
  description: "S - Simple change, 1-4 hours"

- name: "size:m"
  color: "6EE7B7"
  description: "M - Moderate effort, 1-2 days"

- name: "size:l"
  color: "34D399"
  description: "L - Significant work, 3-5 days"

- name: "size:xl"
  color: "047857"
  description: "XL - Major effort, 1+ weeks"

# =============================================================================
# WORKFLOW LABELS - Issue and PR lifecycle management
# =============================================================================
- name: "ready-for-dev"
  color: "10B981"
  description: "Ready - Shaped, requirements clear, ready for development"

- name: "good-first-issue"
  color: "7C3AED"
  description: "Good for newcomers - Well-scoped, documented, beginner-friendly"

- name: "ai:created"
  color: "FCD34D"
  description: "AI-generated - Requires human approval before implementation"

- name: "ai:ready"
  color: "06B6D4"
  description: "AI-ready - Human-approved and ready for AI agent implementation"

# =============================================================================
# AI REVIEW LABELS - Automated review workflow state
# =============================================================================
- name: "ai:reviewed"
  color: "FB923C"
  description: "Claude-reviewed - AI final review completed on this PR"

- name: "ai:skip-review"
  color: "94A3B8"
  description: "Skip AI review - Opt out of all automated AI reviews"

# =============================================================================
# RELEASE COORDINATION LABEL
# =============================================================================
- name: "release:in-progress"
  color: "0D9488"
  description: "Promotion PR in flight; develop is frozen"

- name: "fast-path"
  color: "0e8a16"
  description: "Opt-in: skip heavy suites when the diff is under 15 lines and 5 files."

# =============================================================================
# HUMAN REVIEW LABEL - The human counterpart to ai:* review state
# Applied by an AI flow to a main-targeted PR to request a human before merge.
# Neon lime stands out from the crowded amber/red ramps on purpose.
# =============================================================================
- name: "human:review"
  color: "A3E635"
  description: "Human review required before merge to main - AI must not merge without explicit instruction"

# -----------------------------------------------------------------------------
# TRIAGE LABELS - Administrative
# -----------------------------------------------------------------------------
- name: "duplicate"
  color: "CBD5E1"
  description: "Duplicate - This issue or pull request already exists"

- name: "invalid"
  color: "FDE047"
  description: "Invalid - This doesn't seem right"

- name: "wontfix"
  color: "FFFFFF"
  description: "Wontfix - This will not be worked on"

- name: "question"
  color: "E879F9"
  description: "Question - Further information is requested"

# =============================================================================
# AUTOMATION LABELS - Created by bots, preserved across label sync
# =============================================================================
- name: "dependencies"
  color: "A5B4FC"
  description: "Dependency updates - Automated by Renovate/Dependabot"

- name: "renovate"
  color: "A5B4FC"
  description: "Renovate bot - Automated dependency management"

# =============================================================================
# DEPENDENCY TRUST / REVIEW LABELS - Renovate tier model + AI dependency reviewer
# =============================================================================
- name: "dep:review"
  color: "F59E0B"
  description: "Trusted-org major update awaiting human review - never auto-merged"

- name: "risk:low"
  color: "22C55E"
  description: "AI dependency reviewer: low risk - eligible for auto-merge if native gates pass"

- name: "risk:medium"
  color: "F59E0B"
  description: "AI dependency reviewer: medium risk - human review required"

- name: "risk:high"
  color: "EF4444"
  description: "AI dependency reviewer: high risk - do not merge, human review required"

- name: "update:major"
  color: "B91C1C"
  description: "Major version update - never auto-merged; opens for human review"

- name: "bump:minor"
  color: "B45309"
  description: "First-party minor release bump - never auto-merged; opens for human review"

- name: "bump:major"
  color: "B91C1C"
  description: "First-party major release bump - never auto-merged; opens for human review"
