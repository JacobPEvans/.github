# Reusable: Python CI (lint / format / type / test gate)
#
# The org-wide Python gate, in ONE place. Consumers call this (directly or via
# `_ci-gate.yml`'s `python_ci` toggle) and carry NO `run:` and NO copied lint
# config of their own — this is the single home for both.
#
# What it runs:
#   gate  -> `uv run --extra dev pre-commit run --all-files` (ruff + ruff-format
#            + pyright + hygiene + markdownlint, all defined in the consumer's
#            .pre-commit-config.yaml whose tool config lives in pyproject.toml /
#            an @org shareable config — never copied).
#   test  -> pytest across the consumer's supported Python versions.
#
# Workflow security (zizmor) is a separate job — see `_zizmor.yml`, wired into
# `_ci-gate.yml` as its own always-on-PR Merge Gate job, not run here.
#
# ┌─────────────────────────── KEEP IN SYNC ───────────────────────────┐
# │ The hook set this runs is the dryvist Python standard, also defined │
# │ for Nix consumers in nix-devenv/flake-modules/profiles/python.nix   │
# │ and as the static template in precommit/templates/python.yaml.      │
# └─────────────────────────────────────────────────────────────────────┘
#
# Every config value below is an input with a default — nothing is hard-coded;
# a consumer (or org/repo `vars`) overrides any of them without editing this file.
name: _python-ci

on:
  workflow_call:
    inputs:
      python_versions:
        description: >-
          JSON array of Python versions for the pytest matrix. Default covers
          ALL currently non-EOL Python releases; a consumer narrows it (e.g. to
          min + latest) by passing its own array.
        type: string
        required: false
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      gate_python_version:
        description: Python version for the single-run lint/format/type gate.
        type: string
        required: false
        default: "3.14"
      runner_label:
        description: >-
          Runner label. Defaults to ubuntu-24.04; pass a RunsOn label to opt
          into self-hosted runners.
        type: string
        required: false
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        # TODO: switch to @v8 (major-moving) once Astral publishes that tag;
        # only v8.x.x full tags exist today, so this pins the latest full v8.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ inputs.gate_python_version }}
          enable-cache: true

      - name: Cache pre-commit hook environments
        id: pre-commit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          # A hook bump changes the key; restoring the newest older cache lets
          # pre-commit install only the changed hook instead of every env.
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # `uv run` installs the project + dev extra implicitly — no venv/install
      # script. Runs the consumer's .pre-commit-config.yaml hook set.
      - name: Lint / format / type gate (pre-commit)
        run: uv run --extra dev pre-commit run --all-files --show-diff-on-failure

      # A restored older cache still holds the superseded hook envs; drop them
      # before the new key is saved so the cache does not grow on every bump.
      - name: Drop superseded pre-commit hook environments
        if: steps.pre-commit-cache.outputs.cache-hit != 'true'
        run: uv run --extra dev pre-commit gc

  test:
    name: Test
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        # TODO: switch to @v8 (major-moving) once Astral publishes that tag;
        # only v8.x.x full tags exist today, so this pins the latest full v8.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        run: uv run --extra dev pytest
