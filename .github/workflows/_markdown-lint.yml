# Reusable: Markdown Lint
# Uses the calling repo's own markdownlint config, falling back to org defaults.
name: _markdown-lint

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to ubuntu-24.04. Pass a
          RunsOn label (see runs-on.com/configuration/job-labels) to opt
          the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout org markdownlint config
        # Pinned to the commit this reusable workflow was loaded from, so the
        # config matches the workflow version. `job.workflow_sha` is used, not
        # `github.job_workflow_sha`, which is empty when this workflow runs
        # nested; an empty `ref` silently checks out the default branch.
        if: hashFiles('.markdownlint-cli2.jsonc', '.markdownlint-cli2.yaml', '.markdownlint-cli2.cjs', '.markdownlint-cli2.mjs', '.markdownlint.jsonc', '.markdownlint.json', '.markdownlint.yaml', '.markdownlint.yml', '.markdownlint.cjs', '.markdownlint.mjs') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .markdownlint-cli2.yaml
          sparse-checkout-cone-mode: false
          path: .org-markdownlint-checkout
          persist-credentials: false

      - name: Apply org-default markdownlint config
        if: hashFiles('.markdownlint-cli2.jsonc', '.markdownlint-cli2.yaml', '.markdownlint-cli2.cjs', '.markdownlint-cli2.mjs', '.markdownlint.jsonc', '.markdownlint.json', '.markdownlint.yaml', '.markdownlint.yml', '.markdownlint.cjs', '.markdownlint.mjs') == ''
        run: cp .org-markdownlint-checkout/.markdownlint-cli2.yaml .markdownlint-cli2.yaml

      - name: List changed Markdown files
        # Pull requests lint only the Markdown they add or modify, so a PR is
        # never red for files it did not touch. HEAD is the PR merge commit and
        # HEAD^1 the base tip, so the diff is exactly the PR's change.
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          {
            echo 'files<<CHANGED_MD_EOF'
            git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.md' \
              ':!CHANGELOG.md' ':!**/node_modules/**' ':!**/.github/aw/imports/**' ':!.org-github/**'
            echo 'CHANGED_MD_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run markdownlint on changed files
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: ${{ steps.changed.outputs.files }}

      - name: Run markdownlint
        if: github.event_name != 'pull_request'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
            !**/node_modules/**
            # Vendored gh-aw upstream cache: wiped and regenerated by the
            # gh-aw-sync-upstream workflow, so its formatting is not ours to
            # fix. Excluded like node_modules — third-party, machine-managed.
            !**/.github/aw/imports/**
