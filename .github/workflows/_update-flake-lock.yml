# Reusable: relock the flake and open ONE pull request
#
# THE CONTRACT — one repo, one branch, one open flake PR, ever.
#
# Every trigger funnels into a single relock on the branch `chore/flake-lock`.
# A repository_dispatch that arrives while that PR is still open re-runs the
# update from the base branch, so the earlier input's bump is regenerated rather
# than lost, and the PR is amended in place instead of a second one being opened.
#
# MODES. `input` relocks that one root input (`nix flake update <input>`). Else
# `targeted` relocks the owned inputs behind their branch head. Else the whole
# lock is relocked except first-party (dryvist) inputs, which move only by their
# own release. Each changed first-party input is classified patch, minor or major
# from its nearest vX.Y.Z tags. Only patch and digest bumps with no nixpkgs* move
# auto-merge; every other PR is left open, held from the sweep by its bump or
# `needs-review` label.
#
# WHY THIS REPLACED TWO WORKFLOWS (2026-08-05)
#
# `_refresh-nixpkgs-channel.yml` refreshed exactly ONE input per call, so repos
# with both `nixpkgs` and `nixpkgs-unstable` used a matrix to call it twice.
# That never worked: its `concurrency` group keyed on `github.repository` alone,
# so both matrix legs landed in the same group and `cancel-in-progress: true`
# made leg two kill leg one after ~1 second. Measured on dryvist/nix-ai —
# 2026-07-28 and 2026-08-03 both show one leg cancelled at 1s and the survivor
# failing minutes later. Consequence: nix-home, nix-devenv and nix-ai all
# carried a permanently frozen `nixpkgs-unstable`.
#
# `_update-flake-input.yml` bumped one input onto `chore/bump-<input>`, a branch
# per input. nix-darwin took ten such PRs in the seven days to 2026-08-05, some
# duplicated the same day.
#
# `cancel-in-progress: false` below is deliberate and load-bearing: a dispatch
# must QUEUE behind a running relock, never cancel it. Do not "tidy" it to true.
#
# WHY RENOVATE DOES NOT DO THIS. Renovate advances a flake input when its
# REFERENCE changes. A channel branch's reference never changes — new commits
# land on the same branch — so Renovate has nothing to diff and the locked rev
# freezes forever. Advancing it means `nix flake update`, which in Renovate
# terms is lockFileMaintenance, and that is disabled for nix in
# renovate-presets.json (it looped ~60 PRs/week). The nix manager itself is off
# in renovate-nix.json, so this workflow is the single writer of flake.lock.
#
# Staleness is not cosmetic. A pin that drifts off the Hydra-evaluated channel
# head loses binary-cache coverage: nix-darwin#1804 measured 236 of 1009 closure
# paths with no substitute, forcing a source rebuild.
#
# NOTE ON UNTRUSTED INPUT: the only caller-supplied value is `input`, and it is
# used only after it matches a root input name of flake.lock. `client_payload.*`
# is attacker-settable on repository_dispatch, so no other payload field reaches
# a run step or the PR body. The moved-inputs table below says what changed.
name: _update-flake-lock

on:
  workflow_call:
    inputs:
      channels_dir:
        description: >-
          Optional path to a sub-flake that owns the channel pins (nix-devenv
          uses "channels"). When set, that sub-flake is relocked first, then the
          root flake, so the root lock picks up the new revs. Leave empty for
          repos that pin nixpkgs directly in the root flake.
        type: string
        required: false
        default: ""
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to the RunsOn 2-cpu linux
          runner used by the rest of the dryvist automation stack.
        type: string
        required: false
        default: "runs-on=${{ github.run_id }}/runner=2cpu-linux-x64"
      private_input_repos:
        description: >-
          Comma-separated repo names (same owner as the caller) to grant
          Nix read-only GitHub access to, for a private flake input. Empty
          by default.
        type: string
        required: false
        default: ""
      targeted:
        description: >-
          Relock only the owned inputs (scripts/flake-lock-fresh.sh) that are
          behind their branch head, and do nothing when none are. Third-party
          inputs such as nixpkgs never move, so the PR stays auto-mergeable.
          When false, the whole lock is relocked except first-party inputs.
        type: boolean
        required: false
        default: false
      input:
        description: >-
          One root input of the lock to relock, alone. Callers pass it from a
          repository_dispatch client_payload.input or a workflow_dispatch input.
          It must name a root input of flake.lock; any other value fails the run.
          Empty selects the targeted or whole-lock mode.
        type: string
        required: false
        default: ""
    secrets:
      GH_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: flake-lock-${{ github.repository }}
  # MUST stay false — see the header. A queued dispatch is correct; a cancelled
  # sibling is the bug this workflow was created to fix.
  cancel-in-progress: false

permissions: {}

jobs:
  # Targeted mode only: a seconds-long check, with no Nix install or cache
  # restore, that lists the owned inputs behind their branch head.
  stale:
    name: Find stale owned inputs
    if: inputs.targeted
    runs-on: ${{ inputs.runner_label }}
    environment: automation
    timeout-minutes: 5
    outputs:
      inputs: ${{ steps.find.outputs.inputs }}
    steps:
      - name: Generate read-only token for private flake inputs
        id: private-input-token
        if: inputs.private_input_repos != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.private_input_repos }}
          permission-contents: read

      # The caller sets `permissions: {}`, so GITHUB_TOKEN cannot read a private
      # caller repository. Default scope of this token is the caller repository.
      - name: Generate read-only token for the caller repository
        id: caller-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Explain a failed GitHub App token mint
        if: steps.caller-token.outcome == 'failure'
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "::error title=GitHub App token not minted::No token for $REPO. A 404 'get a repository installation' means the App is not installed on $REPO; install it there. A 401 'JSON web token could not be decoded' or a missing 'private-key' means vars.GH_APP_CLIENT_ID or secrets.GH_APP_PRIVATE_KEY is unset or belongs to another App; set both where this job can read them (repository, organization or the automation environment). The step above shows the API error."
          exit 1

      - name: Checkout flake.lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.caller-token.outputs.token }}
          persist-credentials: false
          sparse-checkout: flake.lock
          sparse-checkout-cone-mode: false

      - name: Checkout the freshness script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          persist-credentials: false
          sparse-checkout: scripts/flake-lock-fresh.sh
          sparse-checkout-cone-mode: false

      - name: List owned inputs behind their branch head
        id: find
        env:
          OWNERS: ${{ vars.FLAKE_INPUT_OWNERS }}
          GIT_TOKEN: ${{ steps.private-input-token.outputs.token }}
        run: |
          STALE_NAMES_FILE=stale.txt bash .gh-shared/scripts/flake-lock-fresh.sh flake.lock || true
          echo "inputs=$(paste -sd' ' stale.txt)" >> "$GITHUB_OUTPUT"

  relock:
    name: Relock flake.lock
    needs: stale
    if: ${{ !cancelled() && (inputs.input != '' || !inputs.targeted || needs.stale.outputs.inputs != '') }}
    runs-on: ${{ inputs.runner_label }}
    environment: automation
    # Intentionally non-negotiable: relocking or validating past 20 minutes is
    # a dependency or cache regression. Do not raise this cap; fix the root
    # cause so the failed workflow blocks the unhealthy lock update.
    timeout-minutes: 20
    # No job-level permissions: every caller sets `permissions: {}`, and a
    # called workflow may only downgrade. Checkout, PR creation and auto-merge
    # use the minted App token, never GITHUB_TOKEN.
    env:
      # jq definitions shared by the steps below. A lock node is first-party when its
      # owner is dryvist or one of the legacy JacobPEvans owners, or when its url (a
      # git input has no owner) points at one of them. fp_repo is the repository name.
      FIRST_PARTY_JQ: >-
        def fp: (.original // {}) as $o
        | ((($o.owner // "") | ascii_downcase) as $w
        | ($w == "dryvist" or $w == "jacobpevans" or $w == "jacobpevans-personal"))
        or (($o.url // "") | test("github[.]com[/:](dryvist|JacobPEvans)"; "i"));
        def fp_repo: .original.repo // (.original.url | capture("github[.]com[/:][^/]+/(?<r>[^/.?]+)").r);
    steps:
      - name: Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Explain a failed GitHub App token mint
        if: steps.app-token.outcome == 'failure'
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "::error title=GitHub App token not minted::No token for $REPO. A 404 'get a repository installation' means the App is not installed on $REPO; install it there. A 401 'JSON web token could not be decoded' or a missing 'private-key' means vars.GH_APP_CLIENT_ID or secrets.GH_APP_PRIVATE_KEY is unset or belongs to another App; set both where this job can read them (repository, organization or the automation environment). The step above shows the API error."
          exit 1

      - name: Generate read-only token for private flake inputs
        id: private-input-token
        if: inputs.private_input_repos != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.private_input_repos }}
          permission-contents: read

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3

      # Always read the ROOT flake.lock, even for repos with a channels
      # sub-flake: the root lock lists `channels` alongside every other root
      # input and carries their resolved revs, so it is the complete picture.
      - name: Snapshot the lock before relocking
        run: |
          # Resolve ROOT inputs via .nodes[.root].inputs. Node NAMES are not
          # root input names — a node literally called "nixpkgs" can belong to a
          # transitive dependency, which has produced wrong staleness readings
          # before. Only the root input map is authoritative.
          jq -S '. as $l | $l.nodes[$l.root].inputs
                 | with_entries(.value = ($l.nodes[(if (.value|type)=="string"
                     then .value else (.value|last) end)].locked.rev // "unlocked"))' \
            flake.lock > /tmp/lock-before.json
          echo "root inputs before:"; cat /tmp/lock-before.json

      - name: Relock the flake
        # env var, never direct interpolation into run: (injection risk).
        env:
          CHANNELS_DIR: ${{ inputs.channels_dir }}
          INPUT: ${{ inputs.input }}
          STALE_INPUTS: ${{ needs.stale.outputs.inputs }}
          NIX_CONFIG: >-
            ${{ inputs.private_input_repos != ''
                && format('access-tokens = github.com={0}', steps.private-input-token.outputs.token)
                || '' }}
        run: |
          if [ -n "$INPUT" ]; then
            # One named root input. The name must match a root input of this lock,
            # so no other value reaches nix. Any other name falls through to the
            # targeted or whole-lock mode below.
            if [[ $INPUT =~ ^[A-Za-z0-9_.-]+$ ]] &&
               jq -e --arg n "$INPUT" '.nodes[.root].inputs | has($n)' flake.lock > /dev/null; then
              nix flake update "$INPUT"
              exit 0
            fi
            echo "::notice::input name is not a root input of flake.lock; using the targeted or whole-lock mode"
          fi
          if [ -n "$STALE_INPUTS" ]; then
            # Targeted: only the owned inputs the stale job listed.
            read -ra stale <<<"$STALE_INPUTS"
            nix flake update "${stale[@]}"
            exit 0
          fi
          if [ -n "$CHANNELS_DIR" ]; then
            # The sub-flake owns its own lock; a root relock does not descend
            # into it, so it must be relocked first.
            (cd "$CHANNELS_DIR" && nix flake update)
          fi
          # Whole lock: every root input except first-party (dryvist) ones. Those
          # move only by their own release, never by a bare update.
          mapfile -t third_party < <(jq -r "$FIRST_PARTY_JQ"'
            . as $l | $l.nodes[$l.root].inputs | to_entries[]
            | .value as $v
            | ($l.nodes[if ($v | type) == "string" then $v else ($v | last) end]) as $n
            | select(($n | fp) | not) | .key' flake.lock)
          if [ "${#third_party[@]}" -gt 0 ]; then
            nix flake update "${third_party[@]}"
          fi

      - name: Validate flake
        env:
          NIX_CONFIG: >-
            ${{ inputs.private_input_repos != ''
                && format('access-tokens = github.com={0}', steps.private-input-token.outputs.token)
                || '' }}
        run: nix flake check --no-build

      - name: Report channel drift
        # Advisory only. The channel URL can lag briefly after a Hydra
        # evaluation, so a mismatch is a warning, never a hard failure. This is
        # the only real Hydra-alignment signal we have — the Renovate
        # `minimumReleaseAge` guard that claimed to cover it never once fired,
        # because Renovate cannot advance a channel pin at all.
        continue-on-error: true
        run: |
          ref=$(jq -r '.nodes | to_entries[]
            | select(.value.original.ref? | strings | test("-darwin$|^nixos-"))
            | .value.original.ref' flake.lock | head -1)
          if [ -z "$ref" ]; then
            echo "No channel-style nixpkgs ref found in flake.lock — skipping"
            exit 0
          fi
          channel_rev=$(curl --connect-timeout 5 --max-time 15 -sfL \
            "https://channels.nixos.org/$ref/git-revision" || echo "")
          flake_rev=$(jq -r --arg ref "$ref" '.nodes | to_entries[]
            | select(.value.original.ref? == $ref)
            | .value.locked.rev' flake.lock | head -1)
          if [ -z "$channel_rev" ] || [ -z "$flake_rev" ]; then
            echo "Could not resolve both revs — skipping"
            exit 0
          fi
          if [ "$flake_rev" != "$channel_rev" ]; then
            echo "::warning::$ref pinned to ${flake_rev:0:12} but channel head is ${channel_rev:0:12} — binary cache may be sparse"
          else
            echo "$ref matches Hydra channel HEAD (${flake_rev:0:12})"
          fi

      - name: Summarise what moved
        id: moved
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nixpkgs_moved=false" >> "$GITHUB_OUTPUT"
            echo "Already fully relocked — no PR needed."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          jq -S '. as $l | $l.nodes[$l.root].inputs
                 | with_entries(.value = ($l.nodes[(if (.value|type)=="string"
                     then .value else (.value|last) end)].locked.rev // "unlocked"))' \
            flake.lock > /tmp/lock-after.json

          # Per-input old -> new table for the PR body.
          jq -r -s '.[0] as $b | .[1] as $a
            | ($b + $a | keys)[]
            | . as $k
            | select(($b[$k] // "") != ($a[$k] // ""))
            | "| `\($k)` | `\(($b[$k] // "absent")[0:12])` | `\(($a[$k] // "absent")[0:12])` |"' \
            /tmp/lock-before.json /tmp/lock-after.json > /tmp/moved.md
          {
            echo "moved<<MOVED_EOF"
            cat /tmp/moved.md
            echo "MOVED_EOF"
          } >> "$GITHUB_OUTPUT"

          # First-party (dryvist) inputs whose locked rev changed: "name repo old new" per line.
          jq -r -s "$FIRST_PARTY_JQ"'
            .[0] as $b | .[1] as $l | $l.nodes[$l.root].inputs | to_entries[]
            | .value as $v
            | ($l.nodes[if ($v | type) == "string" then $v else ($v | last) end]) as $n
            | select($n | fp)
            | ($b[.key] // "unlocked") as $old
            | ($n.locked.rev // "unlocked") as $new
            | select($old != $new)
            | [.key, ($n | fp_repo), $old, $new] | @tsv' \
            /tmp/lock-before.json flake.lock > /tmp/first-party.tsv
          echo "first_party_repos=$(cut -f2 /tmp/first-party.tsv | sort -u | paste -sd, -)" >> "$GITHUB_OUTPUT"

          # Did any root input whose NAME begins with "nixpkgs" change rev?
          # A nixpkgs channel jump rebuilds the world on live machine configs,
          # so it gates auto-merge below.
          if jq -e -s '.[0] as $b | .[1] as $a
                | ($b + $a | keys)
                | map(select(startswith("nixpkgs")))
                | any(. as $k | ($b[$k] // "") != ($a[$k] // ""))' \
               /tmp/lock-before.json /tmp/lock-after.json > /dev/null; then
            echo "nixpkgs_moved=true" >> "$GITHUB_OUTPUT"
            echo "A nixpkgs* input moved — this PR needs human review."
          else
            echo "nixpkgs_moved=false" >> "$GITHUB_OUTPUT"
            echo "No nixpkgs* movement."
          fi

      # Read-only, scoped to the repositories whose first-party inputs changed.
      - name: Mint read token for changed first-party inputs
        id: first-party-token
        if: steps.moved.outputs.changed == 'true' && steps.moved.outputs.first_party_repos != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ steps.moved.outputs.first_party_repos }}
          permission-contents: read

      - name: Classify first-party bumps
        id: classify
        if: steps.moved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.first-party-token.outputs.token }}
          NIXPKGS_MOVED: ${{ steps.moved.outputs.nixpkgs_moved }}
        run: |
          # nearest <repo> <rev>: "<tag> <commit>" for the highest vX.Y.Z tag whose commit is <rev>
          # or one of its ancestors. Tags are tried highest first; the first one the compare API
          # reports as an ancestor wins. Nothing found prints nothing and returns non-zero.
          nearest() {
            local repo=$1 rev=$2 tag commit status
            for tag in $(gh api --paginate "repos/dryvist/$repo/tags" --jq '.[].name' 2>/dev/null |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r); do
              commit=$(gh api "repos/dryvist/$repo/commits/$tag" --jq .sha 2>/dev/null) || continue
              status=$(gh api "repos/dryvist/$repo/compare/$commit...$rev" --jq .status 2>/dev/null) || continue
              case $status in
                identical | ahead) echo "$tag $commit"; return 0 ;;
              esac
            done
            return 1
          }
          rank() {
            case $1 in digest) echo 0 ;; patch) echo 1 ;; minor) echo 2 ;; major) echo 3 ;; *) echo 4 ;; esac
          }

          # top is the highest rank across first-party bumps: -1 none, 0 digest, 1 patch,
          # 2 minor, 3 major, 4 unresolved or moved backwards.
          top=-1
          summary="$RUNNER_TEMP/flake-bump-summary.md"
          printf '%s\n%s\n' '| first-party input | from | to | bump |' '| --- | --- | --- | --- |' > "$summary"
          while IFS=$'\t' read -r name repo old new; do
            old_out=$(nearest "$repo" "$old") || old_out=""
            new_out=$(nearest "$repo" "$new") || new_out=""
            old_tag=${old_out%% *}
            new_tag=${new_out%% *}
            new_commit=${new_out#* }
            # A first-party input must land exactly on a release commit. A rev past the
            # latest release (unreleased commits) is held, whatever tag it descends from.
            if [ -z "$old_tag" ] || [ -z "$new_tag" ]; then
              cls="unknown"
            elif [ "$new_commit" != "$new" ]; then
              cls="unreleased"
            elif [ "$old_tag" = "$new_tag" ]; then
              cls="unknown"
            elif [ "$(printf '%s\n%s\n' "$old_tag" "$new_tag" | sort -V | tail -n 1)" != "$new_tag" ]; then
              cls="unknown"
            else
              IFS=. read -r old_major old_minor _ <<<"${old_tag#v}"
              IFS=. read -r new_major new_minor _ <<<"${new_tag#v}"
              if [ "$old_major" != "$new_major" ]; then
                cls="major"
              elif [ "$old_minor" != "$new_minor" ]; then
                cls="minor"
              else
                cls="patch"
              fi
            fi
            if [ "$(rank "$cls")" -gt "$top" ]; then top=$(rank "$cls"); fi
            echo "| \`$name\` | \`${old_tag:-unresolved}\` | \`${new_tag:-unresolved}\` | $cls |" >> "$summary"
          done < /tmp/first-party.tsv
          if [ "$top" -lt 0 ]; then : > "$summary"; fi

          # Auto-merge only when every first-party bump is digest or patch and no nixpkgs* input moved.
          automerge=false
          if [ "$top" -le 1 ] && [ "$NIXPKGS_MOVED" != true ]; then automerge=true; fi
          case $top in
            0 | 1) bump="patch" ;;
            2) bump="minor" ;;
            3) bump="major" ;;
            *) bump="" ;;
          esac

          labels=dependencies
          if [ "$NIXPKGS_MOVED" = true ] || [ "$top" -ge 4 ]; then labels="$labels,needs-review"; fi
          if [ -n "$bump" ]; then labels="$labels,bump:$bump"; fi

          {
            echo "automerge=$automerge"
            echo "labels=$labels"
            echo "summary<<SUMMARY_EOF"
            cat "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: pr
        if: steps.moved.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: chore/flake-lock
          delete-branch: true
          commit-message: "chore(deps): update flake.lock"
          title: "chore(deps): update flake.lock"
          body: |
            ${{ inputs.input != ''
              && 'Automated relock requested for one named input (`nix flake update <input>`), triggered by'
              || needs.stale.outputs.inputs != ''
              && format('Automated targeted relock of owned inputs behind their branch head (`nix flake update {0}`), triggered by', needs.stale.outputs.inputs)
              || 'Automated relock of every third-party input (`nix flake update`), triggered by' }}
            `${{ github.event_name }}`.

            | input | from | to |
            | --- | --- | --- |
            ${{ steps.moved.outputs.moved }}

            ${{ steps.classify.outputs.summary }}

            `nix flake check --no-build` passed.

            ${{ steps.moved.outputs.nixpkgs_moved == 'true'
              && '**A `nixpkgs*` input moved, so auto-merge is withheld.**'
              || steps.classify.outputs.automerge == 'true'
              && 'No `nixpkgs*` input moved and every first-party bump is patch-level, so this auto-merges once CI is green.'
              || '**Auto-merge is withheld.** A first-party input moved by a minor or major release, or its tag is unresolved.' }}
          labels: ${{ steps.classify.outputs.labels }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Enable auto-merge
        # Gated: only patch-level first-party bumps with no nixpkgs* move auto-merge.
        # Everything else stays open, held from the sweep by its bump or needs-review label.
        if: steps.classify.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR=$(gh pr list --head chore/flake-lock --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            # The PR on chore/flake-lock is amended in place, so labels from an earlier,
            # held run are removed before the PR is queued to merge.
            gh pr edit "$PR" --remove-label needs-review --remove-label bump:minor --remove-label bump:major 2>/dev/null || true
            gh pr merge "$PR" --auto --squash
          fi

      - name: Withhold auto-merge
        # The PR on chore/flake-lock is amended in place, so an earlier run may have queued
        # it to merge. A held run cancels that queue; labels alone only stop the sweep.
        if: steps.moved.outputs.changed == 'true' && steps.classify.outputs.automerge != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --disable-auto || true
          fi
