# Org-wide repo-conventions drift sweep.
#
# conventions-check.yml catches drift at PR time, but only on repos that have
# PRs — a repo created and left alone is never evaluated. This sweep covers
# that blind spot on a schedule and reports it where an agent or human will
# actually look: a job summary plus one upserted tracking issue in this repo.
#
# PUBLIC REPOS ONLY, deliberately. This repo is public, so its issue bodies,
# job summaries, and Actions logs are world-readable — naming a private repo
# here would publish the org's private topology. Private repos are not read at
# all, so this job needs no cross-repo credential; run the same checks locally
# for private detail (see AGENTS.md > New repo checklist).
#
# Per-check opt-outs are read from the governance IaC's own inventory at run
# time, so this workflow never keeps a second copy of them.
name: Repo Conventions Sweep

on:
  schedule:
    # Weekly, off the :00 mark so the org's runs do not pile onto the hour.
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-conventions-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Sweep public repos for conventions drift
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh cannot infer the repo from a git remote;
          # the issue upsert at the end would fail without this.
          GH_REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          # Governance IaC inventory: single source of truth for recorded
          # legitimate opt-outs.
          INVENTORY_OWNER: dryvist
          INVENTORY_REPO: tofu-github
          INVENTORY_PATH: config/orgs/dryvist/repos.yml
        run: |
          set -euo pipefail

          # --- inputs -------------------------------------------------------
          gh api "repos/${INVENTORY_OWNER}/${INVENTORY_REPO}/contents/${INVENTORY_PATH}" \
            --jq '.content' | base64 -d > inventory.yml
          # Flatten opt-outs once, as "<repo> <check> <check>...". Deliberately
          # expressed with to_entries/join rather than env-var indexing, which
          # is spelled differently by the two widely-installed yq
          # implementations — this form is identical in both, so the sweep can
          # be exercised locally and not only on a runner.
          yq -r '.conventions_exempt // {} | to_entries | .[]
                 | .key + " " + (.value | join(" "))' inventory.yml > exempt.txt

          gh repo list "$ORG" --visibility public --no-archived --limit 200 \
            --json name --jq '.[].name' | sort > public.txt
          test -s public.txt  # an empty listing is an auth failure, not "no drift"

          # --- per-repo checks ----------------------------------------------
          # A repo "releases" iff it has the caller workflow. The caller picks
          # the mode: config-free (passes release-type:) needs no config files;
          # manifest mode needs both. Asserting the config unconditionally
          # would flag config-free repos that release correctly.
          rows=""; drift=0; ok=0; exempted=0
          while read -r repo; do
            tree=$(gh api "repos/${ORG}/${repo}/git/trees/HEAD" \
              --jq '[.tree[].path] | join(" ")' 2>/dev/null || echo "")
            caller=$(gh api "repos/${ORG}/${repo}/contents/.github/workflows/release-please.yml" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")

            # Opt-outs are per-CHECK, not per-repo: a template that legitimately
            # never releases should still be told it is missing a LICENSE. A
            # whole-repo exemption would hide unrelated drift behind one
            # justified skip.
            skips=$(awk -v r="$repo" '$1 == r { $1 = ""; print }' exempt.txt)
            [ -n "$skips" ] && exempted=$((exempted + 1))

            gaps=""
            note_gap() {
              case " $skips " in *" $1 "*) return 0;; esac
              gaps="${gaps:+$gaps, }$1"
            }

            case " $tree " in *" LICENSE "*) ;; *) note_gap LICENSE;; esac
            case " $tree " in *" AGENTS.md "*) ;; *) note_gap AGENTS.md;; esac
            case " $tree " in
              *" flake.nix "*|*" .envrc "*) ;;
              *) note_gap dev-shell;;
            esac
            if [ -z "$caller" ]; then
              note_gap release-please
            elif ! printf '%s' "$caller" | grep -Eq "^[[:space:]]*release-type:[[:space:]]*[^[:space:]'\"]"; then
              case " $tree " in
                *" release-please-config.json "*) ;;
                *) note_gap rp-config;;
              esac
              case " $tree " in
                *" .release-please-manifest.json "*) ;;
                *) note_gap rp-manifest;;
              esac
            fi

            # .file-size.yml content lint: repos should only commit overrides,
            # never restate org defaults or carry an empty placeholder file.
            if case " $tree " in *" .file-size.yml "*) true;; *) false;; esac; then
              fs_cfg=$(gh api "repos/${ORG}/${repo}/contents/.file-size.yml" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
              if printf '%s' "$fs_cfg" | grep -Eq '^[[:space:]]*defaults:'; then
                note_gap file-size-defaults
              fi
              # sed, not grep -v: grep exits 1 when every line is a comment, and
              # under set -e that ends the whole sweep with no output.
              fs_body=$(printf '%s' "$fs_cfg" | sed -E '/^[[:space:]]*(#|$)/d')
              if ! printf '%s' "$fs_body" | grep -Eq '^[[:space:]]*(extended|exempt|scan):'; then
                note_gap file-size-redundant
              fi
            fi

            if [ -z "$gaps" ]; then
              ok=$((ok + 1))
            else
              drift=$((drift + 1))
              rows="${rows}| \`${repo}\` | ${gaps} |"$'\n'
            fi
          done < public.txt

          # --- report -------------------------------------------------------
          {
            echo "## Repo conventions drift"
            echo
            echo "Public repos scanned: $((ok + drift)) | compliant: ${ok} | drifted: ${drift}"
            echo "Repos with a recorded per-check opt-out: ${exempted}"
            echo
            if [ "$drift" -gt 0 ]; then
              echo "| Repo | Gaps |"
              echo "| --- | --- |"
              printf '%s' "$rows"
              echo
              echo "Fix by following AGENTS.md > New repo checklist, or record a"
              echo "justified opt-out under \`conventions_exempt:\` in the inventory."
            else
              echo "No drift."
            fi
          } > report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"

          # Upsert exactly one tracking issue; the body is regenerated each run
          # so stale rows never accumulate.
          title="Repo conventions drift (public repos)"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ "$drift" -eq 0 ]; then
            [ -n "$existing" ] && gh issue close "$existing" \
              --comment "Sweep is clean: every public repo meets the standard."
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
