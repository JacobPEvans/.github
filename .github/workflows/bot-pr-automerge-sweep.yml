# Deterministic backstop that merges eligible bot dependency PRs org-wide.
#
# WHY THIS EXISTS. Renovate is configured to merge its own PRs
# (renovate-presets.json: automerge:true, platformAutomerge:false), but in
# practice it usually does not. Sampling merged Renovate PRs across five
# dryvist repos in 2026-08, `app/renovate` was the merging actor on 2 of ~14;
# in mlx-benchmarks it was the merging actor on none of ~30. Every other one
# was merged by a person or an ad-hoc agent sweep. Two causes were fixed in
# renovate-presets.json alongside this workflow (digest updates matched no
# auto-merge rule at all; the lock-file automerge windows were four hours wide
# and a hosted Renovate run had to land inside one). Neither fix is a
# guarantee: both still depend on a hosted Renovate run happening at the right
# moment. This workflow is the guarantee. It re-derives eligibility from the
# GitHub API on its own schedule, so a missed Renovate run costs nothing.
#
# IT IS A BACKSTOP, NOT THE PRIMARY PATH. When Renovate merges first, this
# workflow finds nothing to do. Do not move policy here: the freshness/trust
# model stays in renovate-presets.json; this only re-checks the parts of it
# that are observable from the API.
#
# NO MODEL IS IN THE LOOP. Eligibility is computed in shell from API fields, so
# the outcome is reproducible and auditable. An agent must never hand-merge a
# bot PR to "help" — a bot PR this sweep will not merge is a policy defect to
# fix here, not to route around.
#
# TOKENS. Every READ (search, PR fields, check-runs, commit statuses) uses the
# job's own GITHUB_TOKEN against public data. Only the merge uses a GitHub App
# token, and that token is minted with `repositories:` set to exactly the repos
# discovered to have an open bot PR, carrying exactly contents:write and
# pull-requests:write. Reads deliberately do NOT use the App token: the
# check-runs and commit-status APIs need `checks: read` and `statuses: read`,
# which are implied by neither of those two permissions, so an App-token read
# would 403 and every PR would be skipped as unreadable while CI stayed green.
#
# BOUNDARY: discovery is by code search, which sees public repos only. No
# private dryvist repo currently has an open Renovate PR (verified 2026-08-22).
# If one ever adopts Renovate, it will not be swept and will need to be added
# to discovery explicitly — it will not fail loudly on its own.
name: Bot PR Automerge Sweep

on:
  schedule:
    # Hourly, off the :00 mark so the org's runs do not pile onto the hour.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Report what would be merged without merging. Defaults to true so a
          manual run is always safe; scheduled runs are always live.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: bot-pr-automerge-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: automation
    env:
      # Space-separated. Every author here produces MECHANICAL dependency PRs
      # whose eligibility is fully decidable from API fields — never an author
      # whose PRs carry human intent. app/dryvist-github-actions is the
      # flake.lock updater: it normally merges its own PRs within the same
      # minute, but when that self-merge fails nothing else was watching, so
      # those PRs sat open indefinitely while this sweep could not see them.
      BOT_AUTHORS: "app/renovate app/dryvist-github-actions"
      # Cap on the discovery search. Hitting it is reported, never silently
      # truncated.
      SEARCH_LIMIT: "200"
    steps:
      - name: Discover open bot PRs
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # No `|| true` anywhere here: a search that ERRORS must fail the job.
          # An empty result and a broken query look identical in the output but
          # not in the exit code, and a sweep that silently examines nothing is
          # indistinguishable from a sweep that found nothing to do. The loop
          # runs under `set -e`, so one failed author search fails the run
          # rather than silently narrowing the sweep to the authors that did
          # answer.
          : > parts.json
          for author in $BOT_AUTHORS; do
            gh search prs --owner "$ORG" --author "$author" --state open \
              --limit "$SEARCH_LIMIT" --json repository,number > part.json
            # The cap is PER SEARCH, so it has to be checked per author: a
            # combined total would hide one author truncating while another
            # returned few.
            n=$(jq 'length' part.json)
            if [ "$n" -ge "$SEARCH_LIMIT" ]; then
              echo "::warning::discovery for ${author} hit the ${SEARCH_LIMIT}-result cap; some bot PRs were not examined"
            fi
            cat part.json >> parts.json
          done
          # -s collects each author's array, `add` concatenates them. A PR has
          # exactly one author, so this cannot duplicate an entry.
          jq -s 'add' parts.json > found.json

          total=$(jq 'length' found.json)
          jq -r '[.[].repository.name] | unique | .[]' found.json > repos.txt

          echo "Discovered ${total} open bot PRs (${BOT_AUTHORS}) across $(wc -l < repos.txt) repos"
          # Written here, not in the merge step, so a run that discovers
          # nothing still produces a summary with a number in it. A silent
          # run and a run that examined nothing are otherwise identical.
          {
            echo "## Bot PR automerge sweep"
            echo
            echo "Discovered ${total} open bot PRs across $(wc -l < repos.txt) repos (authors: \`${BOT_AUTHORS}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "count=${total}"
            echo "repos<<EOF"
            cat repos.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Skipped entirely when nothing was found: create-github-app-token treats
      # an empty `repositories:` as "every repo in the installation", which is
      # the exact over-scoping this split exists to avoid.
      - name: Mint merge token, scoped to the repos with work
        id: token
        if: steps.discover.outputs.count != '0'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          # Reuses the existing org release App rather than provisioning a
          # second one; it is already installed org-wide with Contents +
          # Pull requests write. Swap these two lines if a dedicated automation
          # App is ever created.
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.discover.outputs.repos }}
          # Exactly what a squash merge needs: contents to write the merge
          # commit, pull-requests to close the PR. Nothing else.
          permission-contents: write
          permission-pull-requests: write

      - name: Merge eligible bot PRs
        if: steps.discover.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          # Kill switch and arming gate in one. A scheduled run is DRY until
          # this repo variable is set to the literal "true", so merging this
          # workflow cannot start merging PRs before a dispatched dry run has
          # been read. Unsetting it disarms the sweep without reverting code.
          SWEEP_LIVE: ${{ vars.BOT_SWEEP_LIVE }}
          # Minimum age of the PR HEAD COMMIT. Enforced here from the commit
          # timestamp so it holds even when Renovate never refreshes its own
          # renovate/stability-days status.
          #
          # DELIBERATELY SHORTER than the 3-day minimumReleaseAge in
          # renovate-presets.json, and the two are not meant to match. That
          # preset gates when a PR may be CREATED; this gates when an already
          # open PR may MERGE, and PR creation runs on two fixed weekly
          # windows, so a bump has normally aged well past its own release
          # before it is even proposed. Holding an open PR a further 72h past
          # that added visible backlog without adding soak: the batch lands in
          # one evening and then sits, so the org is never at zero open bot
          # PRs. 48h keeps a real independent soak while letting a batch clear
          # inside the same week it opened.
          MIN_AGE_HOURS: "48"
          # Minimum head-commit age for a FIRST-PARTY bump: a Renovate PR whose
          # title updates a dryvist/ package or a github.com/dryvist/ git source.
          # renovate-presets.json merges own-org dependencies with a zero-day
          # minimumReleaseAge, and the producer's own release gate already
          # exercised that version, so an independent soak adds delay only.
          # Third-party bumps keep MIN_AGE_HOURS. Majors and minors stay held
          # by label whatever this value is.
          FIRST_PARTY_MIN_AGE_HOURS: "0"
          # A bot PR still open past this is a policy defect, not a backlog
          # item. The job fails so the failure notification surfaces it.
          STALL_DAYS: "7"
        run: |
          set -euo pipefail

          now=$(date -u +%s)
          min_age=$(( MIN_AGE_HOURS * 3600 ))
          stall_age=$(( STALL_DAYS * 86400 ))

          # A manual run honours its input. A scheduled run is dry unless armed.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY_RUN="$DISPATCH_DRY_RUN"
          elif [ "$SWEEP_LIVE" = "true" ]; then
            DRY_RUN=false
          else
            DRY_RUN=true
          fi

          # Reuse the discovery output rather than searching again. A second
          # search could return a different set than the one the merge token
          # was scoped to — a PR appearing between the two would be attempted
          # with a token that cannot reach its repo and reported as a merge
          # failure, and a PR merged between them would empty the list and
          # fail a non-empty assertion for no reason.
          jq -r '.[] | "\(.repository.name) \(.number)"' found.json | sort -u > work.txt

          merged=0; skipped=0; stalled=0; failed=0; examined=0
          rows=""; stall_rows=""
          : > reasons.txt

          while read -r repo num; do
            examined=$(( examined + 1 ))

            # Re-read each PR individually rather than trusting search output.
            # GitHub computes mergeability ASYNCHRONOUSLY: a cold query returns
            # mergeable/mergeStateStatus of UNKNOWN and only kicks off the
            # computation, so a single read would skip an eligible PR as
            # "not-mergeable" on every run and quietly defeat this whole
            # workflow. Observed live on a PR that read MERGEABLE moments
            # earlier. Retry until GitHub answers.
            pr='{}'
            for attempt in 1 2 3 4; do
              pr=$(gh pr view "$num" --repo "${ORG}/${repo}" \
                --json number,title,author,labels,mergeable,mergeStateStatus,headRefName,headRefOid \
                2>/dev/null || echo '{}')
              [ "$(jq -r '.mergeable // "UNKNOWN"' <<<"$pr")" != "UNKNOWN" ] && break
              sleep $(( attempt * 3 ))
            done

            sha=$(jq -r '.headRefOid // ""' <<<"$pr")
            state=$(jq -r '.mergeStateStatus // "UNKNOWN"' <<<"$pr")
            mergeable=$(jq -r '.mergeable // "UNKNOWN"' <<<"$pr")
            branch=$(jq -r '.headRefName // "?"' <<<"$pr")
            title=$(jq -r '.title // ""' <<<"$pr")
            author=$(jq -r '.author.login // ""' <<<"$pr")
            held=$(jq -r 'any(.labels[]?; .name == "update:major" or .name == "bump:minor" or .name == "bump:major" or .name == "needs-review")' <<<"$pr")

            if [ -z "$sha" ]; then
              skipped=$(( skipped + 1 ))
              rows="${rows}| \`${repo}#${num}\` | skipped | pr-unreadable |"$'\n'
              continue
            fi

            # Anchor the soak on the HEAD COMMIT, never on the PR's createdAt.
            # Renovate updates a PR in place: same PR, new commit carrying a
            # newer digest or lock state, createdAt unchanged. Since this sweep
            # deliberately exempts renovate/stability-days, commit age is the
            # ONLY soak it enforces — reading createdAt would let a five-day-old
            # PR carrying a one-hour-old dependency through, which is exactly
            # the 3-day stabilization the presets promise.
            committed=$(gh api "repos/${ORG}/${repo}/commits/${sha}" \
              --jq '.commit.committer.date' 2>/dev/null || echo "")
            if [ -z "$committed" ]; then
              skipped=$(( skipped + 1 ))
              rows="${rows}| \`${repo}#${num}\` | skipped | head-commit-unreadable |"$'\n'
              continue
            fi

            age=$(( now - $(date -u -d "$committed" +%s) ))
            reason=""

            # Majors and minors never auto-merge, and neither does a flake bump that
            # moved nixpkgs or landed off a release. The labels are read, never parsed
            # for versions: update:major comes from renovate-presets.json; bump:minor,
            # bump:major and needs-review come from _update-flake-lock.yml.
            [ "$held" = "true" ] && reason="held-label"
            [ -z "$reason" ] && [ "$mergeable" != "MERGEABLE" ] && reason="not-mergeable"
            # BLOCKED covers unresolved review threads and missing required
            # checks; DIRTY is a conflict; BEHIND/DRAFT are Renovate's to fix.
            case "$state" in
              CLEAN|UNSTABLE) ;;
              *) [ -z "$reason" ] && reason="state:${state}" ;;
            esac
            # A first-party bump (see FIRST_PARTY_MIN_AGE_HOURS) ages on its own
            # threshold; every other bump keeps MIN_AGE_HOURS. A title is
            # attacker-controlled, so it counts only on a PR that Renovate
            # itself opened: any other author, whatever the title says, keeps
            # the full soak.
            pr_min_age=$min_age
            pr_min_hours=$MIN_AGE_HOURS
            if [ "$author" = "app/renovate" ] \
              && [[ "$title" =~ ^[a-z]+(\([a-z0-9-]+\))?:\ update\ (dryvist/|https://github\.com/dryvist/) ]]; then
              pr_min_age=$(( FIRST_PARTY_MIN_AGE_HOURS * 3600 ))
              pr_min_hours=$FIRST_PARTY_MIN_AGE_HOURS
            fi
            [ -z "$reason" ] && [ "$age" -lt "$pr_min_age" ] \
              && reason="age:$(( age / 3600 ))h<${pr_min_hours}h"

            # UNSTABLE is accepted only when the sole non-green signal is
            # Renovate's own renovate/stability-days status. That status
            # advances only on a Renovate run, so gating on it would
            # reintroduce the very dependency this workflow exists to remove —
            # the PR age checked above is the independent soak. Any other
            # failing or pending signal still blocks.
            if [ -z "$reason" ]; then
              # Each blocking check is reported as name(verdict), never folded
              # into a bare "failed". `cancelled` and `timed_out` mean the check
              # NEVER CONCLUDED — a runner eviction, a superseded run, a job
              # that hit its timeout — which is a different thing from a check
              # that ran and said no. Both block here, deliberately: an
              # unexamined check is not a passing one. But a chronic
              # infrastructure timeout and a genuine test failure need
              # different fixes, so the summary has to tell them apart.
              # `neutral` and `skipped` count as satisfied, matching how GitHub
              # itself treats them for required checks.
              bad=$(gh api "repos/${ORG}/${repo}/commits/${sha}/check-runs" --paginate \
                --jq '[.check_runs[]
                       | select(.status != "completed"
                                or (.conclusion | IN("success","neutral","skipped") | not))
                       | "\(.name)(\(if .status != "completed" then .status else .conclusion end))"]
                      | join(",")' 2>/dev/null || echo "API_ERROR")
              [ "$bad" = "API_ERROR" ] && reason="checks-unreadable"
              [ -z "$reason" ] && [ -n "$bad" ] && reason="checks:${bad}"
            fi
            if [ -z "$reason" ]; then
              bad=$(gh api "repos/${ORG}/${repo}/commits/${sha}/status" \
                --jq '[.statuses[]
                       | select(.context != "renovate/stability-days")
                       | select(.state != "success")
                       | .context] | join(",")' 2>/dev/null || echo "API_ERROR")
              [ "$bad" = "API_ERROR" ] && reason="status-unreadable"
              [ -z "$reason" ] && [ -n "$bad" ] && reason="status:${bad}"
            fi

            if [ -n "$reason" ]; then
              skipped=$(( skipped + 1 ))
              echo "skipped  ${repo}#${num}  ${reason}"
              # Tallied so a reason holding several PRs can be surfaced once,
              # loudly, at the end of the run.
              echo "$reason" >> reasons.txt
              rows="${rows}| \`${repo}#${num}\` | skipped | ${reason} |"$'\n'
              # A PR this sweep will not merge, and that has outlived the
              # policy, is a defect in the config above — not a backlog item.
              # Counted only here: a PR merged on this run was never stuck. A label hold
              # waits on a human by design, so only an unlabelled hold can be a defect.
              if [ "$age" -gt "$stall_age" ] && [ "$reason" != "held-label" ]; then
                stalled=$(( stalled + 1 ))
                stall_rows="${stall_rows}| \`${repo}#${num}\` | ${reason} | $(( age / 86400 ))d |"$'\n'
              fi
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would-merge  ${repo}#${num}  ${branch}"
              rows="${rows}| \`${repo}#${num}\` | would-merge | ${branch} |"$'\n'
              continue
            fi

            # The App token is used HERE and nowhere else. --squash matches
            # renovate-presets.json automergeStrategy. No --base flag: gh
            # merges into the PR's own base, which is `develop` on git-flow
            # repos and `main` on trunk repos. No --delete-branch either:
            # delete_branch_on_merge is already set on these repos, and losing
            # the race with it would be reported here as a merge failure that
            # did not happen.
            if GH_TOKEN="$MERGE_TOKEN" gh pr merge "$num" --repo "${ORG}/${repo}" --squash; then
              merged=$(( merged + 1 ))
              echo "merged  ${repo}#${num}  ${branch}"
              rows="${rows}| \`${repo}#${num}\` | merged | ${branch} |"$'\n'
            else
              failed=$(( failed + 1 ))
              echo "::error::merge rejected for ${repo}#${num} (${branch})"
              rows="${rows}| \`${repo}#${num}\` | MERGE-FAILED | ${branch} |"$'\n'
            fi
          done < work.txt

          [ "$DRY_RUN" = "true" ] && mode="dry-run" || mode="live"

          # A gate that holds the same PRs for the same reason on every run,
          # and says nothing louder each time, is how a correct gate gets
          # loosened by someone who cannot see why it was tight. A check that
          # is broken on the BASE branch blocks every PR in that repo forever
          # — the sweep is then not merely cautious there, it has zero
          # throughput — and the hold reason is identical each time, so
          # nothing distinguishes it from ordinary caution. Any reason holding
          # more than one PR is called out once, as a warning annotation.
          if [ -s reasons.txt ]; then
            while read -r n why; do
              [ "$n" -gt 1 ] && echo "::warning::${n} PRs are held on the same reason: ${why} — check whether this is broken on the base branch rather than in the PRs"
            done < <(sort reasons.txt | uniq -c | sort -rn)
          fi

          # Repeated on stdout as well as in the summary. A step summary is
          # readable in the web UI and essentially not readable from the API,
          # so a run whose every decision lived only there could not be
          # inspected by the next agent or by a script.
          echo "mode=${mode} examined=${examined} merged=${merged} skipped=${skipped} failed=${failed} stalled=${stalled}"

          # "examined" is printed unconditionally so a quiet run carries a
          # number: a sweep that found nothing eligible and a sweep that
          # examined nothing at all read identically otherwise.
          {
            echo
            echo "Mode: ${mode} | PRs examined: ${examined} | merged: ${merged} | skipped: ${skipped} | merge failures: ${failed}"
            echo
            echo "| PR | Outcome | Detail |"
            echo "| --- | --- | --- |"
            printf '%s' "$rows"
            if [ -n "$stall_rows" ]; then
              echo
              echo "### Stalled past ${STALL_DAYS}d — policy defect, fix the config"
              echo
              echo "| PR | Held by | Age |"
              echo "| --- | --- | --- |"
              printf '%s' "$stall_rows"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail on a merge that was attempted and rejected, or on a PR that
          # has outlived the policy. Both mean the config no longer matches
          # reality, and a green scheduled run would hide that.
          [ "$failed" -eq 0 ] && [ "$stalled" -eq 0 ]
