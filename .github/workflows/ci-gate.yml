# CI Gate — thin wrapper over our own org reusable, dogfooded on the hub
# itself. `markdown_lint`, `file_size`, `dependency_review` and `zizmor` ride
# their defaults; `nix_validate` is opted in because this repo ships Nix
# modules to consumer repos, and the `nix` filter also makes `file_size`
# fire on flake edits.
name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job id `gate` is the org-canonical caller shape: the required status
  # check context is `gate / Merge Gate` on every consumer.
  gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # `actions: write` must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: ./.github/workflows/_ci-gate.yml
    with:
      nix_validate: true
      workflow_lint: true
      test_command: "node --test 'tests/**/*.test.js' tests/ci-gate-aggregate.test.mts"
      filters: |
        markdown:
          - '**.md'
          - '.markdownlint*'
        nix:
          - '**.nix'
          - 'flake.lock'
