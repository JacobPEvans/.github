# CI Gate — thin wrapper over our own org reusable, dogfooded on the hub
# itself. `markdown_lint`, `file_size`, `dependency_review` and `zizmor` ride
# their defaults; `nix_validate` is opted in because this repo ships Nix
# modules to consumer repos, and the `nix` filter also makes `file_size`
# fire on flake edits.
name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job id `gate` is the org-canonical caller shape: the required status
  # check context is `gate / Merge Gate` on every consumer.
  gate:
    permissions:
      contents: read
      pull-requests: read
      # The standard caller grant. No job in the gate requests
      # `actions: write`; a called workflow can never exceed the caller's
      # grant, so the standard shape keeps it.
      actions: write
    uses: ./.github/workflows/_ci-gate.yml
    with:
      nix_validate: true
      workflow_lint: true
      test_command: "node --test 'tests/**/*.test.js'"
      filters: |
        markdown:
          - '**.md'
          - '.markdownlint*'
        nix:
          - '**.nix'
          - 'flake.lock'
