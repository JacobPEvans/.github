# Reusable: Agent PR Body (incident provenance, advisory pilot)
#
# A PR from an App identity (`[bot]` login) or with an `Agent:` body marker
# must cite an incident id (`Zammad <n>`/`Vikunja <n>`); missing warns, only
# fails if `block: true`. Wired into `_ci-gate.yml` needs-free (never in
# `gate.needs`), so it cannot affect the Merge Gate. No PR comment — that
# needs `pull-requests: write`, over the PERMISSIONS INVARIANT there;
# `contents: read` is for the checkout only. Body/login pass untouched into a
# regex-only Node module, never interpolated into a shell command.
name: _agent-pr-body

on:
  workflow_call:
    inputs:
      block:
        description: Fail instead of warning. Keep false during the pilot.
        type: boolean
        default: false
      runner_label:
        description: Runner label. Defaults to ubuntu-24.04.
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  check:
    name: Agent PR Body
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      # Sparse-checkout the script (a consumer's own checkout never has it) —
      # same pattern as docs-publisher-provenance.yml's policy fetch.
      - name: Fetch the policy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts/agent-pr-body.js
          sparse-checkout-cone-mode: false
          path: .org-policy

      - name: Require an incident id in an agent-authored PR body
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          AGENT_PR_BODY_BLOCK: ${{ inputs.block }}
        with:
          script: |
            const run = require('./.org-policy/.github/scripts/agent-pr-body.js');
            await run({ context, core });
