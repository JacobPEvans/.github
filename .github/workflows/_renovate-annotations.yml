# Reusable: Renovate Annotation Check
#
# Fails when a version pin sits in a path the annotated-pin Renovate
# customManagers cover (role defaults/vars/tasks/templates, inventory,
# group_vars, host_vars, playbooks, scripts, requirements*.yml — see
# renovate-presets.json) but carries no `# renovate: datasource=...
# depName=...` comment above it. Such a pin is invisible to Renovate: it
# never appears anywhere and never gets a bump PR. `_image:` keys are exempt
# — the separate no-annotation docker-image customManager already tracks
# those by pattern.
#
# A pin that is deliberately NOT a Renovate-trackable dependency (a PVE-host
# expected-version guard, an ISO/template name with no public datasource)
# satisfies this check with `# renovate: ignore — <reason>` above it — that
# comment starts with `# renovate:` so the check passes, but carries no
# `datasource=` so no customManager ever matches it or opens a PR for it.
#
# It also reports floating pins in role defaults and group_vars: a `*_image:`
# without an exact x.y.z tag and a sha256 digest, and a `*_version:` set to
# latest, release or stable. Those are warnings unless `pin_enforce` is true.
#
# Exit codes: 0 clean, 1 unannotated pin(s) found (or a floating pin in enforce
# mode), 2 zero files matched the covered path set (instrument error — check the
# toggle/ROOT, not a pass).
name: _renovate-annotations

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to ubuntu-24.04. Pass a
          RunsOn label to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-24.04
      pin_enforce:
        description: >-
          Fail on floating container image and version pins (see the header)
          in role defaults and group_vars. Default false reports them as
          warnings and the job passes, so a repo can adopt pins gradually.
          Set true once the repo's pins have landed. Opt a single line out
          with `# pin-exempt: <reason>` on that line.
        type: boolean
        default: false

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sparse-checkout the shared annotation checker from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: scripts/check-renovate-annotations.sh
          sparse-checkout-cone-mode: false

      - name: Check Renovate annotations
        env:
          PIN_CHECK_MODE: ${{ inputs.pin_enforce && 'enforce' || 'warn' }}
        run: bash .gh-shared/scripts/check-renovate-annotations.sh
