# PR Auto-Merge
#
# Injected into every repository as an organization required workflow. When a
# PR opens, reopens or leaves draft, it turns on native auto-merge (squash), so
# the PR merges as soon as its required checks pass.
#
# Skipped: draft PRs, PRs from forks, promotions (develop into the default
# branch, which merge by merge commit through their own flow) and PRs labelled
# human:review.
#
# Auto-merge waits only for checks an active rule requires, so it is armed only
# when the base branch's active rules require a "Merge Gate" status check.
# Without one, the job warns and arms nothing.
#
# The merge is armed with the release App's token, not github.token, so the
# resulting push still triggers the base branch's workflows. Without the App
# variable and secret the job warns and succeeds, so a missing org setting never
# blocks a PR. A repository that does not allow squash merges fails the job.
name: PR Auto-Merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  automerge:
    name: Enable Auto-Merge
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && !(github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == github.event.repository.default_branch)
      && !contains(github.event.pull_request.labels.*.name, 'human:review') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      # As a required workflow this runs in the consumer repo; fetch the check from this workflow's own commit.
      - name: Check out the readiness check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .pr-automerge
          persist-credentials: false
          sparse-checkout: scripts/pr-automerge-ready.sh
          sparse-checkout-cone-mode: false
      - name: Check for a required merge gate and the release App
        id: app
        env:
          APP_ID: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          HAS_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: bash .pr-automerge/scripts/pr-automerge-ready.sh "$REPO" "$BASE" >> "$GITHUB_OUTPUT"
      - name: Mint the App token
        id: app-token
        if: ${{ steps.app.outputs.ready == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        if: ${{ steps.app.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash
