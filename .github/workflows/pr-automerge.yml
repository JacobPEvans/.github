# PR Auto-Merge
#
# Injected into every repository as an organization required workflow. When a
# PR opens, reopens or leaves draft, it turns on native auto-merge (squash), so
# the PR merges as soon as its required checks pass.
#
# Auto-merge is not enabled for draft PRs, PRs from forks, promotions (develop
# into the default branch, which merge by merge commit through their own flow)
# or PRs carrying human:review. A late human:review label disables an armed
# request.
#
# The opened event's labels are a snapshot that can miss a label added just
# after creation. Before arming, the workflow reads the live labels with gh.
# Adding human:review later triggers a hold run that disables auto-merge. Runs
# for arming and human:review share a PR-scoped concurrency group. If a later
# PR transition replaces a pending hold run, its live-state check also disables
# auto-merge on a held PR. Unrelated label events use unique groups.
#
# Auto-merge waits only for checks an active rule requires, so it is armed only
# when the base branch's active rules require a "Merge Gate" status check.
# Without one, the job warns and arms nothing.
#
# The merge is armed with the release App's token, not github.token, so the
# resulting push still triggers the base branch's workflows. Without the App
# variable and secret the job warns and succeeds, so a missing org setting never
# blocks a PR. A repository that does not allow squash merges fails the job.
name: PR Auto-Merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

permissions: {}

concurrency:
  group: >-
    ${{ github.event.action == 'labeled'
    && github.event.label.name != 'human:review'
    && format('pr-automerge-{0}-event-{1}', github.event.pull_request.number, github.run_id)
    || format('pr-automerge-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Enable Auto-Merge
    if: >-
      ${{ github.event.action != 'labeled'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    env:
      # Secrets are not allowed in if: expressions; expose only whether the App is configured.
      HAS_APP: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID != '' && secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY != '' }}
    steps:
      - name: Check live labels and auto-merge state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --json labels,autoMergeRequest --jq '"state=" + (if (.labels | map(.name) | contains(["human:review"])) then "held" else "clear" end) + "," + (if .autoMergeRequest == null then "unarmed" else "armed" end)' >> "$GITHUB_OUTPUT"
      - name: Check for a required Merge Gate
        id: gate
        if: >-
          ${{ steps.state.outputs.state == 'clear,unarmed'
          && !github.event.pull_request.draft
          && !(github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: gh api "repos/$REPO/rules/branches/$BASE" --jq '"ready=" + ((([.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?.context | select(type == "string" and test("(^|/ )Merge Gate$"))] | length) > 0) | tostring)' >> "$GITHUB_OUTPUT"
      - name: Warn when no required Merge Gate is active
        if: >-
          ${{ steps.state.outputs.state == 'clear,unarmed'
          && !github.event.pull_request.draft
          && !(github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == github.event.repository.default_branch)
          && steps.gate.outputs.ready != 'true' }}
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: echo "::warning::No active rule on $BASE requires a Merge Gate check; auto-merge not enabled."
      - name: Warn when the release App is not configured
        if: >-
          ${{ (steps.state.outputs.state == 'held,armed'
          || (steps.state.outputs.state == 'clear,unarmed'
          && steps.gate.outputs.ready == 'true'
          && !github.event.pull_request.draft
          && !(github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == github.event.repository.default_branch)))
          && (env.HAS_APP != 'true') }}
        run: echo "::warning::GH_ACTION_RELEASE_PLEASE_APP_ID or GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY is not set; auto-merge not enabled."
      - name: Mint the App token
        id: app-token
        if: >-
          ${{ (steps.state.outputs.state == 'held,armed'
          || (steps.state.outputs.state == 'clear,unarmed'
          && steps.gate.outputs.ready == 'true'
          && !github.event.pull_request.draft
          && !(github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == github.event.repository.default_branch)))
          && env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        if: >-
          ${{ steps.state.outputs.state == 'clear,unarmed'
          && steps.gate.outputs.ready == 'true'
          && !github.event.pull_request.draft
          && !(github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == github.event.repository.default_branch)
          && steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash
      - name: Turn auto-merge off for a held PR
        if: ${{ steps.state.outputs.state == 'held,armed' && steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --disable-auto

  hold:
    name: Hold for human review
    if: >-
      ${{ github.event.action == 'labeled'
      && github.event.label.name == 'human:review'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    env:
      # Secrets are not allowed in if: expressions; expose only whether the App is configured.
      HAS_APP: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID != '' && secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY != '' }}
    steps:
      - name: Warn when the release App is not configured
        if: ${{ env.HAS_APP != 'true' }}
        run: echo "::warning::GH_ACTION_RELEASE_PLEASE_APP_ID or GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY is not set; auto-merge was not armed."
      - name: Mint the App token
        id: app-token
        if: ${{ env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check whether auto-merge is armed
        id: state
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --json autoMergeRequest --jq '"armed=" + ((.autoMergeRequest != null) | tostring)' >> "$GITHUB_OUTPUT"
      # The state check makes this a no-op when a label arrives before arming.
      - name: Turn auto-merge off
        if: ${{ steps.state.outputs.armed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --disable-auto
