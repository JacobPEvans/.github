# Reusable: Cribl Pack Validation
# Runs the shared pytest suite (tests/cribl-pack/ in this repo) against the
# caller's pack repo.
name: _cribl-pack-validate

on:
  workflow_call:
    inputs:
      test_suite_owner:
        description: >-
          Owner of the `.github` repo holding tests/cribl-pack. Defaults to
          the calling repo's own owner. Set this when the caller lives in a
          different org from the shared test suite.
        type: string
        required: false
        default: ""
      pack_type:
        description: "Pack type: edge or stream"
        required: true
        type: string
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to ubuntu-24.04. Pass a
          RunsOn label (see runs-on.com/configuration/job-labels) to opt
          the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - name: Checkout pack repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout shared test suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.test_suite_owner || github.repository_owner }}/.github
          # The workflow's own commit exists only in JacobPEvans/.github; another owner's
          # test suite is checked out at its default branch.
          ref: ${{ (inputs.test_suite_owner || github.repository_owner) == 'JacobPEvans' && job.workflow_sha || '' }}
          path: .github-shared
          sparse-checkout: tests/cribl-pack

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run pack validation tests
        env:
          PACK_TYPE: ${{ inputs.pack_type }}
        run: |
          pytest .github-shared/tests/cribl-pack/ -v \
            --pack-root="${GITHUB_WORKSPACE}" \
            --pack-type="${PACK_TYPE}"
