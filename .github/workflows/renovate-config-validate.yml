# Validates this repo's Renovate config (the org master preset) on every PR
# that touches it. JacobPEvans/.github is the single source of truth for Renovate
# policy across every dryvist/JacobPEvans repo, so a broken preset here silently
# breaks dependency automation for all consumers. `--strict` also fails on
# deprecation/migration warnings, so config drift (renamed options, removed
# keys) is caught and fixed at PR time — not discovered months later. Scoped by
# `paths`, so it only runs when a renovate*.json file actually changes.
name: Renovate Config Validate

on:
  pull_request:
    paths:
      - "default.json"
      - "renovate.json"
      - "renovate-nix.json"
      - "renovate-presets.json"
      - "renovate-grouping.json"
      - "renovate-cribl.json"
  workflow_call:
    inputs:
      config_file:
        description: Repository Renovate config file to validate through RENOVATE_CONFIG_FILE.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    env:
      RENOVATE_VERSION: "44.165.2"
      RENOVATE_CONFIG_FILE: ${{ inputs.config_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Cache Renovate CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: renovate-cli-${{ runner.os }}-${{ env.RENOVATE_VERSION }}
          restore-keys: renovate-cli-${{ runner.os }}-

      - name: Validate Renovate config (strict)
        run: |
          if [[ -n "$RENOVATE_CONFIG_FILE" ]]; then
            npx --yes --package "renovate@${RENOVATE_VERSION}" -- \
              renovate-config-validator --strict
          else
            npx --yes --package "renovate@${RENOVATE_VERSION}" -- \
              renovate-config-validator --strict \
              default.json renovate.json renovate-nix.json \
              renovate-presets.json renovate-grouping.json renovate-cribl.json
          fi
