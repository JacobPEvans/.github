# Runs the unit tests for the scripts this repo ships. Repo-local; the
# ubuntu-24.04 image's Node (22) has `node --test` built in; the glob form is
# required there — a bare directory argument only works on Node 24+.
name: Tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'scripts/ci-gate-aggregate.mts'
      - 'scripts/flake-lock-fresh.sh'
      - 'tests/**'
      - '.github/workflows/_ci-gate.yml'
      - '.github/workflows/_flake-lock-fresh.yml'
      - '.github/workflows/_ansible-ci.yml'
      - '.github/workflows/_cribl-pack-validate.yml'
      - '.github/workflows/renovate-config-validate.yml'
      - '.github/workflows/_renovate-annotations.yml'
      - 'scripts/check-renovate-annotations.sh'
      - '.github/workflows/tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  node:
    name: node --test
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test 'tests/**/*.test.js' tests/ci-gate-aggregate.test.mts

  python:
    name: python -m unittest
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - run: pip install --quiet tiktoken pyyaml
      - run: python3 -m unittest discover -s tests -v
