# Reusable: Ansible CI (Merge Gatekeeper for ansible repos)
#
# Centralizes the ansible CI that drifted into divergent inline/local workflows
# across ansible-proxmox, ansible-proxmox-apps and ansible-splunk. Owns the parts
# that must be consistent, using off-the-shelf actions and the shared result
# aggregator:
#
#   changes      -> dorny/paths-filter on ONE standardized filter (incl. *.j2)
#   ansible-lint -> ansible/ansible-lint
#   molecule     -> matrix from the caller's `molecule_scenarios`, narrowed on
#                   a pull request by `molecule_scenario_filters`, optional
#                   Doppler secrets via dopplerhq/secrets-fetch-action
#   token-limits -> _token-limits.yml, so a repo's .token-limits.yaml is
#                   enforced; a no-op where that file is absent
#   gate         -> aggregates child results; uses the required "Merge Gate"
#                   name only when emit_gate is true
#
# Repo-specific data-contract tests (inventory schema/load, template render,
# bespoke syntax) and self-hosted e2e are NOT centralized — they live in the
# caller, which runs its own "Merge Gate" aggregating this workflow's result
# plus the local jobs. With emit_gate false, this workflow still validates its
# child results under the name "Result Validation".
#
# Thin caller (no extra local jobs) — pass emit_gate: true to name this job
# "Merge Gate":
#   jobs:
#     ci:
#       permissions: { contents: read, pull-requests: read }
#       uses: JacobPEvans/.github/.github/workflows/_ansible-ci.yml@v1
#       with: { emit_gate: true }
# Scope policy (canonical): pull requests and non-main pushes use only the
# Molecule scenarios mapped to their changed paths. An unmapped path never
# fails the run. It runs the full profile (the caller's `molecule_scenarios`)
# and emits one warning naming the path, with or without mappings. Declared
# full-matrix inputs defer Molecule to the post-merge run on `main`. CI harness
# files under `.github/` select no scenario once mappings are configured. Keep
# every classifier inside the required Merge Gate. See the policy and history in
# README.md.
#

name: _ansible-ci

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version for the molecule job.
        type: string
        default: "3.13"
      lint_args:
        description: Extra args for ansible/ansible-lint (e.g. 'playbooks/ roles/').
        type: string
        default: ""
      lint:
        description: Run Ansible lint, Molecule, token-limit, and Renovate validation jobs.
        type: boolean
        default: true
      molecule:
        description: Enable the molecule job (gated on the `molecule` filter).
        type: boolean
        default: true
      full_suite:
        description: Ignore path and tiny-diff relevance gates when selected by _ci-gate's event tier.
        type: boolean
        default: false
      molecule_scenarios:
        description: JSON array of molecule scenario names to run as a matrix.
        type: string
        default: '["default"]'
      molecule_scenario_filters:
        description: >-
          Optional YAML map of molecule scenario name -> paths, in
          dorny/paths-filter syntax. Pull requests and non-main pushes run only
          the scenarios whose paths changed. An unmapped Molecule path runs the
          full profile and warns, whether or not mappings are configured.
          Full-matrix paths defer all Molecule work to the push to main after
          merge.
        type: string
        default: ""
      molecule_contract_filters:
        description: >-
          Optional path-filter map named contract_only for files covered by caller-owned
          contract checks without a Molecule scenario. Every Molecule-relevant
          changed path must be covered. Use only when the contract check runs
          inside the same required Merge Gate.
        type: string
        default: ""
      full_matrix_base:
        description: >-
          Deprecated compatibility input. Pull request base branches no
          longer widen the Molecule matrix; the full suite runs after merge.
        type: string
        default: main
      molecule_requirements:
        description: >-
          Pip requirements file with the molecule job's dependencies (each repo
          owns one so its driver + version pins are respected).
        type: string
        default: "requirements-ci.txt"
      molecule_doppler:
        description: Inject iac-conf-mgmt secrets into the molecule job (needs doppler_token).
        type: boolean
        default: false
      doppler_project:
        description: Doppler project for molecule secrets.
        type: string
        default: "iac-conf-mgmt"
      doppler_config:
        description: Doppler config for molecule secrets.
        type: string
        default: "prd"
      emit_gate:
        description: >-
          Use the required "Merge Gate" name. When false, this job runs as
          "Result Validation" so a caller-owned gate receives a terminal
          success or failure from this workflow. Default false: callers run
          their own gate aggregating repo-local jobs.
        type: boolean
        default: false
      renovate_annotations:
        description: >-
          Enable `Renovate Annotations` (fails on an unannotated version pin
          under a path the annotated-pin Renovate customManagers cover, via
          `_renovate-annotations.yml`, gated on this workflow's own `ansible`
          filter above). Every Ansible repo in the org calls THIS workflow
          directly, not `_ci-gate.yml` (see its own `renovate_annotations`
          input) — so this is the only place the check is actually reachable
          for the Ansible fleet. Default false: opt in per repo.
        type: boolean
        default: false
      runner_label:
        description: >-
          Runner label for the quick jobs (changes, ansible-lint, gate). These
          finish in well under a minute on hosted runners, so they stay hosted
          by default; `molecule_runner_label` retargets the heavy molecule job
          separately.
        type: string
        default: ubuntu-24.04
      molecule_runner_label:
        description: >-
          Runner label for the molecule job only. Default ubuntu-24.04 keeps it
          hosted; a caller whose repo has the self-hosted fleet passes a fleet
          label (e.g. `proxmox`) to run molecule on a pre-baked runner. Only
          takes effect for a private repo's own (non-fork) PRs; a public repo
          and every fork PR always fall back to ubuntu-24.04.
        type: string
        default: ubuntu-24.04
    secrets:
      doppler_token:
        description: Doppler service token, only needed when molecule_doppler is true.
        required: false
    outputs:
      ansible:
        description: >-
          Whether ansible-relevant files changed (the standardized filter).
          Callers gate their own repo-local jobs on this so every job in the
          repo shares ONE change-detection definition.
        value: ${{ jobs.changes.outputs.ansible }}
      molecule:
        description: Whether molecule-relevant files changed and a Molecule scenario exists (the standardized filter).
        value: ${{ jobs.changes.outputs.molecule }}
      tiny:
        description: >-
          Whether this is a small pull request into develop with only safe task or
          handler changes.
        value: ${{ jobs.changes.outputs.tiny }}
      renovate_config:
        description: Whether the caller's Renovate config changed.
        value: ${{ jobs.changes.outputs.renovate_config }}
      renovate_config_present:
        description: Whether the caller has a renovate.json to validate.
        value: ${{ jobs.changes.outputs.renovate_config_present }}
      molecule_scenarios:
        description: >-
          JSON array of scenarios mapped to changed paths, [] when a caller
          contract covers the change, and an empty string for the full suite
          (selected by _ci-gate, a push to main, or an unmapped path). Callers
          that own Molecule locally (`molecule: false`) read this output so
          every repo shares ONE change-detection definition.
        value: ${{ jobs.changes.outputs.molecule_scenarios }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    outputs:
      ansible: >-
        ${{ inputs.full_suite
            || (steps.filter.outputs.ansible == 'true'
            && steps.nondocs.outputs.match == 'true')
            || (github.event_name == 'push'
            && github.ref == 'refs/heads/main') }}
      # False when the selector mapped the change to no scenario ([]), so a
      # caller that runs its own Molecule job on this output never starts an
      # empty matrix.
      molecule: >-
        ${{ steps.molecule_scenarios.outputs.present == 'true'
            && (inputs.full_suite
            || (steps.filter.outputs.molecule == 'true'
            && steps.nondocs.outputs.match == 'true')
            || (github.event_name == 'push'
            && github.ref == 'refs/heads/main'))
            && steps.scenario_scope.outputs.scenarios != '[]' }}
      renovate_config: ${{ inputs.full_suite || steps.filter.outputs.renovate_config == 'true' }}
      renovate_config_present: ${{ steps.renovate-config-file.outputs.present }}
      # Normalize ONCE for every consumer: an empty string means all scenarios
      # only after a push to main; focused PRs and branch pushes use mapped
      # scenarios or [] when caller contracts cover the change.
      molecule_scenarios: ${{ steps.scenario_scope.outputs.scenarios }}
      tiny: ${{ steps.tiny.outputs.tiny }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect whether a Renovate config exists
        id: renovate-config-file
        if: ${{ hashFiles('renovate.json') != '' }}
        run: echo "present=true" >> "$GITHUB_OUTPUT"
      # A repo without a Molecule scenario has nothing for the molecule job to
      # run, so that job is skipped there rather than failing on a missing file.
      - name: Detect Molecule scenarios
        id: molecule_scenarios
        if: ${{ hashFiles('**/molecule/*/molecule.yml') != '' }}
        run: echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Note that no Molecule scenario exists
        if: ${{ hashFiles('**/molecule/*/molecule.yml') == '' }}
        run: echo "::notice::no Molecule scenarios in this repository, Molecule job not applicable"
      - name: Require a previous commit for focused branch pushes
        if: >-
          ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' &&
          github.event.before == '0000000000000000000000000000000000000000' }}
        run: |
          echo "Cannot classify a first push without a previous commit." >&2
          exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          list-files: json
          filters: |
            ansible:
              - '**.yml'
              - '**.yaml'
              - '**.j2'
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'molecule/**'
              - '.ansible-lint'
              - '.yamllint'
              - 'requirements.yml'
              # Callers gate pytest and ansible-lint on THIS filter, so a
              # test-only change has to match it. The globs above cover YAML
              # suites via '**.yml', but a Python suite under tests/ matched
              # nothing: both jobs reported SKIPPED, Merge Gate allowed the
              # skips, and a test-only PR could merge on a green board having
              # never been run. Same fix already applied to the molecule filter
              # below — they were fixed separately because they gate different
              # jobs, which is exactly why the second gap survived the first.
              - 'tests/**'
              # Repo scripts (the converge runner and its helpers) are what
              # those Python suites exercise, so a script-only change must run
              # them too.
              - 'scripts/**'
            molecule:
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'group_vars/**'
              - 'host_vars/**'
              - 'molecule/**'
              - '.config/molecule/**'
              - 'requirements.yml'
              - 'requirements-ci.txt'
              - 'ansible.cfg'
              - '.github/workflows/**'
              - '.github/scripts/**'
              # Suites that live outside molecule/ but run under the molecule
              # workflow. Without these, editing one of those tests does not
              # run it: a change confined to the suite leaves this filter
              # false, every molecule job is skipped, and the PR merges green
              # having never exercised the thing it changed.
              - 'tests/**'
            renovate_config:
              - 'renovate.json'
      # A change made only of Markdown (a role README, for example) runs no
      # lint or Molecule; `match` is true when any changed file is not .md/.mdx.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: nondocs
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          predicate-quantifier: every
          filters: |
            match:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
      # Match all Molecule-relevant paths once. File lists let the selector
      # verify that every changed path is covered by a scenario or caller
      # contract before narrowing the matrix.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: classify
        if: >-
          ${{ github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          list-files: json
          filters: |
            changed:
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'group_vars/**'
              - 'host_vars/**'
              - 'molecule/**'
              - '.config/molecule/**'
              - 'requirements.yml'
              - 'requirements-ci.txt'
              - 'ansible.cfg'
              - '.github/workflows/**'
              - '.github/scripts/**'
              - 'tests/**'
            full_matrix:
              - 'playbooks/**'
              - 'inventory/**'
              - 'group_vars/**'
              - 'host_vars/**'
              - 'roles/**/meta/**'
              - 'molecule/shared/**'
              - 'molecule/resources/**'
              - '.config/molecule/**'
              - 'requirements-ci.txt'
              - 'ansible.cfg'
            # Counts only add/modify changes inside the tiny-diff allowlist.
            tiny_files:
              - added|modified: 'roles/*/tasks/**'
              - added|modified: 'roles/*/handlers/**'
            tiny_excluded:
              - '.github/**'
              - 'inventory/**'
              - 'group_vars/**'
              - 'host_vars/**'
              - 'playbooks/**'
              - 'tests/**'
              - 'molecule/**'
              - 'requirements*'
              - 'ansible.cfg'
              - 'roles/openbao/**'
              - 'roles/openbao_secrets/**'
              - 'roles/*/vars/**'
              - '**/*secret*'
              - '**/*credential*'
              - '**/*token*'
              - '**/vault/**'
              - '*.sops.*'
              - '.sops.yaml'
              - 'llm-models.d/**'
            ${{ inputs.molecule_scenario_filters }}
            ${{ inputs.molecule_contract_filters }}
      # Comparing this filtered count with the PR payload rejects any changed
      # file outside the allowlist, including deletes and renames.
      - name: Detect tiny develop pull request
        id: tiny
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          ALLOWED_FILES: ${{ steps.classify.outputs.tiny_files_count }}
          EXCLUDED_FILES: ${{ steps.classify.outputs.tiny_excluded_count }}
        run: |
          tiny=false
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "develop" &&
                "$CHANGED_FILES" =~ ^[0-9]+$ && "$ADDITIONS" =~ ^[0-9]+$ &&
                "$DELETIONS" =~ ^[0-9]+$ && "$ALLOWED_FILES" =~ ^[0-9]+$ &&
                "$EXCLUDED_FILES" =~ ^[0-9]+$ ]]; then
            if (( 10#$CHANGED_FILES <= 2 && 10#$ADDITIONS + 10#$DELETIONS <= 10 &&
                  10#$ALLOWED_FILES == 10#$CHANGED_FILES && 10#$EXCLUDED_FILES == 0 )); then
              tiny=true
            fi
          fi
          printf 'tiny=%s\n' "$tiny" >> "$GITHUB_OUTPUT"
      - name: Note that mapping is not required when Molecule is off
        if: >-
          ${{ (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main')) &&
          steps.filter.outputs.molecule == 'true' &&
          !inputs.molecule }}
        run: echo "::notice::molecule off, mapping not required"
      - name: Name each unmapped Molecule path and run the full profile
        id: unmapped
        if: >-
          ${{ (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main')) &&
          inputs.molecule &&
          steps.filter.outputs.molecule == 'true' &&
          steps.classify.outputs.full_matrix != 'true' &&
          inputs.molecule_scenario_filters == '' &&
          inputs.molecule_contract_filters == '' }}
        env:
          MOLECULE_FILES: ${{ steps.filter.outputs.molecule_files }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            echo "::warning::unmapped path $path, running full profile"
          done < <(jq -r '.[]' <<<"${MOLECULE_FILES:-[]}")
          echo "full_profile=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: >-
          ${{ (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main')) &&
          (inputs.molecule_scenario_filters != '' ||
          inputs.molecule_contract_filters != '') }}
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: .github/scripts/select-molecule-scenarios.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Select scenarios only when every relevant path is covered
        id: scenario_selection
        if: >-
          ${{ (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main')) &&
          (inputs.molecule_scenario_filters != '' ||
          inputs.molecule_contract_filters != '') }}
        env:
          CHANGED_FILES: ${{ steps.classify.outputs.changed_files }}
          MATCHED_FILTERS: ${{ steps.classify.outputs.changes }}
          FILTER_OUTPUTS: ${{ toJSON(steps.classify.outputs) }}
        run: node .gh-shared/.github/scripts/select-molecule-scenarios.js
      - name: Publish Molecule scenario selection
        id: scenario_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FULL_SUITE: ${{ inputs.full_suite }}
          SELECTED_SCENARIOS: ${{ steps.scenario_selection.outputs.scenarios }}
          FULL_PROFILE: ${{ steps.unmapped.outputs.full_profile || steps.scenario_selection.outputs.full_profile }}
        run: |
          if [[ "$FULL_SUITE" == true || ( "$EVENT_NAME" == push && "$REF" == refs/heads/main ) ]]; then
            printf 'scenarios=\n' >> "$GITHUB_OUTPUT"
          elif [[ "$FULL_PROFILE" == true ]]; then
            printf 'scenarios=\n' >> "$GITHUB_OUTPUT"
          elif [[ -n "$SELECTED_SCENARIOS" ]]; then
            printf 'scenarios=%s\n' "$SELECTED_SCENARIOS" >> "$GITHUB_OUTPUT"
          else
            printf 'scenarios=[]\n' >> "$GITHUB_OUTPUT"
          fi
  ansible-lint:
    name: Ansible Lint
    needs: changes
    if: ${{ inputs.lint && (inputs.full_suite || needs.changes.outputs.ansible == 'true') }}
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Galaxy steps below call ansible-galaxy, which a self-hosted runner
      # may not have. Install Ansible first with the molecule job's pattern and
      # the caller's pinned requirements file. Skipped when the caller has no
      # such file, so those callers keep the runner image's Ansible.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ hashFiles(inputs.molecule_requirements) != '' }}
        with:
          python-version: ${{ inputs.python_version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: ${{ hashFiles(inputs.molecule_requirements) != '' }}
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: ${{ inputs.molecule_requirements }}
      - name: Install Ansible from the molecule requirements
        if: ${{ hashFiles(inputs.molecule_requirements) != '' }}
        env:
          REQ: ${{ inputs.molecule_requirements }}
        run: uv pip install --system -r "$REQ"
      # A restore-key hit can contain dependencies from a different
      # requirements.yml digest. ansible-lint's implicit install does not
      # force-replace those restored versions, so only an exact cache hit may
      # skip installing the current requirements before lint.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
          # A branch that edits requirements.yml gets a new key. A partial
          # restore keeps unchanged dependencies warm; the explicit install
          # below force-reconciles restored content against the current pins.
          restore-keys: |
            ansible-galaxy-v2-${{ runner.os }}-
      - name: Note when there is nothing to install
        if: ${{ hashFiles('requirements.yml') == '' }}
        run: echo "::notice::no requirements.yml, nothing to install"
      - name: Install Ansible collections
        if: ${{ steps.galaxy-cache.outputs.cache-hit != 'true' && hashFiles('requirements.yml') != '' }}
        run: ansible-galaxy collection install -r requirements.yml --force
      # Roles install to ~/.ansible/roles, outside the checkout, so ansible-lint
      # never lints vendored Galaxy role code. Without -p, ansible-galaxy writes
      # to the first roles_path in ansible.cfg (roles/), inside the linted tree.
      - name: Install Ansible roles
        if: ${{ steps.galaxy-cache.outputs.cache-hit != 'true' && hashFiles('requirements.yml') != '' }}
        run: ansible-galaxy role install -r requirements.yml --force -p "$HOME/.ansible/roles"
      # Runs on every hit or miss: ansible.cfg's roles_path would otherwise
      # hide ~/.ansible/roles. Repo roles/ stays first in the search path,
      # then the repo's own ansible.cfg roles_path (if any), then Galaxy roles.
      - name: Set Ansible roles path
        run: echo "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/roles:$(sed -n 's/^[[:space:]]*roles_path[[:space:]]*=[[:space:]]*\(.*[^[:space:]]\)[[:space:]]*$/\1:/p' ansible.cfg 2>/dev/null | head -n 1)$HOME/.ansible/roles" >> "$GITHUB_ENV"
      - uses: ansible/ansible-lint@e7f397ad6dfa20d274afa17cd7bbedd84ed136f5 # v26
        with:
          args: ${{ inputs.lint_args }}

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: changes
    if: >-
      ${{ inputs.lint && inputs.molecule &&
      needs.changes.outputs.molecule == 'true' &&
      (inputs.full_suite || needs.changes.outputs.tiny != 'true') }}
    # Molecule gets its own label so it can run on the self-hosted fleet while
    # the quick jobs stay hosted. Hosted for a public repo and for fork PRs;
    # self-hosted (molecule_runner_label) only for a private repo's own PRs.
    runs-on: >-
      ${{ (github.event.repository.private == true &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      inputs.molecule_runner_label || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 45 }} # pr-policy: timeout-exception Molecule scenarios take up to 9 min on PRs
    strategy:
      fail-fast: false
      matrix:
        # Empty means "run everything" — the changes job already applied every
        # widening rule (see its output comment).
        scenario: ${{ fromJSON(needs.changes.outputs.molecule_scenarios != '' && needs.changes.outputs.molecule_scenarios || inputs.molecule_scenarios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: ${{ inputs.molecule_requirements }}
      - name: Install molecule + dependencies
        env:
          REQ: ${{ inputs.molecule_requirements }}
        run: uv pip install --system -r "$REQ"
      # Cache Galaxy content keyed on requirements.yml. On a hit the collections
      # and roles are already present, so the forced reinstalls below are skipped;
      # on a miss (requirements.yml changed) they run and repopulate the cache.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
      - name: Note when there is nothing to install
        if: ${{ hashFiles('requirements.yml') == '' }}
        run: echo "::notice::no requirements.yml, nothing to install"
      - name: Install Ansible collections
        if: ${{ steps.galaxy-cache.outputs.cache-hit != 'true' && hashFiles('requirements.yml') != '' }}
        run: ansible-galaxy collection install -r requirements.yml --force
      # `collection install` ignores a `roles:` key, so any role a repo pins in
      # requirements.yml (e.g. splunk.splunk, the shared inventory_resolve) was
      # never installed. Skips cleanly when the file has no `roles:` entries.
      - name: Install Ansible roles
        if: ${{ steps.galaxy-cache.outputs.cache-hit != 'true' && hashFiles('requirements.yml') != '' }}
        run: ansible-galaxy role install -r requirements.yml --force -p "$HOME/.ansible/roles"
      - name: Set Ansible roles path
        run: echo "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/roles:$HOME/.ansible/roles" >> "$GITHUB_ENV"
      - name: Fetch Doppler secrets
        if: ${{ inputs.molecule_doppler }}
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.doppler_token }}
          doppler-project: ${{ inputs.doppler_project }}
          doppler-config: ${{ inputs.doppler_config }}
          inject-env-vars: true
      - name: Run molecule
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: molecule test -s "$MOLECULE_SCENARIO"

  # Token budgets reach the Ansible fleet only from here. _token-limits.yml is
  # otherwise only wired through _ci-gate.yml, and no Ansible repo calls that —
  # every one of them wires THIS workflow directly, so the budget was
  # unreachable for the whole fleet. It is a no-op in a repo with no
  # .token-limits.yaml, so adding it changes nothing until a repo opts in by
  # committing one.
  token-limits:
    name: Token Limits
    needs: changes
    if: ${{ inputs.lint && (inputs.full_suite || needs.changes.outputs.ansible == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/_token-limits.yml
    with:
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  # Reachability: every Ansible repo in the org calls THIS workflow directly,
  # not `_ci-gate.yml` — so `_renovate-annotations.yml` is otherwise
  # unreachable for the whole fleet, the same gap token-limits had above.
  # Opt-in (unlike token-limits, this is NOT a no-op-by-absence check, so it
  # stays behind its own toggle rather than running unconditionally).
  renovate-annotations:
    name: Renovate Annotations
    needs: changes
    if: ${{ inputs.lint && inputs.renovate_annotations && (inputs.full_suite || needs.changes.outputs.ansible == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/_renovate-annotations.yml
    with:
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  renovate_config:
    name: Renovate Config Validate
    needs: changes
    if: ${{ inputs.lint && needs.changes.outputs.renovate_config_present == 'true' && (inputs.full_suite || needs.changes.outputs.renovate_config == 'true') }}
    uses: ./.github/workflows/renovate-config-validate.yml
    with:
      config_file: renovate.json

  gate:
    name: ${{ inputs.emit_gate && 'Merge Gate' || 'Result Validation' }}
    needs: [changes, ansible-lint, molecule, token-limits, renovate-annotations, renovate_config]
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Checkout result aggregator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-aggregate.mts
          sparse-checkout-cone-mode: false
      - name: Aggregate results
        env:
          CI_GATE_JOBS: ${{ toJSON(needs) }}
          CI_GATE_ALLOWED_SKIPS: ansible-lint, molecule, token-limits, renovate-annotations, renovate_config
        run: node .gh-shared/scripts/ci-gate-aggregate.mts
