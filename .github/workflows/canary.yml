---
# Caller-contract canary for the reusable workflows this repo publishes.
#
# Stack jobs call reusables through local paths, so the code under test is the
# PR head (pull_request) or the pushed commit (push to main). On push, only a
# release commit runs the stacks: its Canary check is what gates the major-tag
# move, and every other commit was already canaried as a pull request. Release
# PRs are squash-merged with their release-please title so the push matches.
# The release commit is never re-canaried. Fixtures under tests/canary/<stack>/
# are reached only through the directory inputs a reusable exposes; the rest
# run against the repo root.
#
# The `promote` job at the end runs on push to main after each stack check and
# fixture assertion succeeds. It moves the floating major tag when a release
# tag already names this commit. When the release comes later,
# promote-major-tag.yml does it.
# Both paths call scripts/promote-major-tag.sh.
#
# The job named `Canary` is the required check (ruleset, admin gate). It fails
# when any caller job fails or is cancelled, and when a stack's change detection
# did not match its fixture (a silent skip would otherwise read as a pass).
# `ansible-direct` is the one exception: _ansible-ci.yml hard-codes its own
# filter, so its lint runs only when the change touches Ansible paths. Its
# coverage is printed to the job summary, not asserted.
#
# `template-callers` is static: it reads each template's ci-gate.yml caller from
# the template's default branch and checks it against this commit's gate
# (inputs, required inputs, permissions). It has no fixture, so it is required
# like the other caller jobs.

name: Canary

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Push runs group per commit, so a newer push to main never drops a queued
  # release commit run before its promote job moves the major tag.
  group: canary-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # On a pull request the stacks run unless every changed file is Markdown
  # outside .github/ and tests/canary/ (agentic-workflow imports and canary
  # fixtures are consumed as code).
  # A release commit push always runs them.
  scope:
    name: Scope
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.event.head_commit.message, 'chore(main): release ')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.github_md == 'true' || steps.filter.outputs.fixtures == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
            github_md:
              - '.github/**/*.md'
            fixtures:
              - 'tests/canary/**'

  # Reusable-workflow caller jobs take no `timeout-minutes`; each inner job
  # carries its own. The `actions: write` grant is what _ci-gate.yml's queue
  # watchdog needs. dependency_review and zizmor are off: the repo's own gate
  # already runs them once per PR, and the canary would repeat them per stack.
  ansible:
    needs: [scope]
    if: needs.scope.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/_ci-gate.yml
    with:
      filters: |
        ansible:
          - '**'
      ansible_ci: true
      # Scopes lint to the fixture.
      ansible_lint_args: tests/canary/ansible
      dependency_review: false
      zizmor: false

  nix:
    needs: [scope]
    if: needs.scope.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/_ci-gate.yml
    with:
      filters: |
        nix:
          - '**'
      nix_validate: true
      all_systems: false
      dependency_review: false
      zizmor: false

  tofu:
    needs: [scope]
    if: needs.scope.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/_ci-gate.yml
    with:
      # The gate exports no `terraform` output, so `extra` mirrors the same
      # pattern and gives the summary a change-detection value to read.
      filters: |
        terraform:
          - '**'
        extra:
          - '**'
      tofu_ci: true
      tofu_working_directories: '["tests/canary/tofu"]'
      dependency_review: false
      zizmor: false

  # python_ci is not canaried: _python-ci.yml runs `uv run` at the repo root and
  # needs a root pyproject.toml this repo does not have. _python-security.yml
  # takes a directory, so it exercises the fixture instead.
  python:
    needs: [scope]
    if: needs.scope.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/_ci-gate.yml
    with:
      filters: |
        python:
          - '**'
      python_security: true
      python_security_dirs: tests/canary/python
      dependency_review: false
      zizmor: false

  docs:
    needs: [scope]
    if: needs.scope.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/_ci-gate.yml
    with:
      filters: |
        markdown:
          - '**'
      markdown_lint: true
      dependency_review: false
      zizmor: false

  # _ansible-ci.yml, with Molecule on. The contract_only map covers the
  # Molecule-relevant paths on a PR, so a PR touching only workflows skips
  # Molecule. A push to main runs the full scenario set.
  ansible-direct:
    needs: [scope]
    if: needs.scope.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_ansible-ci.yml
    with:
      emit_gate: false
      molecule: true
      lint_args: tests/canary/ansible
      molecule_contract_filters: |
        contract_only:
          - 'roles/**'
          - 'playbooks/**'
          - 'inventory/**'
          - 'group_vars/**'
          - 'host_vars/**'
          - 'molecule/**'
          - '.config/molecule/**'
          - 'requirements.yml'
          - 'requirements-ci.txt'
          - 'ansible.cfg'
          - '.github/workflows/**'
          - '.github/scripts/**'
          - 'tests/**'

  template-callers:
    needs: [scope]
    if: needs.scope.outputs.run == 'true'
    name: Template Callers
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      contents: read
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Unauthenticated: the templates are public. Any failed fetch fails the job.
      - name: Fetch the template caller workflows from their default branch
        run: |
          mkdir -p "$RUNNER_TEMP/template-callers"
          for template in python-template cc-edge-pack-template tofu-aws-templates; do
            curl -fsSL "https://raw.githubusercontent.com/dryvist/${template}/main/.github/workflows/ci-gate.yml" \
              -o "$RUNNER_TEMP/template-callers/${template}.yml"
          done

      - name: Check the callers against the candidate gate
        run: |
          yq --version
          scripts/check-template-callers.sh "$RUNNER_TEMP"/template-callers/*.yml

  canary-summary:
    name: Canary
    needs: [scope, ansible, nix, tofu, python, docs, ansible-direct, template-callers]
    if: >-
      always() && (github.event_name == 'pull_request' ||
      startsWith(github.event.head_commit.message, 'chore(main): release '))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions: {}
    steps:
      - name: Require every stack to pass and to have matched its fixture
        env:
          R_SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          R_ANSIBLE: ${{ needs.ansible.result }}
          R_NIX: ${{ needs.nix.result }}
          R_TOFU: ${{ needs.tofu.result }}
          R_PYTHON: ${{ needs.python.result }}
          R_DOCS: ${{ needs.docs.result }}
          R_ANSIBLE_DIRECT: ${{ needs.ansible-direct.result }}
          R_TEMPLATE_CALLERS: ${{ needs.template-callers.result }}
          C_ANSIBLE: ${{ needs.ansible.outputs.ansible }}
          C_NIX: ${{ needs.nix.outputs.nix }}
          C_TOFU: ${{ needs.tofu.outputs.extra }}
          C_PYTHON: ${{ needs.python.outputs.python }}
          C_DOCS: ${{ needs.docs.outputs.markdown }}
          C_ANSIBLE_DIRECT: ${{ needs.ansible-direct.outputs.ansible }}
        run: |
          if [[ "$R_SCOPE" != success ]]; then
            echo "::error::scope result is '$R_SCOPE'"
            exit 1
          fi
          if [[ "$RUN" != true ]]; then
            echo "::notice::Markdown-only change: caller-contract stacks not run"
            exit 0
          fi
          fail=0
          result() {
            if [[ "$2" == success ]]; then
              echo "$1: result success"
            else
              echo "::error::$1 result is '$2'"
              fail=1
            fi
          }
          matched() {
            if [[ "$2" == true ]]; then
              echo "$1: change detection matched the fixture"
            else
              echo "::error::$1 change detection did not match the fixture ('$2')"
              fail=1
            fi
          }
          result ansible "$R_ANSIBLE"; matched ansible "$C_ANSIBLE"
          result nix "$R_NIX"; matched nix "$C_NIX"
          result tofu "$R_TOFU"; matched tofu "$C_TOFU"
          result python "$R_PYTHON"; matched python "$C_PYTHON"
          result docs "$R_DOCS"; matched docs "$C_DOCS"
          result ansible-direct "$R_ANSIBLE_DIRECT"
          echo "ansible-direct: lint ran=${C_ANSIBLE_DIRECT:-false} (not asserted; see header)"
          result template-callers "$R_TEMPLATE_CALLERS"
          exit "$fail"

  # Second arrival for a release: this push-to-main run finished after the
  # release tag named this commit. The condition repeats the summary's checks,
  # so the script can skip the check-run lookup.
  promote:
    name: Move floating major tag
    # Depend directly on the canary inputs so the full required-check chain
    # stays within the shared three-job depth policy.
    needs: [scope, ansible, nix, tofu, python, docs, ansible-direct, template-callers]
    if: >-
      success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.outputs.run == 'true' &&
      needs.ansible.result == 'success' && needs.ansible.outputs.ansible == 'true' &&
      needs.nix.result == 'success' && needs.nix.outputs.nix == 'true' &&
      needs.tofu.result == 'success' && needs.tofu.outputs.extra == 'true' &&
      needs.python.result == 'success' && needs.python.outputs.python == 'true' &&
      needs.docs.result == 'success' && needs.docs.outputs.markdown == 'true' &&
      needs.ansible-direct.result == 'success' &&
      needs.template-callers.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      contents: write
      checks: read
    concurrency:
      group: promote-major-tag
      cancel-in-progress: false
    steps:
      # The tag push needs the workflows permission, which github.token can never hold.
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Check out tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Promote if a release tag names this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/promote-major-tag.sh "$SHA" --gate-verified
