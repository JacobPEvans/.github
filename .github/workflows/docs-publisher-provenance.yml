# Required-workflow gate for repositories that expose generated public docs.
# The org ruleset targets the public docs repository. Control-plane PRs pass
# without publisher identity; any projected output requires the dedicated App
# and an immutable private-source revision in the PR body.
name: Docs Publisher Provenance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-publisher-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Generated source
    # This file lives in the org `.github` repo, so it also fires on that
    # repo's own PRs, where every non-workflow path (configs, presets, nix
    # modules, tests) is "generated" by the classifier and no publisher
    # identity exists. The template repo is never a docs projection.
    if: ${{ github.repository != format('{0}/.github', github.repository_owner) }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    env:
      DOCS_PUBLISHER_LOGIN: ${{ vars.DOCS_PUBLISHER_LOGIN }}
    steps:
      - name: Checkout policy implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts/docs-publisher-provenance.js
          sparse-checkout-cone-mode: false
          path: .org-policy

      - name: Verify generated-docs provenance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.org-policy/.github/scripts/docs-publisher-provenance.js');
            await run({ github, context, core });
