# Reusable: Nix Build (macOS)
# Builds a Nix flake on macOS with store caching.
# Default build command targets home-manager; override for darwin-rebuild.
name: _nix-build

on:
  workflow_call:
    inputs:
      build-command:
        description: "Build command to run; empty (default) runs the home-manager build"
        required: false
        type: string
        default: ""
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to the GitHub-hosted macOS 26
          arm64 image (`macos-26`, which `macos-latest` resolves to). Pass a
          self-hosted macOS label to build elsewhere. The RunsOn Linux pattern does
          not apply to macOS builds.
        type: string
        required: false
        default: macos-26

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner_label }}
    # Intentionally non-negotiable: exceeding this cap signals a dependency,
    # cache, or closure regression, not a reason to spend more CI time. Do not
    # raise it; remove the source-build cause so this required check keeps
    # blocking the regression until it is fixed.
    #
    # The number comes from the org variable so it can change for every consumer
    # without editing this file or any calling repository. `vars` is permitted
    # here — the context table allows github/needs/strategy/matrix/vars/inputs
    # for job-level timeout-minutes (not env, not secrets). In a reusable
    # workflow `vars` resolves from the CALLER's repository and organization.
    #
    # fromJSON is required, not decoration: every `vars.*` value is typed as a
    # STRING while timeout-minutes demands a number. Without it the workflow
    # fails graph validation and the job never starts — it surfaces as a failed
    # required check with no job and no logs.
    #
    # The `|| '15'` literal is likewise required: an unset variable interpolates
    # to an empty string, fromJSON('') errors, and fork PRs resolve org
    # variables empty.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || fromJSON(vars.GH_ACTION_TIMEOUT_NIX || '15') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # determinate-nix-action@v3 is ONLY a Nix installer (replaced nix-installer-action@v21).
      # It does NOT include flake checking — flake validation is in _nix-validate.yml.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
            http-connections = 50
            connect-timeout = 5
            stalled-download-timeout = 10
            narinfo-cache-positive-ttl = 86400
            fallback = true

      # Restore-only on PRs; saves on pushes to the default branch. Branch-agnostic
      # via `github.event_name != 'pull_request'` because this shared workflow is
      # called by both trunk (main) and git-flow (develop) repos — hardcoding either
      # branch would silently disable saves for half the callers. GitHub scopes a
      # cache to the creating branch plus the default branch, so a push-triggered
      # save lands where PRs can read it.
      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          # The activation closure exceeds this cap, so the cache is partial by
          # design; a partial warm store still beats substituting everything.
          gc-max-store-size-macos: 8G
          save: ${{ github.event_name != 'pull_request' }}

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          # Empty build-command (the default) runs the home-manager build.
          if [ -z "$BUILD_COMMAND" ]; then
            BUILD_COMMAND="nix build .#homeConfigurations.$(whoami).activationPackage --print-build-logs"
          fi
          eval "$BUILD_COMMAND"
