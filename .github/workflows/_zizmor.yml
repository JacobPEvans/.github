# Reusable: Workflow Security (zizmor)
#
# Runs zizmor against the org's canonical policy (zizmor.yml, fetched from
# this repo) over the consumer's .github/workflows. Extracted from
# _python-ci.yml so every consumer gets the audit as its own Merge Gate job,
# not just Python repos that opt into `python_ci`.
name: _zizmor

on:
  workflow_call:
    inputs:
      zizmor_version:
        description: zizmor version run for the workflow-security audit.
        type: string
        required: false
        default: "1.26.1"
      runner_label:
        description: >-
          Runner label. Defaults to ubuntu-24.04; pass a RunsOn label to opt
          into self-hosted runners.
        type: string
        required: false
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow Security (zizmor)
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        # TODO: switch to @v8 (major-moving) once Astral publishes that tag;
        # only v8.x.x full tags exist today, so this pins the latest full v8.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # zizmor runs centrally against the org's canonical policy, fetched here —
      # the consumer never copies zizmor.yml.
      - name: Fetch central zizmor policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .central-config
          sparse-checkout: zizmor.yml
          sparse-checkout-cone-mode: false

      - name: Workflow security (zizmor, central policy)
        env:
          ZIZMOR_VERSION: ${{ inputs.zizmor_version }}
        run: >-
          uvx "zizmor@${ZIZMOR_VERSION}"
          --persona=regular --min-severity=medium --min-confidence=medium
          --config .central-config/zizmor.yml
          .github/workflows
