# Reusable: Release Please (org-native).
#
# Canonical release-please workflow for the org, hosted once here so every repo
# runs identical logic. A calling repo adds a thin
# .github/workflows/release-please.yml and passes the org-level release App key.
#
# Auth: the org-level release App — app-id from the
# GH_ACTION_RELEASE_PLEASE_APP_ID org variable, private key from the
# GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY org secret. The App must be installed
# with Contents, Pull requests and Workflows write. Its token lets the release
# PR trigger pull_request CI gates.
#
# Behavior:
#   - Trunk repos (default branch main): open or update a release PR against
#     main and create the tag and GitHub Release in the same run.
#   - Git-flow repos (default branch develop): a develop push opens or updates
#     the release PR against develop without tagging. A main push only creates
#     the tag and GitHub Release after every merged release PR commit is present
#     on main. main is never merged back into develop (there is no back-merge).
#   - Every release PR is set to auto-merge as soon as it is opened or updated;
#     it merges when its required checks pass. The bot PR sweep merges any
#     release PR this step missed.
#
# Config modes (selected by inputs):
#   - Manifest mode (default): the caller's repo holds release-please-config.json
#     + .release-please-manifest.json; the action reads them via the GitHub API.
#   - Non-manifest mode: the caller passes config-file: '' and manifest-file: ''
#     with a release-type (e.g. simple). Version state is read from existing tags.
#
# Asset-carrying repos (opt-in per repo, default off): a GitHub release is
# immutable once published, so assets cannot be attached to it afterwards. Such a
# repo sets, in its release-please-config.json package entry:
#     "draft": true, "force-tag-creation": true
# so release-please creates the release as a draft and the tag immediately
# (without force-tag-creation the tag is created lazily at publish, and the next
# release run cannot find the previous release). The caller then adds an asset
# job that uploads to the draft (gh release upload <tag_name>) and a publish job
# that runs gh release edit <tag_name> --draft=false after it. The action has no
# draft input, so this stays config-driven. Repos with no assets leave draft
# unset and are unaffected. Recovery after a failed asset job: Re-run failed
# jobs (not Re-run all), which keeps the release outputs from the first run.
#
# Caller shape (manifest mode):
#   on:
#     push:
#       branches: [main, develop]
#   jobs:
#     release-please:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: JacobPEvans/.github/.github/workflows/_release-please.yml@v1
#       secrets:
#         GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY
name: _release-please

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to the GitHub-hosted ubuntu-24.04
          image. Pass a self-hosted label to opt the calling repo into on-prem runners.
        type: string
        required: false
        default: ubuntu-24.04
      auto-merge:
        description: >-
          Deprecated and ignored. Every release PR is set to auto-merge. The input
          stays declared so callers that still pass it keep running.
        type: boolean
        default: false
      release-type:
        description: >-
          release-please release type (e.g. simple). Set this AND blank out
          config-file/manifest-file to run config-free (non-manifest) mode.
        type: string
        default: ''
      config-file:
        description: >-
          Path to release-please-config.json. Blank ('') to run non-manifest mode.
        type: string
        default: release-please-config.json
      manifest-file:
        description: >-
          Path to .release-please-manifest.json. Blank ('') to run non-manifest mode.
        type: string
        default: .release-please-manifest.json
      include-component-in-tag:
        description: Whether to prefix tags/branches with the component name.
        type: boolean
        default: false
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY:
        required: true
    outputs:
      release_created:
        description: >-
          true when this run cut a release (tag + GitHub Release), false otherwise.
          Lets a caller gate a follow-on job on an actual release.
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: >-
          Tag of the release this run cut; empty when no release was cut. An
          asset-carrying caller builds on it to upload to the draft release and
          then publish it (see the header).
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions: {}

jobs:
  release-please:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Detect repository flow
        id: flow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$DEFAULT_BRANCH" == "develop" ]]; then
            echo "flow=gitflow" >> "$GITHUB_OUTPUT"
            echo "target_branch=develop" >> "$GITHUB_OUTPUT"
          else
            echo "flow=trunk" >> "$GITHUB_OUTPUT"
            echo "target_branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: ${{ steps.flow.outputs.flow == 'trunk' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Sparse-checkout release tag guard
        if: ${{ steps.flow.outputs.flow == 'gitflow' && github.ref_name == 'main' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: scripts/release-tag-guard.sh
          sparse-checkout-cone-mode: false

      - name: Guard release tags on main
        id: tag-guard
        if: ${{ steps.flow.outputs.flow == 'gitflow' && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash .gh-shared/scripts/release-tag-guard.sh | tee "$RUNNER_TEMP/release-tag-guard.log"
          tail -n 1 "$RUNNER_TEMP/release-tag-guard.log" >> "$GITHUB_OUTPUT"

      - name: Run release-please
        id: release
        if: ${{ steps.flow.outputs.flow == 'trunk' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ steps.flow.outputs.target_branch }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          include-component-in-tag: ${{ inputs.include-component-in-tag }}
          skip-github-release: ${{ steps.flow.outputs.flow == 'gitflow' && (github.ref_name == 'develop' || (github.ref_name == 'main' && steps.tag-guard.outputs.safe != 'true')) }}
          skip-github-pull-request: ${{ steps.flow.outputs.flow == 'gitflow' && github.ref_name == 'main' }}

      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          jq -r '.[].number' <<<"$RELEASE_PRS" | while read -r number; do
            gh pr merge "$number" --auto --squash || gh pr merge "$number" --auto --merge
          done
