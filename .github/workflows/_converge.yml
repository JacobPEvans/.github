# Reusable: CI-gated converge
#
# Fires on a push to a protected branch (the merge IS the gate; no separate
# label). Preflight path filters, open a Vikunja maintenance window,
# mint a scoped OpenBao token, trigger the target and wait (bounded), then
# report and close the window.
#
# `target: terrakube-apply` exchanges this job's own GitHub OIDC token
# directly against Terrakube's Federated OIDC Authentication (org Security
# -> Federated Credentials) — the `mint-token` job is skipped for this
# target, since Terrakube has no OpenBao integration to mint a credential
# against. It plans, creates a plan-and-apply job pinned to that plan,
# approves it only when the plan shows zero destroys, and waits for a
# terminal state; a nonzero destroy count leaves the job `waitingApproval`
# in Terrakube for a human, and fails this run (not a green skip) so the
# park is actually noticed.
# `semaphore-run` and `nix-rebuild` are declared inputs with no job body yet
# — a caller selecting either fails closed at the "Reject an unimplemented
# target" step rather than silently no-op'ing.
name: _converge

on:
  workflow_call:
    inputs:
      filters:
        description: >-
          YAML body for dorny/paths-filter, same convention as _ci-gate.yml's
          `filters` input. The `window-open` job validates and applies it
          before opening the maintenance window.
        type: string
        required: true
      target:
        description: One of terrakube-apply, semaphore-run, nix-rebuild.
        type: string
        required: true
      target_ref:
        description: >-
          Opaque identifier the target step resolves: a Terrakube workspace
          UUID for terrakube-apply, a Semaphore template id for
          semaphore-run, a flake target for nix-rebuild.
        type: string
        required: true
      terrakube_org_id:
        description: Terrakube organization UUID. Required only for target terrakube-apply.
        type: string
        default: ""
      terrakube_template_id:
        description: >-
          UUID of the plan -> approval -> apply job template. Required only
          for target terrakube-apply.
        type: string
        default: ""
      infra_repo:
        description: >-
          owner/repo of the infrastructure root terrakube-apply checks out
          and plans (e.g. dryvist/tofu-proxmox). Pinned to the ref named by
          this (the desired-state) repository's own `.infra-ref` file, so a
          version bump is a normal PR to that file. Required only for
          target terrakube-apply.
        type: string
        default: ""
      window_title:
        description: >-
          The affected host or service, as an FQDN — never a literal IP or a
          ticket id. Becomes the Vikunja maintenance-window task title.
        type: string
        required: true
      window_minutes:
        description: Maintenance window duration in minutes.
        type: number
        default: 60
      vikunja_project_id:
        description: Vikunja project id for maintenance windows.
        type: number
        default: 54
      vikunja_maintenance_label_id:
        description: Vikunja label id applied to every maintenance-window task.
        type: number
        default: 14
      ntfy_topic:
        description: ntfy topic this converge reports its result to.
        type: string
        required: true
      openbao_jwt_mount:
        description: OpenBao auth mount path for the GitHub OIDC JWT method.
        type: string
        default: github-actions
      openbao_jwt_audience:
        description: Audience bound on the OpenBao JWT role (jwtGithubAudience).
        type: string
        required: true
      wait_minutes:
        description: Bounded wait for the target trigger step.
        type: number
        default: 10
      runner_label:
        type: string
        default: self-hosted
    secrets:
      OPENBAO_ADDR:
        required: true
      VIKUNJA_URL:
        description: Base URL, no trailing slash (e.g. https://vikunja.<domain>).
        required: true
      VIKUNJA_SERVICE_USER:
        description: The write-capable Vikunja service account's username.
        required: true
      VIKUNJA_SERVICE_PASSWORD:
        description: The write-capable Vikunja service account's password.
        required: true
      TERRAKUBE_API_ADDR:
        description: Terrakube API base URL. Required only for target terrakube-apply.
        required: false
      NTFY_BASE_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: converge-${{ github.repository }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  # Preflight and open the maintenance window in one job. The filter has no
  # downstream outputs; keeping its validation before the window opens avoids
  # a deep needs chain without changing the caller input.
  window-open:
    name: Open maintenance window
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    outputs:
      task_id: ${{ steps.open.outputs.task_id }}
    steps:
      - name: Reject an unimplemented target
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          case "$TARGET_INPUT" in
            terrakube-apply) exit 0 ;;
            semaphore-run|nix-rebuild)
              echo "::error::target '$TARGET_INPUT' has no job body yet in _converge.yml (see the file header)."
              exit 1
              ;;
            *)
              echo "::error::unknown target '$TARGET_INPUT'"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: ${{ inputs.filters }}
      - name: Open the window
        id: open
        env:
          VIKUNJA_URL: ${{ secrets.VIKUNJA_URL }}
          VIKUNJA_USER: ${{ secrets.VIKUNJA_SERVICE_USER }}
          VIKUNJA_PASSWORD: ${{ secrets.VIKUNJA_SERVICE_PASSWORD }}
          PROJECT_ID: ${{ inputs.vikunja_project_id }}
          LABEL_ID: ${{ inputs.vikunja_maintenance_label_id }}
          WINDOW_TITLE: ${{ inputs.window_title }}
          MINUTES: ${{ inputs.window_minutes }}
          TARGET_INPUT: ${{ inputs.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          login_body="$(jq -n --arg user "$VIKUNJA_USER" --arg pass "$VIKUNJA_PASSWORD" \
            '{username: $user, password: $pass}')"
          jwt="$(curl -fsS --max-time 10 -X POST "${VIKUNJA_URL}/login" \
            -H 'Content-Type: application/json' -d "$login_body" | jq -r '.token')"
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "::error::Vikunja login returned no token"
            exit 1
          fi
          due="$(date -u -d "+${MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)"
          desc="Opened by _converge.yml (target ${TARGET_INPUT}) for ${RUN_URL}"
          body="$(jq -n --arg title "$WINDOW_TITLE" --arg due "$due" --arg desc "$desc" --argjson label "$LABEL_ID" \
            '{title: $title, due_date: $due, description: $desc, labels: [{id: $label}]}')"
          resp="$(curl -fsS --max-time 10 -X PUT "${VIKUNJA_URL}/projects/${PROJECT_ID}/tasks" \
            -H "Authorization: Bearer ${jwt}" -H 'Content-Type: application/json' -d "$body")"
          id="$(printf '%s' "$resp" | jq -r '.id')"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Vikunja task creation returned no id"
            exit 1
          fi
          echo "task_id=$id" >> "$GITHUB_OUTPUT"

  # 2. Trade this job's OIDC token for a scoped OpenBao token, bound to this
  # repository and ref (the docs-publisher pattern already in production —
  # see the docs publisher workflow). The role name
  # equals `inputs.target`; each target's own AppRole-free JWT role and its
  # narrow policy are provisioned in ansible-proxmox-apps, not here. The
  # minted token is used only within this job — no other job reads it.
  # Skipped for terrakube-apply: that target authenticates with its own
  # GitHub OIDC token directly against Terrakube, never OpenBao, so running
  # this step would require an unused `terrakube-apply` OpenBao JWT role to
  # exist — a hidden failure point for a credential nothing consumes.
  mint-token:
    name: Mint scoped OpenBao token
    needs: window-open
    if: inputs.target != 'terrakube-apply'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint
        id: mint
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.OPENBAO_ADDR }}
          method: jwt
          path: ${{ inputs.openbao_jwt_mount }}
          role: ${{ inputs.target }}
          jwtGithubAudience: ${{ inputs.openbao_jwt_audience }}
          exportEnv: false

  # 3. Trigger and wait, bounded by `inputs.wait_minutes`. Terrakube verifies
  # this job's own GitHub OIDC token directly (org Security -> Federated
  # Credentials). mint-token is deliberately NOT in this job's `needs`: a
  # job whose `needs` names a SKIPPED job is itself skipped unless its
  # `if:` uses a status function, and mint-token is skipped for this
  # target. `window-open` stays in `needs` so the window is open before
  # this job can start, which mint-token's own `needs: window-open` used
  # to guarantee transitively.
  trigger:
    name: Trigger target
    needs: window-open
    if: inputs.target == 'terrakube-apply'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || inputs.wait_minutes }}
    permissions:
      contents: read
      id-token: write
    outputs:
      confirmation_url: ${{ steps.run.outputs.confirmation_url }}
    steps:
      - name: Checkout the desired-state repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sparse-checkout the gated-apply script from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          # Must be `job.workflow_sha`, not `github.job_workflow_sha`: the
          # latter is empty whenever this workflow runs nested two levels
          # deep (a caller invokes this workflow, which invokes another),
          # and an empty `ref` silently checks out the default branch
          # instead — same reasoning as _ci-gate.yml's identical checkout
          # step.
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: scripts/terrakube-gated-apply.sh
          sparse-checkout-cone-mode: false
      - name: Verify the gated-apply script still classifies
        run: bash .gh-shared/scripts/terrakube-gated-apply.sh --self-check
      # The OIDC token exchange and the .infra-ref read both live in the
      # script now (no inline logic in YAML) — this step only sets what
      # the script cannot know about itself.
      - name: Create, gate, and wait for the Terrakube job
        id: run
        env:
          TERRAKUBE_API_ADDR: ${{ secrets.TERRAKUBE_API_ADDR }}
          TERRAKUBE_ORG_ID: ${{ inputs.terrakube_org_id }}
          TERRAKUBE_WORKSPACE_ID: ${{ inputs.target_ref }}
          TERRAKUBE_TEMPLATE_ID: ${{ inputs.terrakube_template_id }}
          INFRA_REPO: ${{ inputs.infra_repo }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          set -euo pipefail
          [ -n "${TERRAKUBE_API_ADDR:-}" ] || { echo "::error::TERRAKUBE_API_ADDR secret not set"; exit 1; }
          bash .gh-shared/scripts/terrakube-gated-apply.sh

  # 4. Report and close. Runs on `always()` so a failed trigger still closes
  # the window rather than leaving it open indefinitely. Sets `done` FIRST:
  # a transient failure of the best-effort comment must never leave the
  # window open.
  report-and-close:
    name: Report and close window
    needs: [window-open, trigger]
    if: always() && needs.window-open.result == 'success'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - name: Publish the result to ntfy
        env:
          BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          TOPIC: ${{ inputs.ntfy_topic }}
          TARGET_INPUT: ${{ inputs.target }}
          TRIGGER_RESULT: ${{ needs.trigger.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${BASE_URL:-}" ]; then
            echo "NTFY_BASE_URL not configured; skipping the audit publish."
            exit 0
          fi
          echo "::add-mask::$BASE_URL"
          host="${BASE_URL#*://}"; host="${host%%/*}"
          [ -n "$host" ] && echo "::add-mask::$host" && echo "::add-mask::${host%%:*}"
          curl -sS --max-time 30 -X POST "${BASE_URL%/}/${TOPIC}" \
            -H "Title: converge ${TARGET_INPUT} ${TRIGGER_RESULT}" \
            --data "${RUN_URL}" || true

      - name: Close the Vikunja window
        env:
          VIKUNJA_URL: ${{ secrets.VIKUNJA_URL }}
          VIKUNJA_USER: ${{ secrets.VIKUNJA_SERVICE_USER }}
          VIKUNJA_PASSWORD: ${{ secrets.VIKUNJA_SERVICE_PASSWORD }}
          TASK_ID: ${{ needs.window-open.outputs.task_id }}
          TRIGGER_RESULT: ${{ needs.trigger.result }}
        run: |
          set -euo pipefail
          login_body="$(jq -n --arg user "$VIKUNJA_USER" --arg pass "$VIKUNJA_PASSWORD" \
            '{username: $user, password: $pass}')"
          jwt="$(curl -fsS --max-time 10 -X POST "${VIKUNJA_URL}/login" \
            -H 'Content-Type: application/json' -d "$login_body" | jq -r '.token')"
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "::error::Vikunja login returned no token"
            exit 1
          fi
          curl -fsS --max-time 10 -X POST "${VIKUNJA_URL}/tasks/${TASK_ID}" \
            -H "Authorization: Bearer ${jwt}" -H 'Content-Type: application/json' \
            -d '{"done": true}' >/dev/null
          comment_body="$(jq -n --arg comment "converge result: ${TRIGGER_RESULT}" '{comment: $comment}')"
          curl -fsS --max-time 10 -X POST "${VIKUNJA_URL}/tasks/${TASK_ID}/comments" \
            -H "Authorization: Bearer ${jwt}" -H 'Content-Type: application/json' \
            -d "$comment_body" >/dev/null || true
