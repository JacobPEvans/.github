# Reusable: CI Gate (Merge Gatekeeper)
#
# Centralizes the conditional-required-check pattern that previously lived as
# duplicated `ci-gate.yml` files in every consumer repo.
#
# What this workflow does:
#
#   scope    -> content-aware classifier (dryvist/ai-workflows'
#               scope-classify.yml, "Jev"); a SECOND, additional layer on
#               top of `changes` below, narrowing further, never replacing
#               it - see "Content-aware scope classifier" below
#   changes  -> dorny/paths-filter on caller-supplied filters
#   <check jobs> -> per-check reusable workflows, gated on (input toggle && filter)
#   watchdog -> watches every sibling until it completes; cancels the run when
#               any job waits for a runner longer than queue_timeout_minutes
#   gate     -> name MUST stay "Merge Gate" (matches branch protection rulesets);
#               aggregates results with the shared result script
#
# Content-aware scope classifier (`scope` job):
#
# Runs unconditionally, in parallel with `changes`. Every conditional check
# job below carries its ORIGINAL filter-based `if:`, ANDed with one more
# clause reading `needs.scope.outputs.ci` (or `.molecule`) - narrowing
# further when the classifier is confident nothing more is needed, never
# widening past what the filter already allows. A lint/format/security-scan
# tier job runs when `ci` is `full` OR `lint-only` (only skips on `none`); a
# full-suite tier job (Nix Build, Python CI) requires `ci == 'full'`. Every
# such clause reads `needs.scope.result != 'success' || ...`: a scope job
# that fails, or has no TYPESAFE_API_KEY plumbed through this file's own
# caller yet, defers ENTIRELY to the pre-existing filter - "the classifier
# is unreachable" behaves exactly like "this feature doesn't exist yet",
# never like "skip everything". `dependency-review`, `zizmor`, `osv-scan`,
# and `renovate-annotations` are deliberately NOT gated on `scope` - each
# has its own documented reason a supply-chain/workflow-security scan must
# never be skippable by ANY signal, deterministic or classified.
# `markdown-lint` and `file-size` depend only on their path filters, never on
# `scope`: the classifier may narrow optional jobs, not these two.
# https://github.com/dryvist/ai-workflows/blob/main/.github/scope-rubric.md
#
# Why the watchdog exists:
#
# GitHub Actions only schedules a `needs:` dependent once every upstream job
# reaches a *terminal* state (success/failure/cancelled/skipped). A job stuck
# waiting for a runner (e.g. a self-hosted runner never picks it up) is NOT
# terminal. If any job waits past the timeout, the watchdog cancels the run so an
# incomplete check set cannot pass the required `Merge Gate`.
#
# Caller requirements (thin consumer shape):
#
#   jobs:
#     gate:
#       permissions:
#         contents: read
#         pull-requests: read
#         actions: write   # REQUIRED: the watchdog cancels queued jobs via the
#                          # Actions API, and a called workflow can never exceed
#                          # the caller's token grant — omitting this fails the
#                          # entire run at workflow-graph validation
#                          # (startup_failure, 0s, no jobs, UI-only error).
#       uses: dryvist/.github/.github/workflows/_ci-gate.yml@<40-hex commit SHA> # vX.Y.Z
#
# That is the whole caller for a markdown-only repo: `markdown_lint` and
# `file_size` default on, and `filters` defaults to the `markdown` block
# below. Pass `with:` only for what differs (a `nix`/`python`/`ansible`/
# `terraform` filter, a toggle, a runner label).
#
# Scope policy (canonical): a check runs in proportion to the change that
# triggered it; the one guaranteed end-to-end sweep is promotion to a
# git-flow repo's production branch. Narrow at the consumer, never in a
# filter several repos share, and never let the job that decides what to
# skip be skippable itself.
# https://docs.jacobpevans.com/d/decisions/ci-scope-follows-the-change/
#
# Filter name convention (caller defines these in `filters:` input):
#
#   nix            -> gates `nix_validate` (profile nix enables it); `nix_build` is opt-in
#   markdown       -> gates `markdown_lint`, `file_size`, and `token_limits`
#                     (`file_size` also fires on `nix` and `terraform`)
#   python         -> gates `python_security`
#   ansible        -> gates `ansible_ci`
#   terraform      -> gates `tofu_ci`
#   extra          -> gates nothing here; exported as the `extra` output so a
#                     caller can gate ONE repo-local job without a second
#                     `changes` job of its own
#
# `dependency_review` runs on PUBLIC repos only: `actions/dependency-review-
# action` needs GitHub Advanced Security to read the dependency graph, which
# is off on private/internal repos (their dependency-graph API 403s), so the
# job auto-skips there — tolerated via `allowed-skips`, gate stays green. It
# is NOT filter-gated: on the repos where it runs, it runs on every
# `pull_request` event when enabled, regardless of which paths changed (a
# supply-chain scan must not be skippable by touching only "safe" paths).
#
# `zizmor` (workflow-security scan) is likewise NOT filter-gated — it runs on
# every `pull_request` event when enabled, regardless of which paths changed,
# since a security scan must not be evadable by touching only untracked paths.
#
# PERMISSIONS INVARIANT for jobs in this file: never request more than the
# STANDARD caller grant (contents: read, pull-requests: read, actions: write).
# A called workflow's job that requests more than its caller granted kills
# the ENTIRE run at graph validation (startup_failure) — even if the job's
# `if:` is false — taking every consumer's Merge Gate down with it.
# Anything needing an elevated scope must receive it from the caller's own
# job-level grant, never from a `permissions:` block here. The invariant
# applies TRANSITIVELY to every workflow this gate calls: a child (or a
# child's child) declaring an elevated workflow-level `permissions:` block
# poisons the whole graph the same way.
#
# `osv_scan` (default false) runs `_osv-scan.yml` on every pull_request when
# enabled — not filter-gated, same reasoning as `dependency_review`. It fits
# under this gate because `_osv-scan.yml` runs the scanner binary itself with
# `contents: read` only (no code-scanning upload), so it stays inside the
# PERMISSIONS INVARIANT. Scheduled full scans are not part of the gate; a repo
# that wants them keeps its own scheduled caller.
#
# `nix_skip_deps_only` (default false, opt-in): when enabled, `nix-validate`
# and `nix-build` are skipped for dependency-only bot PRs — the authors live
# in `scripts/ci-gate-detect-deps-only.sh` and are pinned by its self-check,
# rather than restated here where a copy silently rotted once already —
# UNLESS `flake.lock` or any `*.nix` file changed, since a lockfile bump
# must still build and a version bump in a `.nix` file can move a
# fixed-output hash. The signals are computed once in `changes`
# (`is-deps-only`, `is-flake-lock-change`, `is-nix-source-change`) and
# reused by both jobs.
#
# Fork-PR runner guard (central invariant): every `runs-on:`/`runner_label:`
# in this file resolves through
#   (!github.event.pull_request ||
#    github.event.pull_request.head.repo.full_name == github.repository)
#     && inputs.runner_label || 'ubuntu-24.04'
# The orchestration jobs (`changes`, `watchdog`, `gate`) substitute
# `inputs.orchestration_runner` for `inputs.runner_label` in that expression.
# A fork PR must never execute fork-author-controlled code on a caller's
# self-hosted RunsOn runners; same-repo PRs and non-PR events keep the
# caller's label. Centralized here so consumers (nix-ai, nix-darwin, ...) no
# longer repeat the guard on every job. Pattern reference:
# runs-on.com/configuration/job-labels (Fork PRs).
#
# Callers may include additional filters; this workflow ignores them. To add
# a new conditional check, add: input toggle, conditional job, and entry in
# the gate's `needs:` and `allowed-skips`.

name: _ci-gate

on:
  workflow_call:
    inputs:
      filters:
        description: >-
          YAML body for dorny/paths-filter. Use the convention names listed
          in this file's header to enable the matching conditional check.
          Empty (default) uses the `profile` block when a profile is set,
          otherwise the markdown block. A non-empty value overrides the
          profile's block.
        type: string
        required: false
        default: ''

      profile:
        description: >-
          Preset that supplies a default `filters` block and enables its
          matching toggles: ansible, nix, tofu, python or docs. Empty
          (default) keeps the explicit-input behaviour. A profile toggle is
          OR-ed with its explicit input, so `profile` enables a job but cannot
          turn one off.
        type: string
        required: false
        default: ''

      nix_validate:
        description: Enable `Nix Validate` (gated on `nix` filter)
        type: boolean
        default: false
      all_systems:
        description: >-
          Pass --all-systems to `nix flake check`. Default true catches
          darwin-only `meta.broken` packages from a linux runner. Set false
          only when consumer flakes declare platform-specific check
          derivations that cannot be made platform-aware (rare — prefer
          fixing the flake to use `runCommandLocal` or to scope source-only
          checks to the CI system).
        type: boolean
        default: true
      nix_build:
        description: >-
          Enable `Nix Build` (gated on `nix` filter). Builds the flake on
          macos-latest via `_nix-build.yml` (hardcoded macOS runner — that
          workflow has no `runner_label` input, so the fork-PR guard below
          does not apply to it). On pull_request events the build runs only
          when the PR targets `main` — see the job's own comment.
        type: boolean
        default: false
      nix_build_command:
        description: >-
          Build command for `Nix Build`, passed to `_nix-build.yml` as
          `build-command`. Empty (default) runs the home-manager
          `homeConfigurations.$(whoami).activationPackage` build.
        type: string
        required: false
        default: ''
      nix_skip_deps_only:
        description: >-
          Skip `nix-validate`/`nix-build` on dependency-only bot PRs (see
          header). Default false — a repo opts in once its dependency-bump
          PRs are stable enough to trust without a full build.
        type: boolean
        default: false
      markdown_lint:
        description: Enable `Markdown Lint` (gated on `markdown` filter)
        type: boolean
        default: true
      file_size:
        description: Enable `File Size` (gated on `nix`, `markdown`, or `terraform` filter — the org byte limits scan .md, .nix and .tf)
        type: boolean
        default: true
      token_limits:
        description: >-
          Enable `Token Limits` (gated on `markdown` filter). Budgets AI-read
          docs via tiktoken per .token-limits.yaml; pairs with `file_size`,
          which skips token-gated files. No secret required.
        type: boolean
        default: false
      python_security:
        description: Enable `Python Security` (gated on `python` filter)
        type: boolean
        default: false
      python_security_dirs:
        description: Space-separated dirs passed to _python-security.yml
        type: string
        default: '.'
      python_security_ignore_vulns:
        description: Space-separated vulnerability IDs passed to _python-security.yml `ignore-vulns`
        type: string
        default: ''
      python_ci:
        description: Enable `Python CI` lint/format/type/test gate (gated on `python` filter)
        type: boolean
        default: false
      python_ci_versions:
        description: >-
          JSON array of Python versions for the Python CI pytest matrix. Default
          covers ALL currently non-EOL Python releases; a consumer narrows it
          (e.g. to min + latest) by passing its own array.
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      ansible_ci:
        description: >-
          Enable `Ansible CI` (ansible-lint + molecule via `_ansible-ci.yml`,
          gated on `ansible` filter). Callers must define an `ansible:` key
          in their `filters` input, same convention as `python`. Called with
          `emit_gate: false` — this gate is the sole "Merge Gate" aggregator,
          so `_ansible-ci.yml`'s own nested gate job is suppressed.
        type: boolean
        default: false
      renovate_annotations:
        description: >-
          Enable `Renovate Annotations` (fails on an unannotated version pin
          under a path the annotated-pin Renovate customManagers cover, via
          `_renovate-annotations.yml`). NOT filter-gated — unlike most
          toggles here it runs on every PR once enabled, because a caller
          whose `filters` input lacks an `ansible:` key would otherwise skip
          it forever with no error (see the job's own comment). The check
          itself is a fast file scan, so running it unconditionally is cheap.
          Ansible repos should prefer enabling it via `_ansible-ci.yml`'s own
          `renovate_annotations` input instead — none of them call this
          `_ci-gate.yml` directly.
        type: boolean
        default: false
      tofu_ci:
        description: >-
          Enable `OpenTofu CI` (fmt/init/validate/tflint via `_tofu-ci.yml`,
          gated on `terraform` filter). Callers define a `terraform:` key in
          `filters` (e.g. `**.tf`, `**.tofu`, `.tflint.hcl`, `**/*.tfvars`).
        type: boolean
        default: false
      tofu_working_directories:
        description: JSON array of directories `_tofu-ci.yml` validates
        type: string
        default: '["."]'
      osv_scan:
        description: >-
          Enable `OSV Scanner` on every pull_request (differential scan; not
          filter-gated). Replaces a standalone osv-scan.yml caller.
        type: boolean
        default: false
      osv_config_file:
        description: Path to an osv-scanner.toml passed to _osv-scan.yml `config_file`
        type: string
        default: ''
      dependency_review:
        description: >-
          Enable `Dependency Review`. Runs on PUBLIC repos only —
          actions/dependency-review-action needs GitHub Advanced Security to
          read the dependency graph, which is off on private/internal repos,
          so the job auto-skips there (tolerated via `allowed-skips`). On
          repos where it runs, it fires on every `pull_request` event,
          unconditionally — NOT gated on any `filters` output, since a
          supply-chain scan must not be skippable by touching only untracked
          paths.
        type: boolean
        default: true

      agent_pr_body:
        description: Enable Agent PR Body (advisory pilot, never in gate.needs)
        type: boolean
        default: false
      agent_pr_body_block:
        description: Fail Agent PR Body instead of only warning
        type: boolean
        default: false

      zizmor:
        description: >-
          Enable `Workflow Security (zizmor)`. Runs on every `pull_request`
          event, unconditionally — NOT gated on any `filters` output, since a
          security scan must not be skippable by touching only untracked
          paths.
        type: boolean
        default: true

      runner_label:
        description: >-
          GitHub Actions runner label for the check jobs in this workflow.
          Also passed through to every child reusable workflow this gate calls
          (`Nix Validate`, `Markdown Lint`, `File Size`, `Python Security`),
          so a single input migrates the whole gate. The orchestration jobs
          (`Detect Changes`, `Queue Watchdog`, `Merge Gate`) use
          `orchestration_runner` instead.
          Defaults to ubuntu-24.04. Pass a RunsOn label
          (see runs-on.com/configuration/job-labels) to opt in.
        type: string
        required: false
        default: ubuntu-24.04

      orchestration_runner:
        description: >-
          GitHub Actions runner label for the orchestration jobs (`Detect
          Changes`, `Queue Watchdog`, `Merge Gate`). Defaults to a
          GitHub-hosted image, so an unavailable self-hosted pool cannot leave
          the gate queued. Subject to the same fork-PR guard as `runner_label`.
        type: string
        required: false
        default: ubuntu-24.04

      nix_validate_runner_label:
        description: >-
          Runner label for `Nix Validate` only. `nix flake check` on a large
          flake needs more CPU and disk than the doc checks, and a consumer
          should not have to move its whole gate onto a big runner (or keep a
          repo-local copy of the job) to give one job a bigger machine. Empty
          (default) means "same as runner_label". Subject to the same fork-PR
          guard.
        type: string
        required: false
        default: ''

      nix_validate_timeout_minutes:
        description: >-
          Opt-in running-job timeout for `Nix Validate` only, forwarded as
          `timeout_minutes` to `_nix-validate.yml`. 0 (default) keeps the org
          variable GH_ACTION_TIMEOUT_NIX (fallback 15). Use only for a repo
          whose cold `nix flake check` closure is known to exceed the default.
        type: number
        required: false
        default: 0

      ansible_lint_args:
        description: >-
          Extra arguments for ansible-lint, forwarded to `_ansible-ci.yml`'s
          `lint_args`, for example `tests/canary/ansible` to lint one directory.
          Empty (default) keeps the lint scope unchanged.
        type: string
        required: false
        default: ''

      workflow_lint:
        description: >-
          Enable `Workflow Lint`: actionlint over the caller's `.github/workflows/`,
          so a broken reusable-workflow contract (an unknown input, a missing
          file) fails the gate instead of making the run a missing check. Not
          filter-gated. Off by default during rollout.
        type: boolean
        default: false

      test_command:
        description: >-
          Shell command that runs this repo's own unit tests as the `Repo Tests`
          check, for example `bun test`. Empty (default) turns the check off.
          Node 22 is always set up. When `bun.lock` or `bun.lockb` exists, bun
          is installed with `bun install --frozen-lockfile` first.
        type: string
        required: false
        default: ''

      queue_timeout_minutes:
        description: >-
          Minutes the watchdog waits before cancelling sibling jobs still in
          `queued` state. Default 10. Cap your slowest gate-path job at well
          below this value or it will be killed before it starts.
        type: number
        default: 10

    # Export the change detection this workflow already performs. Without
    # these, a caller that needs to gate a job of its own has no way to reach
    # the answer and has to re-run dorny/paths-filter in a duplicate `changes`
    # job — which is what tofu-proxmox, nix-darwin and mlx-benchmarks each do
    # today, with three copies of the filter body free to drift apart.
    # `_ansible-ci.yml` already exports its filters; this matches it.
    outputs:
      nix:
        description: Whether the change touched Nix paths
        value: ${{ jobs.changes.outputs.nix }}
      markdown:
        description: Whether the change touched Markdown paths
        value: ${{ jobs.changes.outputs.markdown }}
      python:
        description: Whether the change touched Python paths
        value: ${{ jobs.changes.outputs.python }}
      ansible:
        description: Whether the change touched Ansible paths
        value: ${{ jobs.changes.outputs.ansible }}
      extra:
        description: >-
          Whether the change touched the caller's own `extra` filter key, for
          gating one repo-local job this gate cannot host. Empty when the
          caller defines no such key.
        value: ${{ jobs.changes.outputs.extra }}
      is-deps-only:
        description: Whether the pull request is a dependency-only update
        value: ${{ jobs.changes.outputs.is-deps-only }}
      is-flake-lock-change:
        description: Whether the change touched flake.lock
        value: ${{ jobs.changes.outputs.is-flake-lock-change }}
      scope_ci:
        description: >-
          Content-aware scope classifier's ci output (full | lint-only |
          none), for a caller that wants to gate a job of its own the same
          way this file's own jobs are gated. Empty when `scope` failed -
          treat empty the same as "full" (defer to your own filters), never
          as "none".
        value: ${{ jobs.scope.outputs.ci }}
      scope_molecule:
        description: Scope classifier's molecule output (full | changed-roles | none)
        value: ${{ jobs.scope.outputs.molecule }}
      scope_source:
        description: jev | fallback - whether the scope outputs came from the classifier or a fail-safe default
        value: ${{ jobs.scope.outputs.source }}

    secrets:
      TYPESAFE_API_KEY:
        description: >-
          Bearer token for the scope classifier's typesafe.ai API call.
          Not required: a caller that hasn't plumbed this secret through
          yet gets an empty key, which the classifier's own fail-safe
          already turns into source=fallback, full/yes - never a startup
          error.
        required: false
      GH_APP_PRIVATE_KEY:
        description: >-
          Optional. Lets the flake freshness check resolve private flake
          inputs; public inputs resolve without it.
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================================
  # CONTENT-AWARE SCOPE CLASSIFIER
  # Always runs (no `if:`), independent of `changes` below. Its outputs are
  # a SECOND, additional layer on top of the deterministic path filters
  # `changes` already computes - narrowing further, never replacing them
  # (each conditional job below still carries its original filter-based
  # `if:`). `allowed-failures: scope` in the gate aggregate means a
  # classifier infra failure is visible as a red job but never blocks the
  # Merge Gate; every job below only narrows when `needs.scope.result ==
  # 'success'` AND the output says so, so a scope failure or an empty
  # secret defers entirely to the pre-existing filter logic (the classifier
  # is unreachable = everything the filters already decided still runs).
  # https://github.com/dryvist/ai-workflows/blob/main/.github/scope-rubric.md
  scope:
    name: Classify CI scope (Jev)
    uses: dryvist/ai-workflows/.github/workflows/scope-classify.yml@e77c7f08b2f33f5dd3e1dff25c65056892ece445 # v0.48.2
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  # ============================================================================
  # CHANGE DETECTION
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.orchestration_runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      nix: ${{ steps.filter.outputs.nix == 'true' || (inputs.profile == 'nix' && steps.unmapped.outputs.full == 'true') }}
      markdown: ${{ steps.filter.outputs.markdown == 'true' || (inputs.profile == 'docs' && steps.unmapped.outputs.full == 'true') }}
      python: ${{ steps.filter.outputs.python == 'true' || (inputs.profile == 'python' && steps.unmapped.outputs.full == 'true') }}
      ansible: ${{ steps.filter.outputs.ansible == 'true' || (inputs.profile == 'ansible' && steps.unmapped.outputs.full == 'true') }}
      terraform: ${{ steps.filter.outputs.terraform == 'true' || (inputs.profile == 'tofu' && steps.unmapped.outputs.full == 'true') }}
      extra: ${{ steps.filter.outputs.extra }}
      profile-unmapped: ${{ steps.unmapped.outputs.full == 'true' }}
      is-deps-only: ${{ steps.detect-deps.outputs.is-deps-only }}
      is-flake-lock-change: ${{ steps.lockfilter.outputs.flake-lock }}
      is-nix-source-change: ${{ steps.lockfilter.outputs.nix-source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # One filter body: an explicit `filters` input wins, else the profile's
      # block, else the markdown default (the behaviour with no profile set).
      - name: Resolve filter body
        id: resolve
        env:
          PROFILE: ${{ inputs.profile }}
          CALLER_FILTERS: ${{ inputs.filters }}
        run: |
          set -euo pipefail
          markdown='markdown:
            - "**.md"
            - ".markdownlint*"'
          case "$PROFILE" in
            "") block="" ;;
            ansible) block='ansible:
            - "ansible/**"
            - "roles/**"
            - "playbooks/**"
            - "inventory/**"
            - "**/molecule/**"
            - "**/group_vars/**"
            - "**/host_vars/**"
            - "requirements.yml"
            - ".ansible-lint*"' ;;
            nix) block='nix:
            - "**.nix"
            - "flake.lock"' ;;
            tofu) block='terraform:
            - "**.tf"
            - "**.tofu"
            - ".tflint.hcl"
            - "**/*.tfvars"' ;;
            python) block='python:
            - "**.py"
            - "pyproject.toml"
            - "uv.lock"
            - "**/requirements*.txt"
            - "setup.cfg"
            - "setup.py"' ;;
            docs) block="" ;;
            *)
              echo "::error::unknown profile '$PROFILE' (expected ansible, nix, tofu, python or docs)"
              exit 1
              ;;
          esac
          if [[ -n "$CALLER_FILTERS" ]]; then
            body="$CALLER_FILTERS"
          elif [[ -n "$block" ]]; then
            body="$markdown"$'\n'"$block"
          else
            body="$markdown"
          fi
          if [[ -n "$PROFILE" ]]; then
            body="$body"$'\n'"changed-all:"$'\n'"  - \"**\""
          fi
          {
            echo "filters<<RESOLVED_FILTERS_EOF"
            printf '%s\n' "$body"
            echo "RESOLVED_FILTERS_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # On a push, comparing to the same long-lived branch makes the
          # action use the commit immediately before the push as its base.
          # PR events continue to compare against their PR base branch.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: ${{ steps.resolve.outputs.filters }}
          # Lists each filter's matched files; `changed-all` (appended by the
          # resolve step under a profile) lists every changed file.
          list-files: ${{ inputs.profile != '' && 'json' || 'none' }}

      # Static (not caller-supplied) so `is-flake-lock-change` and
      # `is-nix-source-change` are always available regardless of how a
      # caller's `filters` input defines its own `nix` key.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: lockfilter
        with:
          # Keep static lock/source classification aligned with the caller's
          # push range; PR events continue to use their PR base branch.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            flake-lock:
              - 'flake.lock'
            nix-source:
              - '**.nix'

      - name: Sparse-checkout shared scripts from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          # The commit this reusable workflow was loaded from, NOT main.
          # Hardcoding `main` made a workflow running from a branch pull its
          # scripts from a different commit than the one under test: the
          # self-check below ran main's copy, which has no --self-check flag,
          # so it ignored the argument, did its normal work and exited 0 —
          # green, having verified nothing. The same mismatch pairs a changed
          # workflow with an incompatible script in ordinary use. Must be
          # `job.workflow_sha`, not `github.job_workflow_sha`: the latter is
          # empty whenever this workflow runs nested two levels deep (a
          # caller invokes this workflow, which invokes another), and an
          # empty `ref` silently checks out the default branch instead.
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: |
            scripts/ci-gate-detect-deps-only.sh
            scripts/ci-gate-unmapped.sh
          sparse-checkout-cone-mode: false

      # A profile must never skip a path it does not map: a changed file (docs
      # excepted) that no filter covers runs the full profile with a warning.
      - name: Flag paths no profile filter covers
        id: unmapped
        if: ${{ inputs.profile != '' }}
        env:
          ALL: ${{ steps.filter.outputs.changed-all_files }}
          NIX: ${{ steps.filter.outputs.nix_files }}
          MARKDOWN: ${{ steps.filter.outputs.markdown_files }}
          PYTHON: ${{ steps.filter.outputs.python_files }}
          ANSIBLE: ${{ steps.filter.outputs.ansible_files }}
          TERRAFORM: ${{ steps.filter.outputs.terraform_files }}
          EXTRA: ${{ steps.filter.outputs.extra_files }}
        run: bash .gh-shared/scripts/ci-gate-unmapped.sh

      # Milliseconds, and it is the only thing standing between a stale author
      # literal and a detector that answers "false" forever without saying so.
      - name: Verify the deps-only detector still classifies
        run: bash .gh-shared/scripts/ci-gate-detect-deps-only.sh --self-check

      - name: Detect Dependency-Only Commits
        id: detect-deps
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          COMMIT_MSG: ${{ github.event.pull_request.title }}
        run: bash .gh-shared/scripts/ci-gate-detect-deps-only.sh

  # ============================================================================
  # CONDITIONAL CHECKS
  # Each is gated on `inputs.<toggle>` AND `needs.changes.outputs.<filter>`.
  # Disabled or untouched paths skip; the gate aggregate accepts configured skips.
  # ============================================================================
  nix-validate:
    name: Nix Validate
    needs: [changes, scope]
    # Second layer on top of the filter-based condition: only narrows
    # further when `scope` definitively succeeded and said "none" - a
    # scope failure (or a caller with no TYPESAFE_API_KEY plumbed through)
    # defers entirely to the filter, exactly as before this job existed.
    if: ${{ !cancelled() && (inputs.nix_validate || inputs.profile == 'nix') && needs.changes.outputs.nix == 'true' && (inputs.nix_skip_deps_only == false || needs.changes.outputs.is-deps-only != 'true' || needs.changes.outputs.is-flake-lock-change == 'true' || needs.changes.outputs.is-nix-source-change == 'true') && (needs.changes.outputs.profile-unmapped == 'true' || needs.scope.result != 'success' || needs.scope.outputs.ci != 'none') }}
    # Keep nested workflow calls on the same immutable source revision while
    # validating changes to this reusable workflow repository.
    uses: ./.github/workflows/_nix-validate.yml
    with:
      all_systems: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.all_systems }}
      focused_checks: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.nix_validate_runner_label || inputs.runner_label) || 'ubuntu-24.04' }}
      timeout_minutes: ${{ inputs.nix_validate_timeout_minutes }}

  # macos-latest is hardcoded in _nix-build.yml (no runner_label input), so
  # the fork-PR guard doesn't apply here.
  #
  # PR-base gate: on pull_request events the full build runs only when the PR
  # targets `main`. This is the scope policy's end-to-end sweep placed at the
  # one point it is guaranteed: a trunk repo's every PR targets main
  # (unaffected), while a git-flow repo's develop PRs take the fast path
  # (`nix-validate`) and the develop->main promotion PR runs the full build.
  # The base-ref check lives in this `if:` rather than an input default
  # because workflow_call input defaults must be static — they cannot read
  # `github.base_ref`. Non-PR events (push, schedule, dispatch) keep building.
  nix-build:
    name: Nix Build
    needs: [changes, scope]
    # Full-suite tier: only narrows when `scope` succeeded AND said
    # something other than "full" (lint-only or none skip it); a scope
    # failure defers to the filter/base-ref condition alone, same as
    # before this job existed.
    if: ${{ !cancelled() && inputs.nix_build && (github.event_name != 'pull_request' || github.base_ref == 'main') && needs.changes.outputs.nix == 'true' && (inputs.nix_skip_deps_only == false || needs.changes.outputs.is-deps-only != 'true' || needs.changes.outputs.is-flake-lock-change == 'true' || needs.changes.outputs.is-nix-source-change == 'true') && (needs.changes.outputs.profile-unmapped == 'true' || needs.scope.result != 'success' || (needs.scope.outputs.ci != 'lint-only' && needs.scope.outputs.ci != 'none')) }}
    uses: ./.github/workflows/_nix-build.yml
    with:
      build-command: ${{ inputs.nix_build_command }}

  markdown-lint:
    name: Markdown Lint
    needs: changes
    if: ${{ !cancelled() && inputs.markdown_lint && needs.changes.outputs.markdown == 'true' }}
    uses: ./.github/workflows/_markdown-lint.yml
    with:
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  file-size:
    name: File Size
    needs: changes
    if: ${{ !cancelled() && inputs.file_size && (needs.changes.outputs.nix == 'true' || needs.changes.outputs.markdown == 'true' || needs.changes.outputs.terraform == 'true') }}
    uses: ./.github/workflows/_file-size.yml
    with:
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  token-limits:
    name: Token Limits
    needs: [changes, scope]
    if: ${{ !cancelled() && inputs.token_limits && needs.changes.outputs.markdown == 'true' && (needs.scope.result != 'success' || needs.scope.outputs.ci != 'none') }}
    uses: ./.github/workflows/_token-limits.yml
    with:
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  python-security:
    name: Python Security
    needs: [changes, scope]
    if: ${{ !cancelled() && (inputs.python_security || inputs.profile == 'python') && needs.changes.outputs.python == 'true' && (needs.changes.outputs.profile-unmapped == 'true' || needs.scope.result != 'success' || needs.scope.outputs.ci != 'none') }}
    uses: ./.github/workflows/_python-security.yml
    with:
      python-dirs: ${{ inputs.python_security_dirs }}
      ignore-vulns: ${{ inputs.python_security_ignore_vulns }}
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}
    # No `secrets: inherit` — _python-security.yml declares and consumes no
    # secrets, and unconditional inheritance trips zizmor's secrets-inherit
    # audit. (Divergence from the JacobPEvans-personal original, on purpose.)

  python-ci:
    name: Python CI
    needs: [changes, scope]
    # Full-tier: this runs the full lint/format/type/test matrix, not just
    # a fast validate - only narrows when scope succeeded and said
    # something other than full.
    if: ${{ !cancelled() && (inputs.python_ci || inputs.profile == 'python') && needs.changes.outputs.python == 'true' && (needs.changes.outputs.profile-unmapped == 'true' || needs.scope.result != 'success' || (needs.scope.outputs.ci != 'lint-only' && needs.scope.outputs.ci != 'none')) }}
    uses: ./.github/workflows/_python-ci.yml
    with:
      python_versions: ${{ inputs.python_ci_versions }}
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  # dependency-review is intentionally NOT `needs: changes` / filter-gated —
  # a supply-chain scan must run on every pull_request regardless of which
  # paths a diff touches. It IS gated to public repos: dependency-review-
  # action needs GHAS to read the dependency graph, which is off on
  # private/internal repos (403s there) — those skip, which the gate
  # tolerates via allowed-skips.
  dependency-review:
    name: Dependency Review
    if: ${{ inputs.dependency_review && github.event_name == 'pull_request' && github.event.repository.private == false }}
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 10
    # contents:read ONLY — a called workflow's job may never request more than
    # the caller granted, or the whole run dies at graph validation
    # (startup_failure) before any job starts. `pull-requests: write` (for
    # comment-summary-in-pr) exceeded the standard caller grant and broke
    # every consumer's gate; failure detail lives in the check-run output
    # instead of a PR comment.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # zizmor is intentionally NOT `needs: changes` / filter-gated — a workflow-
  # security scan must run on every pull_request regardless of which paths a
  # diff touches.
  zizmor:
    name: Workflow Security (zizmor)
    if: ${{ inputs.zizmor && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_zizmor.yml
    with:
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  # Deliberately NOT in `gate.needs` — advisory pilot, warns only (see
  # _agent-pr-body.yml); not gated on `changes` (no path filter applies).
  agent-pr-body:
    name: Agent PR Body
    if: ${{ inputs.agent_pr_body && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_agent-pr-body.yml
    with:
      block: ${{ inputs.agent_pr_body_block }}
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  # No caller currently sets `ansible_ci: true` here (ansible repos call
  # `_ansible-ci.yml` directly, with their own local molecule handling) -
  # this wiring is inert today, kept correct for whenever one does.
  ansible-ci:
    name: Ansible CI
    needs: [changes, scope]
    if: ${{ !cancelled() && (inputs.ansible_ci || inputs.profile == 'ansible') && needs.changes.outputs.ansible == 'true' && (needs.changes.outputs.profile-unmapped == 'true' || needs.scope.result != 'success' || needs.scope.outputs.ci != 'none') }}
    uses: ./.github/workflows/_ansible-ci.yml
    with:
      emit_gate: false
      lint_args: ${{ inputs.ansible_lint_args }}
      # scope's `molecule` output is a second layer on `_ansible-ci.yml`'s
      # own molecule toggle - only turns it off when scope definitively
      # said "none"; any other answer, or a scope failure, leaves it on.
      molecule: ${{ needs.scope.result != 'success' || needs.scope.outputs.molecule != 'none' }}
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  # NOT filter-gated (same convention as osv-scan/dependency-review below): a
  # caller's `filters` input may not define an `ansible:` key at all, in
  # which case `needs.changes.outputs.ansible` is an empty string forever —
  # neither 'true' nor 'false' — and gating this job on it would silently
  # SKIP a toggled-on check on every such caller, going green having never
  # run. A toggled-on job must never skip for that reason, so this runs
  # unconditionally once `inputs.renovate_annotations` is true.
  renovate-annotations:
    name: Renovate Annotations
    needs: changes
    if: ${{ inputs.renovate_annotations }}
    uses: ./.github/workflows/_renovate-annotations.yml
    with:
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  tofu-ci:
    name: OpenTofu CI
    needs: [changes, scope]
    if: ${{ !cancelled() && (inputs.tofu_ci || inputs.profile == 'tofu') && needs.changes.outputs.terraform == 'true' && (needs.changes.outputs.profile-unmapped == 'true' || needs.scope.result != 'success' || needs.scope.outputs.ci != 'none') }}
    uses: ./.github/workflows/_tofu-ci.yml
    with:
      working_directories: ${{ inputs.tofu_working_directories }}
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  # osv-scan is NOT filter-gated — a vulnerability scan must run on every
  # pull_request regardless of which paths a diff touches.
  osv-scan:
    name: OSV Scanner
    if: ${{ inputs.osv_scan && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_osv-scan.yml
    with:
      config_file: ${{ inputs.osv_config_file }}
      runner_label: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}

  # ============================================================================
  # WATCHDOG
  # Cancels the run if queued sibling jobs remain after queue_timeout_minutes.
  # This leaves the required gate non-green rather than accepting partial CI.
  # ============================================================================
  watchdog:
    name: Queue Watchdog
    needs: changes
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.orchestration_runner || 'ubuntu-24.04' }}
    permissions:
      actions: write   # required to cancel this run on a queue timeout
      contents: read   # required for actions/checkout sparse-checkout
    # Hardcoded ceiling — GHA expressions don't support arithmetic so this
    # can't be derived from `queue_timeout_minutes`. The watchdog lives as long
    # as the run and stops itself at WATCH_MAX_MINUTES (55), inside this ceiling.
    timeout-minutes: 60
    steps:
      - name: Sparse-checkout watchdog script from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-watchdog.sh
          sparse-checkout-cone-mode: false
      - name: Poll queue, then cancel the run if jobs remain queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_TIMEOUT_MINUTES: ${{ inputs.queue_timeout_minutes }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .gh-shared/scripts/ci-gate-watchdog.sh

  # Owned root flake inputs: on a pull request, no pinned revs and no move to a
  # rev that does not descend from the base lock's; on the default branch,
  # stale inputs dispatch the targeted relock. Passes when the repo has no flake.lock.
  flake-lock-fresh:
    name: Flake Lock Fresh
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) }}
    uses: ./.github/workflows/_flake-lock-fresh.yml
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  # Every reusable-workflow `uses:` in the caller must resolve: a missing local
  # file, or a dryvist ref absent at its ref, fails the gate. Not filter-gated
  # and never skipped, so a broken reference cannot merge green.
  uses-resolve:
    name: Uses Resolve
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.orchestration_runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sparse-checkout the uses checker from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-uses-resolve.sh
          sparse-checkout-cone-mode: false
      - name: Check every reusable workflow reference resolves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .gh-shared/scripts/ci-gate-uses-resolve.sh

  # The caller's own unit tests, run as one gate check so they can block a
  # merge. Set `test_command` to the exact command the repo runs locally. Not
  # filter-gated: when set, it runs on every event, like renovate-annotations.
  repo-tests:
    name: Repo Tests
    if: ${{ inputs.test_command != '' }}
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Set up bun
        if: ${{ hashFiles('bun.lock', 'bun.lockb') != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install bun dependencies
        if: ${{ hashFiles('bun.lock', 'bun.lockb') != '' }}
        run: bun install --frozen-lockfile
      - name: Run repo tests
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: bash -c "$TEST_COMMAND"

  # actionlint over the caller's workflows, so a broken reusable-workflow
  # contract fails here instead of making the run a missing check. Not
  # filter-gated. The binary is a pinned release, checksum-verified by the script.
  workflow-lint:
    name: Workflow Lint
    if: ${{ inputs.workflow_lint }}
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sparse-checkout the actionlint runner from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-workflow-lint.sh
          sparse-checkout-cone-mode: false
      - name: Lint caller workflows with the pinned actionlint
        run: bash .gh-shared/scripts/ci-gate-workflow-lint.sh

  # ============================================================================
  # MERGE GATE — the only check that branch protection requires.
  # `name:` MUST stay "Merge Gate" (matches existing required_status_checks).
  # ============================================================================
  gate:
    name: Merge Gate
    needs: [changes, scope, watchdog, nix-validate, nix-build, markdown-lint, file-size, token-limits, python-security, python-ci, ansible-ci, renovate-annotations, tofu-ci, osv-scan, dependency-review, zizmor, flake-lock-fresh, uses-resolve, repo-tests, workflow-lint]
    # Run after workflow cancellation too, so cancelled sibling checks aggregate
    # to a failing required status instead of a skipped (successful) job.
    if: ${{ always() }}
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && inputs.orchestration_runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      # `actions: read` lets the run-report step read this run's jobs (durations
      # + queue delays) via the Actions API; `contents: read` is for the sparse
      # checkout of the report script. Both stay within the STANDARD caller grant
      # (contents: read, pull-requests: read, actions: write), so this never
      # exceeds what the caller granted — see the PERMISSIONS INVARIANT header.
      actions: read
      contents: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      # The run report is non-blocking; the aggregator is required to produce
      # the Merge Gate result.
      - name: Sparse-checkout gate scripts from this repo
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: |
            scripts/ci-gate-aggregate.mts
            scripts/ci-gate-run-report.sh
          sparse-checkout-cone-mode: false
      - name: Aggregate results
        env:
          CI_GATE_JOBS: ${{ toJSON(needs) }}
          CI_GATE_ALLOWED_SKIPS: >-
            nix-validate, nix-build, markdown-lint, file-size, token-limits,
            python-security, python-ci, ansible-ci, renovate-annotations,
            tofu-ci, osv-scan, dependency-review, zizmor, watchdog,
            flake-lock-fresh, repo-tests, workflow-lint
          CI_GATE_ALLOWED_FAILURES: scope
        run: node .gh-shared/scripts/ci-gate-aggregate.mts
      # Run after every sibling is terminal, when timestamps are final.
      - name: Job durations + queue-delay summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .gh-shared/scripts/ci-gate-run-report.sh
