# Reusable: Release Freeze Status
#
# Publishes the release-freeze commit status to open PRs targeting develop.
# A promotion PR is an open PR with base main, head develop and label
# release:in-progress.
#
# Caller shape:
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]
#   permissions: {}
#   jobs:
#     release-freeze:
#       permissions:
#         contents: read
#         pull-requests: read
#         statuses: write
#       uses: dryvist/.github/.github/workflows/_release-freeze.yml@<40-hex commit SHA> # vX.Y.Z
name: _release-freeze

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to ubuntu-24.04. Pass a
          self-hosted runner label to opt the calling repo into it.
        type: string
        required: false
        default: ubuntu-24.04

permissions: {}

jobs:
  release-freeze:
    name: Release Freeze
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: read
      contents: read
    steps:
      - name: Set release-freeze commit status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_ACTION: ${{ github.event.action || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi

          set_status() {
            local sha=$1 state=$2 description=$3
            gh api "repos/$GH_REPO/statuses/$sha" \
              -f "state=$state" \
              -f context=release-freeze \
              -f "description=$description" >/dev/null
          }

          update_status() {
            local number=$1 sha=$2 head_ref=$3 state description
            case "$head_ref" in
              release-please--*|hotfix/*)
                state=success
                description=exempt
                ;;
              *)
                if [[ -n "$promotion_number" ]]; then
                  state=failure
                  description="release in progress: #$promotion_number"
                else
                  state=success
                  description="no release in progress"
                fi
                ;;
            esac
            set_status "$sha" "$state" "$description"
            printf 'PR #%s sha=%s state=%s description=%s\n' "$number" "$sha" "$state" "$description"
          }

          promotion_number=$(gh pr list --repo "$GH_REPO" --base main --head develop \
            --state open --limit 1000 --json number,labels \
            --jq '[.[] | select(any(.labels[]; .name == "release:in-progress")) | .number] | .[0] // empty')

          if [[ "$PR_BASE_REF" == "develop" ]]; then
            if [[ "$PR_ACTION" != "closed" ]]; then
              update_status "$PR_NUMBER" "$PR_HEAD_SHA" "$PR_HEAD_REF"
            fi
          elif [[ "$PR_BASE_REF" == "main" && "$PR_HEAD_REF" == "develop" ]]; then
            develop_prs=$(gh pr list --repo "$GH_REPO" --base develop --state open \
              --limit 1000 --json number,headRefOid,headRefName)
            rows=$(jq -r '.[] | [.number, .headRefOid, .headRefName] | @tsv' <<< "$develop_prs")
            while IFS=$'\t' read -r number sha head_ref; do
              [[ -n "$number" ]] || continue
              update_status "$number" "$sha" "$head_ref"
            done <<< "$rows"
          fi
