# Reusable: Nix Validate
# Runs `nix flake check` for the current system, optionally with --all-systems
# to catch packages broken on darwin from a linux runner before they merge.
name: _nix-validate

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label to run the validate job on. Defaults to
          ubuntu-24.04. Pass a RunsOn label (see runs-on.com job labels docs)
          to opt the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-24.04
      all_systems:
        description: >-
          Pass --all-systems to nix flake check to evaluate outputs for every
          declared system from the runner. Defaults true. Set false for repos
          whose check derivations are platform-specific (require darwin
          binaries to build), since `nix flake check --all-systems` attempts
          to build cross-platform checks and fails with "platform mismatch".
        type: boolean
        required: false
        default: true
      focused_checks:
        description: >-
          On non-main runs, evaluate flake outputs without building them and
          build only the current system's checks. Main runs keep the full
          `nix flake check` suite.
        type: boolean
        required: false
        default: false
      timeout_minutes:
        description: >-
          Opt-in job timeout for a caller whose cold `nix flake check` closure
          is known to exceed the org default. 0 (default) uses the org variable
          GH_ACTION_TIMEOUT_NIX, falling back to 15. Any value above 0 replaces
          it for this caller only. The cap still fails the required check when
          exceeded.
        type: number
        required: false
        default: 0

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.runner_label }}
    # Running-job cap: exceeding it signals a dependency, cache, or closure
    # regression and fails this required check. Queue-stuck handling lives in
    # the _ci-gate watchdog; this is running-job defense.
    #
    # The default comes from the org variable so it can change for every
    # consumer without editing this file or any calling repository. A caller
    # may raise it for its own run via `timeout_minutes`. `vars` is permitted
    # here — the context table allows github/needs/strategy/matrix/vars/inputs
    # for job-level timeout-minutes (not env, not secrets). In a reusable
    # workflow `vars` resolves from the CALLER's repository and organization.
    #
    # fromJSON is required, not decoration: every `vars.*` value is typed as a
    # STRING while timeout-minutes demands a number. Without it the workflow
    # fails graph validation and the job never starts — it surfaces as a failed
    # required check with no job and no logs.
    #
    # The `|| '15'` literal is likewise required: an unset variable interpolates
    # to an empty string, fromJSON('') errors, and fork PRs resolve org
    # variables empty.
    #
    # `inputs.timeout_minutes > 0` guards the numeric input: 0 is falsy in
    # expressions, so `cond && n || f` yields n only when the input is set and
    # otherwise falls through to the org-variable value.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || inputs.timeout_minutes > 0 && inputs.timeout_minutes || fromJSON(vars.GH_ACTION_TIMEOUT_NIX || '15') }} # pr-policy: timeout-exception a cold nix flake check takes 12-21 min on PRs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Free ~30GB on the ubuntu-24.04 runner so `nix flake check --all-systems`
      # has space to substitute darwin source paths (rustc-src, cctools,
      # apple-sdk, etc.) without hitting "No space left on device". Only needed
      # when all_systems is true; gated to ubuntu-* runners so self-hosted
      # runner long-lived state is never modified.
      - name: Free disk space
        if: inputs.all_systems && startsWith(inputs.runner_label, 'ubuntu-')
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          docker-images: true

      # determinate-nix-action@v3 is ONLY a Nix installer (replaced nix-installer-action@v21).
      # It does NOT include flake checking — that was a separate action (flake-checker-action).
      # Flake evaluation is handled by `nix flake check` below, not by the installer.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
            http-connections = 50
            connect-timeout = 5
            stalled-download-timeout = 10
            narinfo-cache-positive-ttl = 86400
            fallback = true
            log-lines = 1000

      # RunsOn's s3-cache extra persists nothing by itself; it only moves the
      # cache backend of a later cache step to S3, once runs-on/action has run.
      - name: Enable RunsOn cache backend
        if: startsWith(inputs.runner_label, 'runs-on=')
        uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0

      # Restore-only on PRs; saves on pushes to the default branch (branch-agnostic
      # so both trunk and git-flow callers save where their PRs can read).
      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          # Partial by design; a partial warm store still beats substituting the
          # whole flake-check closure. Kept under the 10G per-repo cache quota
          # shared with the macOS build cache.
          gc-max-store-size-linux: 6G
          save: ${{ github.event_name != 'pull_request' }}

      - name: Check flake
        if: ${{ !inputs.focused_checks }}
        # --all-systems evaluates outputs for every declared system to catch
        # darwin-only broken packages from the linux runner. Disabled by setting
        # `all_systems: false` for repos whose checks build platform-specific
        # derivations (require darwin binaries).
        env:
          ALL_SYSTEMS_FLAG: ${{ inputs.all_systems && '--all-systems' || '' }}
        run: |
          # shellcheck disable=SC2086 # Expands deliberately to zero or one flag.
          nix flake check $ALL_SYSTEMS_FLAG --print-build-logs --show-trace --keep-going

      - name: Check focused flake checks
        if: inputs.focused_checks
        env:
          ALL_SYSTEMS_FLAG: ${{ inputs.all_systems && '--all-systems' || '' }}
        run: |
          # Evaluate flake outputs but build only the current system's check derivations.
          # `checks` is an optional flake output; only a missing output or system
          # yields an empty list. Flake evaluation errors still fail this step.
          # shellcheck disable=SC2086 # Expands deliberately to zero or one flag.
          nix flake check --no-build $ALL_SYSTEMS_FLAG --print-build-logs --show-trace --keep-going
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          check_names="$(
            nix eval --raw --impure --expr '
              let
                flake = builtins.getFlake (toString ./.);
                checks = flake.checks or {};
                systemChecks =
                  if builtins.hasAttr builtins.currentSystem checks then
                    builtins.getAttr builtins.currentSystem checks
                  else
                    {};
              in
                builtins.concatStringsSep "\n" (
                  builtins.attrNames systemChecks
                )
            '
          )"
          if [ -n "$check_names" ]; then
            check_installables=()
            while IFS= read -r check; do
              check_installables+=(".#checks.${system}.${check}")
            done <<< "$check_names"
            nix build --no-link --print-build-logs --show-trace --keep-going \
              "${check_installables[@]}"
          fi
