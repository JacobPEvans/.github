name: PR Policy

on:
  pull_request:
  merge_group:

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  policy:
    name: Workflow Policy
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the PR head
        # On a merge queue entry there is no pull_request payload; github.sha
        # is the queue commit that carries the change.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The review gate reads the author's model family from this trailer.
      # Agent pull requests are those of the automation and sandbox Apps
      # (not an auto-revert) and those from agent/ or topic/ branches; the
      # bot lane (Renovate, the release App) is exempt. The legacy tier is
      # not checked.
      - name: Require an Assisted-by trailer on agent pull requests
        if: >-
          ${{ github.event_name == 'pull_request'
          && contains(fromJSON('["standard", "hot"]'), github.event.repository.custom_properties.merge_tier)
          && !contains(fromJSON('["renovate[bot]", "jacobpevans-release-please[bot]"]'), github.event.pull_request.user.login)
          && !(github.event.pull_request.user.login == 'jacobpevans-claude[bot]'
          && contains(github.event.pull_request.labels.*.name, 'auto-revert'))
          && (contains(fromJSON('["jacobpevans-claude[bot]", "jacobs-agent-smith[bot]"]'), github.event.pull_request.user.login)
          || startsWith(github.event.pull_request.head.ref, 'agent/')
          || startsWith(github.event.pull_request.head.ref, 'topic/')) }}
        run: |
          if [[ -z "$(git log -1 --format='%(trailers:key=Assisted-by,valueonly)')" ]]; then
            echo "::error::The head commit of an agent pull request needs an Assisted-by trailer, for example 'Assisted-by: Claude:<model id>'."
            exit 1
          fi
      # As a required workflow this runs in the consumer repo, which has no
      # copy of the checker; fetch it from this workflow's own commit.
      - name: Check out the checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .pr-policy
          persist-credentials: false
          sparse-checkout: |
            scripts/pr-policy.py
            scripts/pr-policy-diff.sh
          sparse-checkout-cone-mode: false
      - name: Install the YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-warn-script-location --target "$RUNNER_TEMP/pr-policy-deps" 'PyYAML>=6.0.2,<7'
      # Only lines the PR adds or changes are checked, so existing debt never blocks an unrelated PR.
      # A diff the API cannot return in full falls back to checking every file.
      - name: Fetch the PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # A merge queue entry has no pull_request payload; its head_ref names
          # the PR (refs/heads/gh-readonly-queue/<base>/pr-<number>-<commit>).
          if [[ -z "$PR" && "$MERGE_HEAD_REF" =~ pr-([0-9]+)-[0-9a-fA-F]+$ ]]; then
            PR="${BASH_REMATCH[1]}"
          fi
          if bash .pr-policy/scripts/pr-policy-diff.sh "$RUNNER_TEMP/pr.diff"; then
            echo "PR_POLICY_DIFF=$RUNNER_TEMP/pr.diff" >> "$GITHUB_ENV"
          else
            echo "::warning::PR diff unavailable; checking every workflow file."
          fi
      - name: Check workflow policy
        env:
          PYTHONPATH: ${{ runner.temp }}/pr-policy-deps
        run: python3 .pr-policy/scripts/pr-policy.py "$GITHUB_WORKSPACE" ${PR_POLICY_DIFF:+--diff "$PR_POLICY_DIFF"}

  pr-title:
    name: PR Title
    # A merge queue entry has no pull_request payload, so there is no title to
    # check here; the job still runs (a required context must never skip) and
    # its first step exits 0 below.
    if: ${{ github.event_name == 'merge_group' || contains(fromJSON('["opened", "edited", "synchronize", "reopened"]'), github.event.action) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the live commit message rule
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            exit 0
          fi
          if [[ "$BASE" == "$DEFAULT_BRANCH" && "$HEAD" == "develop" ]]; then
            exit 0
          fi
          if [[ "$TITLE" == "Merge "* ]]; then
            exit 0
          fi

          encoded_base=$(jq -rn --arg base "$BASE" '$base | @uri')
          rules=$(gh api "repos/$REPO/rules/branches/$encoded_base")
          pattern=$(jq -r '[.[] | select(.type == "commit_message_pattern" and .parameters.operator == "regex") | .parameters.pattern] | first // empty' <<< "$rules")
          if [[ -z "$pattern" ]]; then
            exit 0
          fi

          if [[ "$TITLE" =~ $pattern ]]; then
            exit 0
          fi
          printf 'PR title does not match commit_message_pattern: %s\nExample: feat(scope): add the thing\n' "$pattern" >&2
          exit 1
