name: PR Policy

on:
  pull_request:

permissions: {}

jobs:
  policy:
    name: Workflow Policy
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # As a required workflow this runs in the consumer repo, which has no
      # copy of the checker; fetch it from this workflow's own commit.
      - name: Check out the checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .pr-policy
          persist-credentials: false
          sparse-checkout: |
            scripts/pr-policy.py
            scripts/pr-policy-diff.sh
          sparse-checkout-cone-mode: false
      - name: Install the YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-warn-script-location --target "$RUNNER_TEMP/pr-policy-deps" 'PyYAML>=6.0.2,<7'
      # Only lines the PR adds or changes are checked, so existing debt never blocks an unrelated PR.
      # A diff the API cannot return in full falls back to checking every file.
      - name: Fetch the PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if bash .pr-policy/scripts/pr-policy-diff.sh "$RUNNER_TEMP/pr.diff"; then
            echo "PR_POLICY_DIFF=$RUNNER_TEMP/pr.diff" >> "$GITHUB_ENV"
          else
            echo "::warning::PR diff unavailable; checking every workflow file."
          fi
      - name: Check workflow policy
        env:
          PYTHONPATH: ${{ runner.temp }}/pr-policy-deps
        run: python3 .pr-policy/scripts/pr-policy.py "$GITHUB_WORKSPACE" ${PR_POLICY_DIFF:+--diff "$PR_POLICY_DIFF"}

  pr-title:
    name: PR Title
    if: ${{ contains(fromJSON('["opened", "edited", "synchronize", "reopened"]'), github.event.action) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the live commit message rule
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ "$BASE" == "$DEFAULT_BRANCH" && "$HEAD" == "develop" ]]; then
            exit 0
          fi
          if [[ "$TITLE" == "Merge "* ]]; then
            exit 0
          fi

          encoded_base=$(jq -rn --arg base "$BASE" '$base | @uri')
          rules=$(gh api "repos/$REPO/rules/branches/$encoded_base")
          pattern=$(jq -r '[.[] | select(.type == "commit_message_pattern" and .parameters.operator == "regex") | .parameters.pattern] | first // empty' <<< "$rules")
          if [[ -z "$pattern" ]]; then
            exit 0
          fi

          if [[ ! "$TITLE" =~ $pattern ]]; then
            printf 'PR title does not match commit_message_pattern: %s\nExample: feat(scope): add the thing\n' "$pattern" >&2
            exit 1
          fi

          # GitHub applies every commit message rule to each commit in the branch, so one bad
          # subject leaves the pull request blocked with all checks green. Name it here.
          patterns=$(jq -r '.[] | select(.type == "commit_message_pattern" and .parameters.operator == "regex"
            and (.parameters.negate | not)) | .parameters.pattern' <<< "$rules")
          if ! subjects=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            | jq -r '.[] | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"'); then
            echo "::warning::Could not list the pull request commits; only the title was checked."
            exit 0
          fi
          failed=0
          while IFS= read -r pattern; do
            while read -r sha subject; do
              if [[ -n "$sha" && ! "$subject" =~ $pattern ]]; then
                printf '%s "%s" does not match commit_message_pattern: %s\n' "$sha" "$subject" "$pattern" >&2
                failed=1
              fi
            done <<< "$subjects"
          done <<< "$patterns"
          if (( failed )); then
            echo 'This pull request cannot merge while such a commit is in the branch.' >&2
            echo 'Re-create the branch from the base and cherry-pick the changes; do not merge the base into it.' >&2
          fi
          exit "$failed"
