# Reusable release entry point: release-please, major-tag promotion and the
# release-freeze status share one caller workflow.
name: _release

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to the GitHub-hosted ubuntu-24.04
          image. Pass a self-hosted label to opt the calling repo into on-prem runners.
        type: string
        required: false
        default: ubuntu-24.04
      auto-merge:
        description: >-
          Deprecated and ignored. Every release PR is set to auto-merge. The input
          stays declared so callers that still pass it keep running.
        type: boolean
        default: false
      release-type:
        description: >-
          release-please release type (e.g. simple). Set this AND blank out
          config-file/manifest-file to run config-free (non-manifest) mode.
        type: string
        default: ''
      config-file:
        description: >-
          Path to release-please-config.json. Blank ('') to run non-manifest mode.
        type: string
        default: release-please-config.json
      manifest-file:
        description: >-
          Path to .release-please-manifest.json. Blank ('') to run non-manifest mode.
        type: string
        default: .release-please-manifest.json
      include-component-in-tag:
        description: Whether to prefix tags/branches with the component name.
        type: boolean
        default: false
      tag:
        description: >-
          Release tag to promote, for example v1.8.5. Empty falls back to the
          release-please output.
        required: false
        type: string
        default: ''
    secrets:
      # Optional here so the pull request freeze job runs without it; release-please still requires it.
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY:
        required: false
    outputs:
      release_created:
        description: true when release-please created a release
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag created by release-please
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    uses: JacobPEvans/.github/.github/workflows/_release-please.yml@v1
    with:
      runner_label: ${{ inputs.runner_label }}
      auto-merge: ${{ inputs.auto-merge }}
      release-type: ${{ inputs.release-type }}
      config-file: ${{ inputs.config-file }}
      manifest-file: ${{ inputs.manifest-file }}
      include-component-in-tag: ${{ inputs.include-component-in-tag }}
    permissions:
      contents: write
      pull-requests: write
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}

  promote-major-tag:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: JacobPEvans/.github/.github/workflows/promote-major-tag.yml@v1
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      checks: read

  release-freeze:
    if: ${{ github.event_name == 'pull_request' }}
    uses: JacobPEvans/.github/.github/workflows/_release-freeze.yml@v1
    with:
      runner_label: ${{ inputs.runner_label }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
