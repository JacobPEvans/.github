# Reusable: Policy Gate wrapper
#
# Thin pass-through to dryvist/ai-workflows/.github/workflows/policy-gate.yml,
# so a dryvist/.github consumer opts in via one _ci-gate.yml input
# instead of wiring the external reusable directly. Advisory by default
# (policy_gate_block false); wired into _ci-gate.yml needs-free (never in
# gate.needs), same shape as _agent-pr-body.yml.
#
# The sticky comment step requires pull-requests: write on the calling
# workflow; without it the job reports failure and posts nothing.
name: _policy-gate

on:
  workflow_call:
    inputs:
      policy_gate_block:
        description: Fail Policy Gate instead of only warning. Keep false during rollout.
        type: boolean
        default: false
      runner_label:
        description: Runner label. Must be a runner that can reach the model router.
        type: string
        default: self-hosted
      model:
        description: Router role alias to call.
        type: string
        default: review-local
      max_diff_kb:
        description: Truncate the pull request diff at this many KiB.
        type: number
        default: 150
      max_tokens:
        description: Completion token ceiling for the rubric call.
        type: number
        default: 1500
    secrets:
      LLM_ROUTER_BASE_URL:
        description: The router's OpenAI-compatible base URL, ending in /v1.
        required: false
      LLM_ROUTER_API_KEY:
        description: Scoped router virtual key (never the router master key).
        required: false
      NTFY_BASE_URL:
        description: Base URL of the ntfy hub for the override audit line. Optional.
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: Policy Gate
    uses: dryvist/ai-workflows/.github/workflows/policy-gate.yml@e77c7f08b2f33f5dd3e1dff25c65056892ece445 # v0.48.2
    with:
      runner_label: ${{ inputs.runner_label }}
      model: ${{ inputs.model }}
      max_diff_kb: ${{ inputs.max_diff_kb }}
      max_tokens: ${{ inputs.max_tokens }}
      blocking: ${{ inputs.policy_gate_block }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
