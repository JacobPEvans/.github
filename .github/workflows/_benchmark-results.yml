name: _benchmark-results

on:
  workflow_call:
    inputs:
      result_paths:
        description: >-
          Newline-separated files or directories, relative to the calling
          repository. Directories are searched for JSON, JSONL, and Parquet rows.
        type: string
        required: true
      validator_ref:
        description: mlx-benchmarks ref containing the published-result schema and validator.
        type: string
        required: false
        # renovate: datasource=github-tags depName=dryvist/mlx-benchmarks
        default: 79449bb254960f9ca71789980e04bbc437534509  # v0.34.0

permissions:
  contents: read

jobs:
  validate-results:
    name: Validate benchmark results
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: consumer
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout canonical schema and validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/mlx-benchmarks
          ref: ${{ inputs.validator_ref }}
          path: validator
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.26.0" "pyarrow>=25.0.1"

      - name: Validate declared result paths
        shell: bash
        env:
          RESULT_PATHS: ${{ inputs.result_paths }}
        run: |
          set -euo pipefail
          consumer="$GITHUB_WORKSPACE/consumer"
          file_list="$RUNNER_TEMP/benchmark-result-files"
          : > "$file_list"

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "/$path/" in
              /*/../*) echo "result paths must stay inside the repository" >&2; exit 2 ;;
            esac
            target="$consumer/${path#./}"
            if [[ ! -e "$target" ]]; then
              echo "declared result path does not exist" >&2
              exit 2
            fi
            resolved="$(realpath -e -- "$target")"
            case "$resolved/" in
              "$consumer/"*) ;;
              *) echo "declared result path resolves outside the repository" >&2; exit 2 ;;
            esac
            if [[ -f "$resolved" ]]; then
              printf '%s\0' "$resolved" >> "$file_list"
            else
              find "$resolved" -type f \
                \( -name '*.json' -o -name '*.jsonl' -o -name '*.parquet' \) \
                -print0 >> "$file_list"
            fi
          done <<< "$RESULT_PATHS"

          if [[ ! -s "$file_list" ]]; then
            echo "declared result paths contain no JSON, JSONL, or Parquet files" >&2
            exit 2
          fi

          cd "$GITHUB_WORKSPACE/validator"
          xargs -0 env PYTHONPATH="$GITHUB_WORKSPACE/validator/src" \
            python -m mlx_benchmarks.result_contract < "$file_list"
