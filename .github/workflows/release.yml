name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

permissions: {}

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      # The existing major-tag reusable checks the hub's Canary run.
      checks: read
    secrets: inherit
