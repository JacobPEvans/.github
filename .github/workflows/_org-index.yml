# Reusable: regenerate an organization's repository index and llms.txt.
name: _org-index

on:
  workflow_call:
    inputs:
      visibility_scope:
        description: Include public repositories only, or all repositories visible to the App.
        type: string
        required: false
        default: public
      output_path:
        description: Markdown file that receives the generated index between markers.
        type: string
        required: false
        default: profile/README.md
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  regenerate:
    name: Regenerate repository index
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 15 }}
    concurrency:
      group: org-index-${{ github.repository }}
      cancel-in-progress: false
    permissions: {}
    steps:
      # Public scope reads with github.token; only the members index needs to list private repositories.
      - name: Mint organization read token
        id: org-read-token
        if: inputs.visibility_scope == 'all'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] read-only metadata across the org is the members index's input
          permission-metadata: read

      - name: Mint caller repository write token
        id: write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.write-token.outputs.token }}
          fetch-depth: 0

      - name: Read repository metadata and render indexes
        env:
          GH_TOKEN: ${{ steps.org-read-token.outputs.token || github.token }}
          ORG: ${{ github.repository_owner }}
          SCOPE: ${{ inputs.visibility_scope }}
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          set -euo pipefail
          case "$SCOPE" in
            public|all) ;;
            *) echo "visibility_scope must be public or all" >&2; exit 1 ;;
          esac
          case "$OUTPUT_PATH" in
            ""|/*|..|../*|*/../*|*/..|llms.txt|.git|.git/*|-*|*/)
              echo "output_path must be a repository-relative path other than llms.txt" >&2
              exit 1
              ;;
          esac

          gh api --paginate "orgs/$ORG/repos?type=$SCOPE&per_page=100" --jq '.[] | {
              name, description, url: .html_url, isArchived: .archived,
              repositoryTopics: [.topics[]? | {name: .}],
              family: (.custom_properties.family // "")
            }' | jq -s '.' > "$RUNNER_TEMP/repos.json"
          jq '[.[] | {name, family}]' "$RUNNER_TEMP/repos.json" > "$RUNNER_TEMP/families.json"

          jq -n --arg org "$ORG" \
            --slurpfile repos "$RUNNER_TEMP/repos.json" \
            --slurpfile families "$RUNNER_TEMP/families.json" '
            def cell:
              tostring | gsub("[\\r\\n|]"; " ")
              | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def wrap($width):
              split(" ") | map(select(length > 0))
              | reduce .[] as $word ([];
                  if length > 0 and (.[-1] | length) + ($word | length) + 1 <= $width
                  then .[-1] += " " + $word
                  else . + [$word] end)
              | join("\n  ");
            def item:
              "- " + (
                "[\(.name)](\(.url)): \((.description // "—") | cell)" +
                ((.repositoryTopics // []) | map(.name) | if length > 0 then " (topics: \(join(", ") | cell))" else "" end)
                | wrap(156)
              );
            def table($items): $items | map(item) | join("\n");
            def groups($items; $suffix):
              $items | group_by(.family) | map(
                "### \(.[0].family | cell)\($suffix)\n\n" + table(.)
              ) | join("\n\n");
            ($families[0] | map({key: .name, value: .family}) | from_entries) as $family_by_repo |
            ($repos[0]
              | map(. + {
                  family: (if ($family_by_repo[.name] // "") == ""
                    then "Other" else $family_by_repo[.name] end)
                })
              | sort_by((.family | ascii_downcase), (.name | ascii_downcase))) as $all |
            ($all | map(select(.isArchived | not))) as $active |
            ($all | map(select(.isArchived))) as $archived |
            {
              markdown: (
                "## Repositories\n\n" +
                (if ($active | length) > 0 then groups($active; "") else "_No repositories._" end) +
                "\n\n## Archived repositories (\($archived | length))\n\n" +
                (if ($archived | length) > 0 then groups($archived; " (archived)") else "_No archived repositories._" end)
              ),
              llms: (
                "# \($org)\n\nRepository index for the \($org) GitHub organization.\n\n## Repositories\n\n" +
                ($all | map("- [\(.name)](\(.url)): \(((.description // "") | cell))") | join("\n"))
              )
            }
          ' > "$RUNNER_TEMP/rendered.json"
          jq -r '.markdown' "$RUNNER_TEMP/rendered.json" > "$RUNNER_TEMP/org-index.md"
          jq -r '.llms' "$RUNNER_TEMP/rendered.json" > llms.txt

          mkdir -p -- "$(dirname -- "$OUTPUT_PATH")"
          if [[ ! -f "$OUTPUT_PATH" ]]; then
            printf '# %s\n\n<!-- org-index:start -->\n<!-- org-index:end -->\n' "$ORG" > "$OUTPUT_PATH"
          fi
          start='<!-- org-index:start -->'
          end='<!-- org-index:end -->'
          starts=$(grep -Fxc -- "$start" "$OUTPUT_PATH" || true)
          ends=$(grep -Fxc -- "$end" "$OUTPUT_PATH" || true)
          if [[ "$starts" == 0 && "$ends" == 0 ]]; then
            [[ ! -s "$OUTPUT_PATH" ]] || printf '\n' >> "$OUTPUT_PATH"
            printf '%s\n%s\n' "$start" "$end" >> "$OUTPUT_PATH"
          elif [[ "$starts" != 1 || "$ends" != 1 ]]; then
            echo "output_path must contain exactly one pair of org-index markers" >&2
            exit 1
          fi
          start_line=$(grep -Fn -- "$start" "$OUTPUT_PATH" | cut -d: -f1)
          end_line=$(grep -Fn -- "$end" "$OUTPUT_PATH" | cut -d: -f1)
          if (( start_line >= end_line )); then
            echo "org-index markers are out of order" >&2
            exit 1
          fi
          awk -v replacement="$RUNNER_TEMP/org-index.md" '
            BEGIN {
              while ((getline line < replacement) > 0) body = body line "\n"
              close(replacement)
            }
            $0 == "<!-- org-index:start -->" { print; printf "%s", body; inside = 1; next }
            $0 == "<!-- org-index:end -->" { inside = 0; print; next }
            !inside { print }
          ' "$OUTPUT_PATH" > "$RUNNER_TEMP/profile.md"
          mv "$RUNNER_TEMP/profile.md" "$OUTPUT_PATH"

      # The caller repo may have no markdownlint config, so lint with the shared limits here.
      # Only the generated block is linted; the caller owns the rest of the file. The block sits
      # under the caller's own heading, so the first-line heading rule does not apply to it.
      - name: Write the repository index lint config
        run: |
          cat > "$RUNNER_TEMP/org-index.markdownlint-cli2.yaml" <<'EOF'
          config:
            MD013:
              line_length: 160
              tables: true
              strict: true
            MD041: false
          EOF
          cp "$RUNNER_TEMP/org-index.md" org-index.lint.md

      - name: Lint the generated repository index
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          config: ${{ runner.temp }}/org-index.markdownlint-cli2.yaml
          globs: org-index.lint.md

      - name: Open or update the index pull request
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          set -euo pipefail
          branch=automation/org-index
          git add -- "$OUTPUT_PATH" llms.txt
          if git diff --cached --quiet; then
            echo "::notice::Repository index content is unchanged."
            exit 0
          fi
          head_oid=$(git rev-parse "$DEFAULT_BRANCH")
          branch_ref="heads/$branch"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$branch_ref" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/$branch_ref" \
              -f sha="$head_oid" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/heads/$branch" -f "sha=$head_oid" >/dev/null
          fi

          base64 -w0 < "$OUTPUT_PATH" > "$RUNNER_TEMP/org-index.md.base64"
          base64 -w0 < llms.txt > "$RUNNER_TEMP/llms.txt.base64"
          commit_oid=$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg head_oid "$head_oid" \
            --arg output_path "$OUTPUT_PATH" \
            --rawfile output_contents "$RUNNER_TEMP/org-index.md.base64" \
            --rawfile llms_contents "$RUNNER_TEMP/llms.txt.base64" '
            {
              query: ("mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid " +
                "signature { isValid wasSignedByGitHub } } } }"),
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repository, branchName: $branch },
                  expectedHeadOid: $head_oid,
                  message: { headline: "chore(index): regenerate org index" },
                  fileChanges: {
                    additions: [
                      { path: $output_path, contents: $output_contents },
                      { path: "llms.txt", contents: $llms_contents }
                    ]
                  }
                }
              }
            }
          ' | gh api graphql --method POST --input - \
            --jq '
              if (.data.createCommitOnBranch.commit.signature.isValid == true
                and .data.createCommitOnBranch.commit.signature.wasSignedByGitHub == true)
              then .data.createCommitOnBranch.commit.oid
              else error("GraphQL commit was not verified as GitHub-signed") end
            ')
          echo "::notice::Created GitHub-signed index commit $commit_oid on $branch."

          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --base "$DEFAULT_BRANCH" \
              --title 'chore(index): regenerate org index' \
              --body 'Regenerate the organization repository index and llms.txt.'
          else
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
              --title 'chore(index): regenerate org index' \
              --body 'Regenerate the organization repository index and llms.txt.'
          fi
