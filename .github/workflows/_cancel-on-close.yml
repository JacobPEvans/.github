# Reusable: Cancel On Close
#
# Problem: a workflow run still QUEUED (waiting for a self-hosted runner) when
# its PR is merged or closed keeps occupying the runner queue indefinitely.
# The existing `concurrency: cancel-in-progress: true` pattern every workflow
# already carries does NOT cover this — it only cancels a group's prior run
# when a NEW run starts in that group (e.g. a push), and closing a PR starts
# no new run. GitHub Actions has no native setting that cancels queued runs on
# PR close (confirmed against the concurrency docs: cancel-in-progress affects
# only the currently-executing run in the same group, not queued runs, and
# there is no closed-PR-triggered cancellation feature).
#
# This reusable is the caller-side fix: run it from `pull_request: types:
# [closed]` to sweep every workflow run on that PR's head branch, queued or
# in-progress, via `gh run cancel` (scripts/cancel-on-close.sh). Runs match by
# branch name, not SHA, because a `closed` event carries the same head SHA as
# the run(s) it needs to cancel. The current run is never cancelled. A run that
# is already gone (HTTP 404) or completed counts as cancelled; any other error
# fails the job.
name: _cancel-on-close

on:
  workflow_call: {}

permissions: {}

jobs:
  cancel:
    name: Cancel queued/in-progress runs
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      actions: write
    steps:
      # The script is read from this repo at the same ref as this workflow, as the
      # other reusables do, so callers never run a copy that drifts from it.
      - name: Checkout the cancel script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          persist-credentials: false
          sparse-checkout: scripts/cancel-on-close.sh
          sparse-checkout-cone-mode: false

      - name: Cancel runs on this PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .gh-shared/scripts/cancel-on-close.sh "$BRANCH"
