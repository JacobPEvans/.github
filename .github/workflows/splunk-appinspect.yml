name: Splunk AppInspect

on:
  pull_request:
  workflow_call:
    outputs:
      is_app:
        description: Whether the repository contains a supported Splunk app layout
        value: ${{ jobs.appinspect.outputs.is_app }}

permissions:
  contents: read

jobs:
  appinspect:
    name: AppInspect
    runs-on: ubuntu-26.04
    timeout-minutes: 25 # pr-policy: timeout-exception AppInspect includes dependency installation and static checks
    outputs:
      is_app: ${{ steps.app.outputs.is_app }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Detect Splunk app
        id: app
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [[ -f package/default/app.conf ]]; then
            layout=package
            app_conf=package/default/app.conf
          elif [[ -f app.manifest || -f default/app.conf ]]; then
            layout=root
            app_conf=default/app.conf
          else
            echo "::notice::No Splunk app manifest found; AppInspect is not applicable."
            echo "is_app=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          APP_LAYOUT="$layout" APP_CONF="$app_conf" python3 - <<'PY'
          import configparser
          import json
          import os
          import re
          from pathlib import Path

          app_name = ""
          app_layout = os.environ["APP_LAYOUT"]
          app_conf = Path(os.environ["APP_CONF"])
          app_version = ""
          if app_layout == "package":
              config = configparser.ConfigParser(interpolation=None)
              config.read(app_conf)
              app_name = config.get("package", "id", fallback="")
              app_version = config.get(
                  "launcher", "version", fallback=config.get("id", "version", fallback="")
              )
              if not app_name or not app_version:
                  raise SystemExit("package/default/app.conf must define [package] id and an app version")
              if not re.fullmatch(r"[A-Za-z0-9._+-]+", app_version):
                  raise SystemExit(f"Invalid Splunk app version: {app_version!r}")
          else:
              manifest = Path("app.manifest")
              if manifest.is_file():
                  try:
                      app_name = json.loads(manifest.read_text()).get("info", {}).get("id", {}).get("name", "")
                  except json.JSONDecodeError:
                      pass
              if not app_name and app_conf.is_file():
                  config = configparser.ConfigParser(interpolation=None)
                  config.read(app_conf)
                  app_name = config.get("package", "id", fallback="")
              if not app_name:
                  app_name = os.environ["REPOSITORY_NAME"]
          if app_name in {".", ".."} or not re.fullmatch(r"[A-Za-z0-9_.-]+", app_name):
              raise SystemExit(f"Invalid Splunk app id: {app_name!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("is_app=true\n")
              output.write(f"name={app_name}\n")
              output.write(f"layout={app_layout}\n")
              output.write(f"version={app_version}\n")
          PY

      - name: Package app
        id: package
        if: steps.app.outputs.is_app == 'true'
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
          APP_LAYOUT: ${{ steps.app.outputs.layout }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$APP_LAYOUT" == root && -f scripts/package.sh ]]; then
            bash scripts/package.sh
          else
            python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          app_name = os.environ["APP_NAME"]
          app_layout = os.environ["APP_LAYOUT"]
          source = Path("package") if app_layout == "package" else Path(".")
          archive_name = (
              f"{app_name}-{os.environ['APP_VERSION']}.tar.gz"
              if app_layout == "package"
              else f"{app_name}-org-required.tar.gz"
          )
          output_path = Path("build") / archive_name
          output_path.parent.mkdir(parents=True, exist_ok=True)

          excluded_parts = {".git", ".github", "build", "tests"}
          if app_layout == "package":
              excluded_parts.add(".direnv")

          def is_local_file(path: Path) -> bool:
              name = path.name
              return (
                  name in {".DS_Store", ".env", ".envrc"}
                  or name.startswith(".env.")
                  or name.endswith((".local", ".swp", "~"))
              )

          with tarfile.open(output_path, "w:gz") as archive:
              archive.add(source, arcname=app_name, recursive=False)
              for path in sorted(source.rglob("*")):
                  relative = path.relative_to(source)
                  if any(part in excluded_parts for part in relative.parts):
                      continue
                  if app_layout == "package" and is_local_file(path):
                      continue
                  archive.add(path, arcname=f"{app_name}/{relative.as_posix()}", recursive=False)
          PY
          fi
          shopt -s nullglob
          if [[ "$APP_LAYOUT" == package ]]; then
            packages=("build/${APP_NAME}-${APP_VERSION}.tar.gz")
          else
            packages=(build/"${APP_NAME}"-*.tar.gz)
          fi
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected one build/${APP_NAME}-*.tar.gz archive, found ${#packages[@]}."
            exit 1
          fi
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Splunk package
        if: steps.app.outputs.is_app == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splunk-package
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Install Splunk AppInspect
        if: steps.app.outputs.is_app == 'true'
        run: python -m pip install --disable-pip-version-check --no-warn-script-location 'splunk-appinspect==4.4.0'

      - name: Run AppInspect (gate on failure and error)
        if: steps.app.outputs.is_app == 'true'
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          splunk-appinspect inspect "$PACKAGE_PATH" --data-format json --output-file appinspect.json || true
          python - <<'PY'
          import json
          import sys

          with open("appinspect.json") as report:
              summary = json.load(report)["summary"]
          print(json.dumps(summary, indent=2))
          sys.exit(1 if summary.get("failure", 0) + summary.get("error", 0) else 0)
          PY

      - name: Validate Dashboard Studio definitions
        if: steps.app.outputs.is_app == 'true' && steps.app.outputs.layout == 'root' && hashFiles('scripts/validate_dashboards.py') != ''
        run: python scripts/validate_dashboards.py default/data/ui/views/*.xml

      - name: Upload AppInspect report
        if: always() && steps.app.outputs.is_app == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appinspect-report
          path: appinspect.json
          if-no-files-found: ignore
