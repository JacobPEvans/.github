# Standalone repo-conventions presence check for org-wide enforcement via
# Required Workflows.
#
# Referenced by dryvist/tofu-github's github_organization_ruleset, which injects
# this workflow into the default-branch PRs of EVERY repo in the org. It mirrors
# markdownlint.yml (the proven required-workflow pattern) but checks PRESENCE,
# not content, of the repo conventions below.
#
# Repos with no PR traffic are never evaluated here; that blind spot is
# covered by repo-conventions-sweep.yml in this repo.
#
# SOFT ROLLOUT: this defaults to WARN mode (annotate + exit 0) so it NEVER
# breaks a PR, even on the ~22 repos currently missing AGENTS.md. A repo opts in
# to hard enforcement by setting the repository variable CONVENTIONS_STRICT=true
# (Settings > Secrets and variables > Actions > Variables). Escalation path:
# warn org-wide -> per-repo strict opt-in as each repo becomes compliant ->
# flip the default once the fleet is green.
name: Conventions Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: org-conventions-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Presence
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    env:
      # Repo opt-in to hard enforcement; unset repos stay in WARN mode.
      CONVENTIONS_STRICT: ${{ vars.CONVENTIONS_STRICT || 'false' }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The master preset owns every Renovate schedule; a consumer config sets none.
      - name: Reject Renovate schedule overrides
        run: |
          ! git grep -nE '"?(schedule|timezone|automergeSchedule)"?[[:space:]]*:|at any time' -- renovate.json renovate.json5 '.renovaterc*' .github/renovate.json .github/renovate.json5

      - name: Check presence of required repo conventions
        shell: sh
        run: |
          miss=0
          warn() {
            printf '::warning title=Missing convention::%s\n' "$1"
            miss=1
          }

          # LICENSE (accept the GitHub-recognized filename variants).
          [ -f LICENSE ] || [ -f LICENSE.md ] || [ -f LICENSE.txt ] \
            || warn "LICENSE file is missing"

          # AGENTS.md — canonical AI-assistant policy; sharpest drift axis.
          [ -f AGENTS.md ] || warn "AGENTS.md is missing"

          # Nix dev-shell entry: a local flake.nix OR a committed .envrc (many
          # repos legitimately use a shared remote devShell via .envrc alone).
          [ -f flake.nix ] || [ -f .envrc ] \
            || warn "Nix dev-shell entry (flake.nix or .envrc) is missing"

          # Release automation. The property that actually makes a repo
          # release is the CALLER workflow — a repo can hold a pristine
          # release-please-config.json and still never cut a release. Assert
          # the caller first.
          #
          # The reusable supports two modes. Manifest mode (the org default)
          # reads release-please-config.json + .release-please-manifest.json
          # from the repo. Config-free mode passes `release-type:` and blank
          # config/manifest inputs, and is CORRECT with no config files at
          # all — so the config files are only required when the caller does
          # not select a release-type. Checking the config unconditionally
          # flags config-free repos that release perfectly well.
          caller=.github/workflows/release-please.yml
          if [ ! -f "$caller" ]; then
            warn "release-please caller workflow ($caller) is missing"
          elif ! grep -Eq '^[[:space:]]*release-type:[[:space:]]*[^[:space:]'"'"'"]' "$caller"; then
            [ -f release-please-config.json ] \
              || warn "release-please-config.json is missing (caller runs manifest mode)"
            [ -f .release-please-manifest.json ] \
              || warn ".release-please-manifest.json is missing (caller runs manifest mode)"
          fi

          if [ "$miss" -eq 0 ]; then
            echo "All repo conventions present."
            exit 0
          fi

          if [ "$CONVENTIONS_STRICT" = "true" ]; then
            echo "STRICT mode (CONVENTIONS_STRICT=true): conventions missing, failing."
            exit 1
          fi

          echo "WARN mode: conventions missing (see annotations). Not failing."
          echo "Set repository variable CONVENTIONS_STRICT=true to enforce."
          exit 0
