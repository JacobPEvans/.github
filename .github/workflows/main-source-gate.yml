name: Main Source Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions: {}

concurrency:
  group: enterprise-main-source-gate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main-source-gate:
    name: Main Source Gate
    # The host repo is trunk and is not a target of the ruleset.
    if: github.repository != 'JacobPEvans/.github'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Enforce main pull request source
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" == main &&
            "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" &&
            ("$HEAD_REF" == develop || "$HEAD_REF" =~ ^hotfix/[A-Za-z0-9._-]+$) ]]; then
            printf 'Main Source Gate passed.\n'
            exit 0
          fi

          printf 'Main Source Gate requires pull requests targeting main to come from the same repository and use exactly develop or hotfix/<name> (letters, numbers, dots, underscores, and hyphens only). Head ref: %s\n' "$HEAD_REF" >&2
          exit 1
