name: Main Source Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: enterprise-main-source-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  main-source-gate:
    name: Main Source Gate
    # Organization .github repositories are trunk and are not ruleset targets.
    if: github.event.repository.name != '.github'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Enforce main pull request source
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" == main && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]; then
            if [[ "$HEAD_REF" == develop || "$HEAD_REF" =~ ^hotfix/[A-Za-z0-9._-]+$ ]]; then
              printf 'Main Source Gate passed.\n'
              exit 0
            fi

            if [[ "$HEAD_REF" =~ ^promote/ ]]; then
              if [[ ! "$HEAD_REF" =~ ^promote/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                printf '::error::Main Source Gate requires promote heads to be named promote/YYYY-MM-DD. Head ref: %s\n' "$HEAD_REF"
                exit 1
              fi

              status=$(gh api "repos/$BASE_REPOSITORY/compare/develop...$HEAD_SHA" --jq '.status')
              case "$status" in
                behind|identical)
                  printf 'Main Source Gate passed.\n'
                  exit 0
                  ;;
                *)
                  printf '::error::Main Source Gate requires the promote head sha to be contained in develop (compare status behind or identical); compare status: %s. Head ref: %s\n' "$status" "$HEAD_REF"
                  exit 1
                  ;;
              esac
            fi
          fi

          printf 'Main Source Gate requires pull requests targeting main to come from the same repository and use exactly develop or hotfix/<name> (letters, numbers, dots, underscores, and hyphens only), or promote/<yyyy-mm-dd> whose head sha is contained in develop. Head ref: %s\n' "$HEAD_REF" >&2
          exit 1
