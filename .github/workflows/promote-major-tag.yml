---
# Moves the floating major tag (v1 for v1.x.y) to a release commit. The decision
# and the move are in scripts/promote-major-tag.sh. A calling repo runs the same
# script from a checkout of this repo at the called workflow's commit.
#
# In this repo (release published and workflow_dispatch), the Canary check on the
# commit gates the move. The canary is not re-run here. If that check is still
# running or not yet visible, this run exits with a notice, and the `promote` job
# in canary.yml promotes when the Canary run on main finishes. Whichever arrives
# second promotes. Nothing polls. A Canary failure fails this run and leaves the
# floating tag where it was.
#
# As a reusable workflow (workflow_call), a dryvist repo calls this after its own
# release is published. Those repos have no Canary check, so the move needs only
# the release tag, and the script runs with --no-canary.
#
# Caller shape. The called job requests `checks: read`, so the caller grants it:
#   on:
#     release:
#       types: [published]
#   jobs:
#     promote-major-tag:
#       permissions:
#         contents: write
#         checks: read
#       uses: JacobPEvans/.github/.github/workflows/promote-major-tag.yml@v1
#       with:
#         tag: ${{ github.event.release.tag_name }}
#       secrets:
#         GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
#
# Only stable tags (vMAJOR.MINOR.PATCH, optionally with +build metadata) move the
# floating tag. Only one promotion runs at a time. The floating tag never moves
# backwards.

name: Promote Major Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote, for example v1.8.5
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: >-
          Release tag to promote, for example v1.8.5. Empty falls back to the
          triggering release event.
        required: false
        type: string
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY:
        required: false

permissions: {}

concurrency:
  group: promote-major-tag
  cancel-in-progress: false

jobs:
  promote:
    name: Move floating major tag
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 30 }}
    permissions:
      contents: write
      checks: read
    steps:
      # github.token can never hold the workflows permission, and moving the tag
      # onto a release that changed a workflow file needs it, so the push uses the release App.
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Check out tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out the promotion script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          sparse-checkout: |
            scripts/promote-major-tag.sh
            scripts/promote-major-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Promote the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          # Only this repo has a Canary check. In a called run github.repository is the
          # caller, so any other repo passes --no-canary; the script ignores an empty
          # second argument.
          NO_CANARY: ${{ github.repository != 'JacobPEvans/.github' && '--no-canary' || '' }}
        run: .gh-shared/scripts/promote-major-release.sh "${RELEASE_TAG:-$INPUT_TAG}" "$NO_CANARY"
